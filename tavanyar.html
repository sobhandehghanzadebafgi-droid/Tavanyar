<script>
  window.addEventListener("error", function (e) {
    var el = document.getElementById("boot-msg");
    if (el && (!window.React || !window.ReactDOM || !window.Babel)) {
      el.innerHTML = "بارگذاری کتابخانه‌های لازم (React/Babel) از CDN ناموفق بود.<br/>لطفاً از اتصال اینترنت خود مطمئن شوید و صفحه را دوباره بارگذاری کنید.";
    }
  }, true);

  window.storage = {
    async get(key, shared) {
      try {
        var raw = window.localStorage.getItem(key);
        if (raw === null || raw === undefined) return null;
        return { key: key, value: raw, shared: !!shared };
      } catch (e) { return null; }
    },
    async set(key, value, shared) {
      try {
        window.localStorage.setItem(key, value);
        return { key: key, value: value, shared: !!shared };
      } catch (e) { return null; }
    },
    async delete(key, shared) {
      try {
        window.localStorage.removeItem(key);
        return { key: key, deleted: true, shared: !!shared };
      } catch (e) { return null; }
    },
    async list(prefix, shared) {
      try {
        var keys = Object.keys(window.localStorage).filter(function (k) { return !prefix || k.indexOf(prefix) === 0; });
        return { keys: keys, prefix: prefix, shared: !!shared };
      } catch (e) { return null; }
    }
  };
</script>

/* -------- نمودار خطی سادهٔ SVG (جایگزین recharts، بدون وابستگی خارجی) -------- */
function MiniLineChart({ data, series, height = 160 }) {
  const width = 640;
  const padding = { top: 12, right: 14, bottom: 26, left: 26 };
  const innerW = width - padding.left - padding.right;
  const innerH = height - padding.top - padding.bottom;
  const n = data.length;
  const xStep = n > 1 ? innerW / (n - 1) : 0;
  const yMin = 0, yMax = 10;
  const yScale = (v) => padding.top + innerH - ((v - yMin) / (yMax - yMin)) * innerH;
  const xScale = (i) => padding.left + i * xStep;
  const gridVals = [0, 2, 4, 6, 8, 10];

  return (
    <div>
      <svg viewBox={`0 0 ${width} ${height}`} width="100%" height={height} preserveAspectRatio="none" style={{ display: "block", direction: "ltr" }}>
        {gridVals.map((v) => (
          <g key={v}>
            <line x1={padding.left} x2={width - padding.right} y1={yScale(v)} y2={yScale(v)} stroke="var(--line)" strokeDasharray="3 3" />
            <text x={padding.left - 6} y={yScale(v) + 3} fontSize="9" textAnchor="end" fill="var(--muted)">{toFa(v)}</text>
          </g>
        ))}
        {data.map((d, i) => (
          n <= 10 || i % Math.ceil(n / 10) === 0 ? (
            <text key={i} x={xScale(i)} y={height - 6} fontSize="9" textAnchor="middle" fill="var(--muted)">{d.date}</text>
          ) : null
        ))}
        {series.map((s) => {
          const points = data.map((d, i) => `${xScale(i)},${yScale(d[s.key] ?? 0)}`).join(" ");
          return (
            <g key={s.key}>
              <polyline points={points} fill="none" stroke={s.color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
              {data.map((d, i) => <circle key={i} cx={xScale(i)} cy={yScale(d[s.key] ?? 0)} r="3" fill={s.color} />)}
            </g>
          );
        })}
      </svg>
      {series.length > 1 && (
        <div style={{ display: "flex", gap: 14, justifyContent: "center", marginTop: 6 }}>
          {series.map((s) => (
            <div key={s.key} style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 11.5, color: "var(--muted)" }}>
              <span style={{ width: 8, height: 8, borderRadius: 999, background: s.color }} />
              {s.label}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function useIsMobile(breakpoint = 760) {
  const [isMobile, setIsMobile] = useState(() => (typeof window !== "undefined" ? window.innerWidth <= breakpoint : false));
  useEffect(() => {
    const onResize = () => setIsMobile(window.innerWidth <= breakpoint);
    window.addEventListener("resize", onResize);
    return () => window.removeEventListener("resize", onResize);
  }, [breakpoint]);
  return isMobile;
}

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const toFa = (n) => String(n).replace(/[0-9]/g, (d) => "۰۱۲۳۴۵۶۷۸۹"[d]);
const todayStr = () => new Date().toISOString().slice(0, 10);
const faDate = () => new Date().toLocaleDateString("fa-IR", { weekday: "long", day: "numeric", month: "long" });
const genAccessCode = (existing) => {
  let c;
  do { c = String(Math.floor(1000 + Math.random() * 9000)); } while (existing.some((p) => p.accessCode === c));
  return c;
};

function computeAssessment(p) {
  const hasFlag = (p.redFlags || []).length > 0;
  if (hasFlag) {
    return { phase: 1, reason: "به‌دلیل وجود علامت هشدار، پیش از پیشروی برنامه، ارزیابی بالینی تکمیلی لازم است." };
  }
  let phase;
  if (p.painNRS >= 7) phase = 1;
  else if (p.painNRS >= 4) phase = p.functionScore < 4 ? 1 : 2;
  else phase = p.functionScore >= 7 ? 3 : 2;
  if (p.timeSinceOnset === "acute" && phase > 1) phase = 1;
  if (p.timeSinceOnset === "chronic" && phase < 2) phase = 2;
  const reasons = {
    1: "درد بالا یا مرحلهٔ حاد — تمرکز بر دامنهٔ بدون درد و تمرینات ایزومتریک ملایم.",
    2: "کنترل نسبی درد — افزودن تقویت و تمرینات ثبات کنترل‌شده.",
    3: "درد کم و عملکرد مناسب — تمرکز بر بازگشت به عملکرد و تقویت پیشرفته.",
  };
  return { phase, reason: reasons[phase] };
}

function buildProgram(patient) {
  const { phase } = computeAssessment(patient);
  const suggested = EXERCISES.filter((e) => (patient.regions || []).includes(e.region) && e.startPhase <= phase).map((e) => e.id);
  const prevMap = new Map((patient.program || []).map((pi) => [pi.exerciseId, pi]));
  return suggested.map((id) => prevMap.get(id) || { exerciseId: id, included: true });
}

function polarToCartesian(cx, cy, r, angleDeg) {
  const rad = (-angleDeg * Math.PI) / 180;
  return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
}
function describeArc(cx, cy, r, startAngle, endAngle) {
  const start = polarToCartesian(cx, cy, r, endAngle);
  const end = polarToCartesian(cx, cy, r, startAngle);
  const largeArcFlag = endAngle - startAngle <= 180 ? "0" : "1";
  return ["M", start.x, start.y, "A", r, r, 0, largeArcFlag, 0, end.x, end.y].join(" ");
}

/* --------------------------------- فیگورهای انسانی متحرک --------------------------------- */

function Swing({ id, pivot, from = 0, to, mode = "rotate", duration = 2.2, delay = 0, loop = false, children }) {
  const name = `m-${id}`;
  let kf = "";
  if (mode === "rotate") kf = `@keyframes ${name}{0%{transform:rotate(${from}deg)}100%{transform:rotate(${to}deg)}}`;
  else if (mode === "translateY") kf = `@keyframes ${name}{0%{transform:translateY(0px)}100%{transform:translateY(${to}px)}}`;
  else if (mode === "translateX") kf = `@keyframes ${name}{0%{transform:translateX(0px)}100%{transform:translateX(${to}px)}}`;
  else if (mode === "scale") kf = `@keyframes ${name}{0%{transform:scale(1)}100%{transform:scale(${to})}}`;
  return (
    <>
      <style>{kf}</style>
      <g style={{
        transformOrigin: pivot ? `${pivot[0]}px ${pivot[1]}px` : "50px 50px",
        animation: `${name} ${duration}s ease-in-out ${delay}s infinite ${loop ? "normal" : "alternate"}`,
      }}>
        {children}
      </g>
    </>
  );
}

const Seg = (x1, y1, x2, y2, w = 6) => <line x1={x1} y1={y1} x2={x2} y2={y2} stroke="var(--teal)" strokeWidth={w} strokeLinecap="round" />;
const HeadC = (cx, cy, r = 7.5) => <circle cx={cx} cy={cy} r={r} fill="var(--teal)" />;
const FigureBase = ({ size, children }) => <svg viewBox="0 0 100 100" width={size} height={size}>{children}</svg>;

function StandingFigure({ id, motion, size }) {
  const shoulder = [50, 24], hip = [50, 55];
  let rightArm = Seg(50, 24, 64, 46, 5.5);
  let leftArm = Seg(50, 24, 36, 46, 5.5);
  let rightLeg = Seg(50, 55, 58, 90, 6);
  let leftLeg = Seg(50, 55, 42, 90, 6);
  let bodyGroup = <>{Seg(50, 21, 50, 55, 6)}{HeadC(50, 14)}</>;

  if (motion === "armRaiseHigh") rightArm = <Swing id={id} pivot={shoulder} from={30} to={-150}>{Seg(50, 24, 64, 46, 5.5)}</Swing>;
  if (motion === "armRotateElbow") rightArm = <>{Seg(50, 24, 62, 36, 5.5)}<Swing id={id} pivot={[62, 36]} from={0} to={70}>{Seg(62, 36, 62, 50, 5)}</Swing></>;
  if (motion === "armSwing") {
    bodyGroup = <g style={{ transform: "rotate(18deg)", transformOrigin: "50px 55px" }}>{Seg(50, 21, 50, 55, 6)}{HeadC(50, 14)}</g>;
    leftArm = <Swing id={id} pivot={[50, 26]} from={-10} to={25} duration={1.8}>{Seg(50, 26, 40, 50, 5)}</Swing>;
  }
  if (motion === "armPress") bodyGroup = <Swing id={id} pivot={[50, 55]} mode="translateX" to={6} duration={1.6}><>{Seg(50, 21, 50, 55, 6)}{HeadC(50, 14)}</></Swing>;
  if (motion === "legAbduct") rightLeg = <Swing id={id} pivot={hip} from={0} to={28}>{Seg(50, 55, 58, 90, 6)}</Swing>;
  if (motion === "balance") rightLeg = <Swing id={id} pivot={hip} from={0} to={-14} duration={2.6}>{Seg(50, 55, 58, 88, 6)}</Swing>;

  if (motion === "squatBend") {
    return (
      <FigureBase size={size}>
        <Swing id={id} pivot={[50, 40]} mode="translateY" to={10} duration={1.6}>
          <>{Seg(50, 21, 50, 55, 6)}{HeadC(50, 14)}{leftArm}{rightArm}{Seg(50, 55, 42, 84, 6)}{Seg(50, 55, 58, 84, 6)}</>
        </Swing>
      </FigureBase>
    );
  }
  if (motion === "stepSide") {
    return (
      <FigureBase size={size}>
        <Swing id={id} mode="translateX" to={8} duration={1.4}>
          <>{bodyGroup}{leftArm}{rightArm}{leftLeg}{rightLeg}</>
        </Swing>
      </FigureBase>
    );
  }
  if (motion === "heelRaise") {
    return (
      <FigureBase size={size}>
        <Swing id={id} mode="translateY" to={-6} duration={1.2}>
          <>{bodyGroup}{leftArm}{rightArm}{leftLeg}{rightLeg}</>
        </Swing>
        {Seg(38, 90, 46, 90, 3)}{Seg(54, 90, 62, 90, 3)}
      </FigureBase>
    );
  }
  if (motion === "walk") {
    rightLeg = <Swing id={id + "r"} pivot={hip} from={-18} to={18} duration={1.1}>{Seg(50, 55, 58, 90, 6)}</Swing>;
    leftLeg = <Swing id={id + "l"} pivot={hip} from={18} to={-18} duration={1.1}>{Seg(50, 55, 42, 90, 6)}</Swing>;
    rightArm = <Swing id={id + "ra"} pivot={shoulder} from={15} to={-15} duration={1.1}>{Seg(50, 24, 64, 46, 5.5)}</Swing>;
    leftArm = <Swing id={id + "la"} pivot={shoulder} from={-15} to={15} duration={1.1}>{Seg(50, 24, 36, 46, 5.5)}</Swing>;
  }

  return <FigureBase size={size}>{leftLeg}{rightLeg}{bodyGroup}{leftArm}{rightArm}</FigureBase>;
}

function BustFigure({ id, motion, size }) {
  const base = <>{Seg(50, 60, 50, 42, 7)}{HeadC(50, 34, 11)}</>;
  let head = base;
  if (motion === "rotate") head = <Swing id={id} pivot={[50, 60]} from={-18} to={18} duration={1.8}>{base}</Swing>;
  if (motion === "tilt") head = <Swing id={id} pivot={[50, 60]} from={-14} to={14} duration={2}>{base}</Swing>;
  if (motion === "tuck") head = <Swing id={id} pivot={[50, 60]} mode="translateY" to={-4} duration={1.6}>{base}</Swing>;
  if (motion === "pulse") head = <Swing id={id} pivot={[50, 60]} mode="scale" to={1.06} duration={1.4}>{base}</Swing>;
  return <FigureBase size={size}>{Seg(28, 70, 72, 70, 7)}{head}</FigureBase>;
}

function SupineFigure({ id, motion, size, legMode = "bent" }) {
  const hip = [55, 50], knee = [68, 32], shoulder = [28, 50];
  let torso = Seg(25, 50, 55, 50, 6);
  const staticArm = Seg(28, 50, 25, 40, 5);
  let arm = staticArm;
  let legEl;

  if (legMode === "straight") {
    const legLine = Seg(55, 50, 85, 50, 6);
    if (motion === "legRaiseStraight") legEl = <Swing id={id} pivot={hip} from={0} to={-40}>{Seg(55, 50, 85, 50, 6)}</Swing>;
    else if (motion === "quadPulse") legEl = <Swing id={id} pivot={hip} mode="scale" to={1.04} duration={1.3}>{legLine}</Swing>;
    else if (motion === "footFlex") legEl = <>{legLine}<Swing id={id} pivot={[85, 50]} from={-18} to={18} duration={1.4}>{Seg(85, 50, 92, 44, 4)}</Swing></>;
    else if (motion === "footCircle") legEl = <>{legLine}<Swing id={id} pivot={[85, 50]} from={0} to={360} duration={2.4} loop>{Seg(85, 50, 92, 44, 4)}</Swing></>;
    else if (motion === "deadBug") {
      legEl = <Swing id={id} pivot={hip} from={-5} to={-40}>{legLine}</Swing>;
      arm = <Swing id={id + "arm"} pivot={shoulder} from={20} to={-60}>{Seg(28, 50, 28, 33, 5)}</Swing>;
    } else legEl = legLine;
  } else {
    if (motion === "kneeToChest") legEl = <Swing id={id} pivot={hip} from={-30} to={-95}><>{Seg(55, 50, 68, 32, 6)}{Seg(68, 32, 78, 50, 6)}</></Swing>;
    else if (motion === "heelSlide") legEl = <>{Seg(55, 50, 68, 32, 6)}<Swing id={id} pivot={knee} from={0} to={45} duration={1.8}>{Seg(68, 32, 78, 50, 6)}</Swing></>;
    else if (motion === "bridgeLift") {
      return (
        <FigureBase size={size}>
          {Seg(25, 50, 55, 50, 6)}{HeadC(18, 50)}{staticArm}
          <Swing id={id} mode="translateY" to={-8} duration={1.6}><>{Seg(55, 50, 68, 32, 6)}{Seg(68, 32, 78, 50, 6)}</></Swing>
        </FigureBase>
      );
    } else legEl = <>{Seg(55, 50, 68, 32, 6)}{Seg(68, 32, 78, 50, 6)}</>;
  }

  if (motion === "pelvicRock") torso = <Swing id={id} pivot={hip} from={-4} to={4} duration={2}>{Seg(25, 50, 55, 50, 6)}</Swing>;

  return <FigureBase size={size}>{torso}{HeadC(18, 50)}{arm}{legEl}</FigureBase>;
}

function ProneFigure({ id, motion, size, kneeSupport = false }) {
  const hip = [55, 55];
  const legEnd = kneeSupport ? [78, 68] : [88, 58];
  if (motion === "holdPulse") {
    return (
      <FigureBase size={size}>
        <Swing id={id} mode="scale" to={1.015} duration={1.6}>
          <>{Seg(25, 55, 55, 55, 6)}{HeadC(18, 55)}{Seg(30, 55, 30, 68, 5)}{Seg(55, 55, legEnd[0], legEnd[1], 6)}</>
        </Swing>
      </FigureBase>
    );
  }
  let upper = <>{Seg(25, 55, 55, 55, 6)}{HeadC(18, 55)}</>;
  if (motion === "pressUp") upper = <Swing id={id} pivot={hip} from={0} to={-16} duration={1.8}><>{Seg(25, 55, 55, 55, 6)}{HeadC(18, 55)}</></Swing>;
  return (
    <FigureBase size={size}>
      {upper}
      {Seg(30, 55, 30, 68, 5)}
      {Seg(55, 55, legEnd[0], legEnd[1], 6)}
    </FigureBase>
  );
}

function QuadrupedFigure({ id, motion, size }) {
  const shoulder = [28, 42], hip = [60, 42];
  let head = <>{Seg(28, 42, 20, 42, 6)}{HeadC(18, 42)}</>;
  if (motion === "archSpine") head = <Swing id={id} pivot={shoulder} from={-16} to={16} duration={2}>{head}</Swing>;
  let frontLeg = Seg(28, 42, 28, 68, 6);
  let backLeg = Seg(60, 42, 60, 68, 6);
  if (motion === "birdDog") {
    frontLeg = <Swing id={id + "f"} pivot={shoulder} from={0} to={-45}>{Seg(28, 42, 15, 60, 6)}</Swing>;
    backLeg = <Swing id={id + "b"} pivot={hip} from={0} to={35}>{Seg(60, 42, 82, 55, 6)}</Swing>;
  }
  return <FigureBase size={size}>{Seg(28, 42, 60, 42, 6)}{head}{frontLeg}{backLeg}</FigureBase>;
}

function SideLyingFigure({ id, motion, size }) {
  const hip = [55, 32];
  let topThigh = <Swing id={id} pivot={hip} from={0} to={-30} duration={1.8}><>{Seg(55, 34, 70, 48, 6)}{Seg(70, 48, 62, 58, 6)}</></Swing>;
  let arm = Seg(30, 30, 30, 18, 5);
  if (motion === "forearmRotate") {
    topThigh = <>{Seg(55, 34, 70, 48, 6)}{Seg(70, 48, 62, 58, 6)}</>;
    arm = <>{Seg(30, 30, 40, 30, 5)}<Swing id={id} pivot={[40, 30]} from={-10} to={-55} duration={1.8}>{Seg(40, 30, 40, 18, 5)}</Swing></>;
  }
  return (
    <FigureBase size={size}>
      {Seg(26, 30, 55, 30, 6)}{HeadC(20, 30)}
      {Seg(55, 30, 68, 44, 6)}{Seg(68, 44, 58, 54, 6)}
      {topThigh}{arm}
    </FigureBase>
  );
}

function KneelingFigure({ id, motion, size }) {
  const hip = [55, 55];
  let upper = <>{Seg(55, 55, 55, 25, 6)}{HeadC(55, 18)}</>;
  if (motion === "sink") upper = <Swing id={id} pivot={hip} mode="translateX" to={5} duration={2.2}>{upper}</Swing>;
  return (
    <FigureBase size={size}>
      {Seg(55, 55, 45, 70, 6)}{Seg(45, 70, 45, 85, 6)}
      {Seg(55, 55, 65, 80, 6)}
      {upper}
    </FigureBase>
  );
}

function ExerciseFigure({ ex, size = 56 }) {
  const props = { id: ex.id, motion: ex.motion, size };
  switch (ex.posture) {
    case "standing": return <StandingFigure {...props} />;
    case "bust": return <BustFigure {...props} />;
    case "supine": return <SupineFigure {...props} legMode={ex.legMode || "bent"} />;
    case "prone": return <ProneFigure {...props} kneeSupport={ex.kneeSupport} />;
    case "quadruped": return <QuadrupedFigure {...props} />;
    case "sidelying": return <SideLyingFigure {...props} />;
    case "kneeling": return <KneelingFigure {...props} />;
    default: return <StandingFigure {...props} />;
  }
}

function SemiGauge({ value, max = 10, invert = false, label }) {
  const pct = Math.max(0, Math.min(1, value / max));
  const angle = -90 + pct * 180;
  const color = invert
    ? value >= 7 ? "var(--sage)" : value >= 4 ? "var(--amber)" : "var(--coral)"
    : value >= 7 ? "var(--coral)" : value >= 4 ? "var(--amber)" : "var(--sage)";
  return (
    <div style={{ textAlign: "center" }}>
      <svg viewBox="0 0 120 68" width="140" height="80">
        <path d={describeArc(60, 60, 50, 0, 60)} stroke="var(--coral)" strokeOpacity={invert ? 0.25 : 0.9} strokeWidth="10" fill="none" strokeLinecap="round" />
        <path d={describeArc(60, 60, 50, 60, 120)} stroke="var(--amber)" strokeOpacity="0.9" strokeWidth="10" fill="none" strokeLinecap="round" />
        <path d={describeArc(60, 60, 50, 120, 180)} stroke="var(--sage)" strokeOpacity={invert ? 0.9 : 0.25} strokeWidth="10" fill="none" strokeLinecap="round" />
        <g style={{ transformOrigin: "60px 60px", transform: `rotate(${angle}deg)`, transition: "transform .4s ease" }}>
          <line x1="60" y1="60" x2="60" y2="16" stroke="var(--ink)" strokeWidth="3" strokeLinecap="round" />
        </g>
        <circle cx="60" cy="60" r="4" fill="var(--ink)" />
      </svg>
      <div style={{ fontFamily: "IBM Plex Mono, monospace", fontSize: 22, fontWeight: 600, color }}>{toFa(value)}<span style={{ fontSize: 13, color: "var(--muted)" }}>/{toFa(max)}</span></div>
      <div style={{ fontSize: 12, color: "var(--muted)" }}>{label}</div>
    </div>
  );
}

function PhaseBadge({ phase, size = "md" }) {
  const m = PHASE_META[phase];
  return (
    <span style={{
      display: "inline-flex", alignItems: "center", gap: 6,
      background: `${m.color}1a`, color: m.color, border: `1px solid ${m.color}55`,
      borderRadius: 999, padding: size === "sm" ? "2px 9px" : "4px 12px",
      fontSize: size === "sm" ? 11 : 13, fontWeight: 600, whiteSpace: "nowrap",
    }}>
      <span style={{ width: 6, height: 6, borderRadius: 999, background: m.color }} />
      {m.short} · {m.label}
    </span>
  );
}

function CategoryTag({ category }) {
  const meta = CATEGORY_META[category];
  const Icon = meta.icon;
  return (
    <span style={{ display: "inline-flex", alignItems: "center", gap: 4, fontSize: 11.5, color: "var(--muted)" }}>

function ExerciseDetails({ ex, phase }) {

function DoctorConsole({ patients, setPatients }) {
  const isMobile = useIsMobile();
  const [selectedId, setSelectedId] = useState(patients[0]?.id || null);
  const [tab, setTab] = useState("assess");
  const [showForm, setShowForm] = useState(false);
  const [editing, setEditing] = useState(null);
  const [search, setSearch] = useState("");
  const [libRegion, setLibRegion] = useState("all");

  useEffect(() => { if (!selectedId && patients[0]) setSelectedId(patients[0].id); }, [patients]);
  const patient = patients.find((p) => p.id === selectedId);

  const updatePatient = (id, updater) => {
    setPatients((prev) => prev.map((p) => (p.id === id ? { ...updater(p), updatedAt: Date.now() } : p)));
  };

  const savePatient = (form) => {
    if (editing) {
      updatePatient(editing.id, (p) => ({ ...p, ...form }));
    } else {
      const np = { id: uid(), accessCode: genAccessCode(patients), ...form, createdAt: Date.now(), history: [{ date: todayStr(), pain: form.painNRS, func: form.functionScore }], program: [], adherence: [] };
      setPatients((prev) => [...prev, np]);
      setSelectedId(np.id);
    }
    setShowForm(false); setEditing(null);
  };

  const removePatient = (id) => {
    setPatients((prev) => prev.filter((p) => p.id !== id));
    if (selectedId === id) setSelectedId(null);
  };

  const filteredPatients = patients.filter((p) => p.name.includes(search));

  return (
    <div style={{ display: "flex", flexDirection: isMobile ? "column" : "row", gap: isMobile ? 12 : 18, alignItems: "flex-start", maxWidth: 1180, margin: "0 auto", padding: isMobile ? "0 12px" : "0 16px" }}>
      <div style={{ width: isMobile ? "100%" : 260, flexShrink: 0, background: "var(--card)", border: "1px solid var(--line)", borderRadius: 16, padding: 14, position: isMobile ? "static" : "sticky", top: isMobile ? undefined : 88 }}>
        <div style={{ display: "flex", gap: 8, marginBottom: 10 }}>
          <div style={{ flex: 1, display: "flex", alignItems: "center", gap: 6, background: "var(--paper)", borderRadius: 10, padding: "6px 10px" }}>
            <Search size={14} color="var(--muted)" />
            <input value={search} onChange={(e) => setSearch(e.target.value)} placeholder="جستجوی بیمار" style={{ all: "unset", fontSize: 13, flex: 1 }} />
          </div>
          <button onClick={() => { setEditing(null); setShowForm(true); }} title="بیمار جدید" style={{ all: "unset", cursor: "pointer", background: "var(--teal)", borderRadius: 10, width: 34, height: 34, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
            <Plus size={18} color="#fff" />
          </button>
        </div>
        <div style={{ display: "grid", gap: 6, maxHeight: isMobile ? 240 : 520, overflowY: "auto" }}>
          {filteredPatients.length === 0 && <div style={{ fontSize: 12.5, color: "var(--muted)", padding: 10, textAlign: "center" }}>بیماری یافت نشد</div>}
          {filteredPatients.map((p) => {
            const a = computeAssessment(p);
            return (
              <button key={p.id} onClick={() => setSelectedId(p.id)} style={{
                all: "unset", cursor: "pointer", display: "flex", alignItems: "center", gap: 10, padding: "9px 10px", borderRadius: 11,
                background: selectedId === p.id ? "var(--paper)" : "transparent", border: selectedId === p.id ? "1px solid var(--teal)" : "1px solid transparent",
              }}>
                <div style={{ width: 34, height: 34, borderRadius: 999, background: `${PHASE_META[a.phase].color}22`, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                  <User size={16} color={PHASE_META[a.phase].color} />
                </div>
                <div style={{ minWidth: 0, flex: 1 }}>
                  <div style={{ fontSize: 13.5, fontWeight: 600, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{p.name}</div>
                  <div style={{ fontSize: 11, color: "var(--muted)" }}>{p.regions.map((r) => REGIONS.find((x) => x.id === r)?.label).join("، ")}</div>
                </div>
              </button>
            );
          })}
        </div>
      </div>

      <div style={{ flex: 1, minWidth: 0, width: isMobile ? "100%" : "auto" }}>
        <div style={{ display: "flex", gap: 6, marginBottom: 16, borderBottom: "1px solid var(--line)", overflowX: "auto", WebkitOverflowScrolling: "touch" }}>
          {[{ id: "assess", l: "ارزیابی و الگوریتم", icon: Activity }, { id: "program", l: "برنامهٔ ورزشی", icon: ClipboardList }, { id: "library", l: "کتابخانهٔ ورزش‌ها", icon: Dumbbell }].map((t) => (
            <button key={t.id} onClick={() => setTab(t.id)} style={{
              all: "unset", cursor: "pointer", display: "flex", alignItems: "center", gap: 6, padding: "10px 12px", fontSize: 13,
              fontWeight: tab === t.id ? 700 : 500, color: tab === t.id ? "var(--teal-deep)" : "var(--muted)",
              borderBottom: tab === t.id ? "2px solid var(--teal)" : "2px solid transparent", whiteSpace: "nowrap", flexShrink: 0,
            }}>
              <t.icon size={15} /> {t.l}
            </button>
          ))}
        </div>

        {tab === "library" && (
          <div>
            <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 14 }}>
              <button onClick={() => setLibRegion("all")} style={chip(libRegion === "all")}>همه</button>
              {REGIONS.map((r) => <button key={r.id} onClick={() => setLibRegion(r.id)} style={chip(libRegion === r.id)}>{r.label}</button>)}
            </div>
            <div style={{ display: "grid", gridTemplateColumns: isMobile ? "1fr" : "repeat(auto-fill,minmax(280px,1fr))", gap: 10 }}>
              {EXERCISES.filter((e) => libRegion === "all" || e.region === libRegion).map((e) => <LibraryCard key={e.id} ex={e} />)}
            </div>
          </div>
        )}

        {!patient && tab !== "library" && (
          <EmptyState icon={Users} title="بیماری انتخاب نشده" desc="از فهرست سمت راست یک بیمار را انتخاب کنید یا یک بیمار جدید اضافه کنید." action={{ label: "افزودن بیمار جدید", onClick: () => { setEditing(null); setShowForm(true); } }} />
        )}

        {patient && tab === "assess" && (
          <AssessTab patient={patient} onEdit={() => { setEditing(patient); setShowForm(true); }} onDelete={() => removePatient(patient.id)}
            onUpdate={(updater) => updatePatient(patient.id, updater)} />
        )}

        {patient && tab === "program" && (
          <ProgramTab patient={patient} onUpdate={(updater) => updatePatient(patient.id, updater)} />
        )}
      </div>

      {showForm && <PatientFormModal initial={editing} onSave={savePatient} onClose={() => { setShowForm(false); setEditing(null); }} />}
    </div>
  );
}

          <div>
            <div style={{ fontFamily: "Fraunces, serif", fontSize: 22, fontWeight: 600 }}>{patient.name}</div>

              {patient.age ? `${toFa(patient.age)} سال · ` : ""}{patient.regions.map((r) => REGIONS.find((x) => x.id === r)?.label).join("، ")}
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 6, marginTop: 8 }}>
              <KeyRound size={13} color="var(--muted)" />
              <span style={{ fontSize: 11.5, color: "var(--muted)" }}>کد دسترسی بیمار:</span>
              <span style={{ fontFamily: "IBM Plex Mono, monospace", fontSize: 13.5, letterSpacing: 2, color: "var(--teal-deep)", background: "var(--paper)", padding: "2px 9px", borderRadius: 7, fontWeight: 700 }}>{patient.accessCode}</span>
              <button onClick={() => onUpdate((p) => ({ ...p, accessCode: String(Math.floor(1000 + Math.random() * 9000)) }))} style={{ all: "unset", cursor: "pointer", fontSize: 11, color: "var(--muted)", textDecoration: "underline" }}>تولید کد جدید</button>
            </div>
          </div>
          <div style={{ display: "flex", gap: 6 }}>
            <button onClick={onEdit} style={iconBtn}><Edit3 size={15} /></button>
            <button onClick={() => (confirmDel ? onDelete() : setConfirmDel(true))} style={{ ...iconBtn, color: confirmDel ? "#fff" : "var(--coral)", background: confirmDel ? "var(--coral)" : "transparent" }}>
              {confirmDel ? "مطمئنید؟" : <Trash2 size={15} />}
            </button>
          </div>
        </div>

        {assessment.reason.includes("هشدار") && (
          <div style={{ marginTop: 12, display: "flex", gap: 8, background: "#D9645A14", color: "var(--coral)", padding: "10px 12px", borderRadius: 10, fontSize: 13 }}>
            <AlertTriangle size={16} style={{ flexShrink: 0, marginTop: 1 }} /> {assessment.reason}
          </div>
        )}

        <div style={{ display: "flex", gap: 26, marginTop: 18, flexWrap: "wrap", alignItems: "center" }}>
          <SemiGauge value={patient.painNRS} label="شدت درد (NRS)" />
          <SemiGauge value={patient.functionScore} invert label="سطح عملکرد" />
          <div style={{ flex: 1, minWidth: 180 }}>
            <div style={{ fontSize: 12, color: "var(--muted)", marginBottom: 6 }}>فاز پیشنهادی الگوریتم</div>
            <PhaseBadge phase={assessment.phase} />
            {!assessment.reason.includes("هشدار") && <div style={{ fontSize: 12.5, color: "var(--muted)", marginTop: 8, lineHeight: 1.7 }}>{assessment.reason}</div>}
          </div>
        </div>
      </div>

      {chartData.length > 1 && (
        <div style={{ background: "var(--card)", border: "1px solid var(--line)", borderRadius: 16, padding: 18 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 13.5, fontWeight: 600, marginBottom: 10, color: "var(--ink)" }}>
            <TrendingUp size={15} /> روند درد و عملکرد
          </div>
          <MiniLineChart
            data={chartData}
            height={180}
            series={[
              { key: "pain", color: "var(--coral)", label: "درد" },
              { key: "func", color: "var(--sage)", label: "عملکرد" },
            ]}
          />
        </div>
      )}

      <div style={{ background: "var(--card)", border: "1px solid var(--line)", borderRadius: 16, padding: 18 }}>
        <div style={{ fontSize: 13.5, fontWeight: 600, marginBottom: 10 }}>به‌روزرسانی سریع وضعیت</div>
        <div style={{ display: "flex", gap: 20, flexWrap: "wrap" }}>
          <div style={{ flex: 1, minWidth: 200 }}>
            <label style={{ fontSize: 12, color: "var(--muted)" }}>درد (NRS): {toFa(patient.painNRS)}</label>
            <input type="range" min="0" max="10" value={patient.painNRS} onChange={(e) => onUpdate((p) => ({ ...p, painNRS: +e.target.value }))} style={{ width: "100%", accentColor: "var(--coral)" }} />
          </div>
          <div style={{ flex: 1, minWidth: 200 }}>
            <label style={{ fontSize: 12, color: "var(--muted)" }}>عملکرد: {toFa(patient.functionScore)}</label>
            <input type="range" min="0" max="10" value={patient.functionScore} onChange={(e) => onUpdate((p) => ({ ...p, functionScore: +e.target.value }))} style={{ width: "100%", accentColor: "var(--sage)" }} />
          </div>
        </div>
        <button
          onClick={() => onUpdate((p) => {
            const hist = [...(p.history || [])];
            const idx = hist.findIndex((h) => h.date === todayStr());
            const entry = { date: todayStr(), pain: p.painNRS, func: p.functionScore };
            if (idx >= 0) hist[idx] = entry; else hist.push(entry);
            return { ...p, history: hist, program: buildProgram(p) };
          })}
          style={{ marginTop: 14, display: "flex", alignItems: "center", gap: 6, padding: "9px 16px", borderRadius: 10, border: "none", background: "var(--teal)", color: "#fff", fontWeight: 600, fontSize: 13.5, cursor: "pointer" }}
        >
          <Sparkles size={15} /> ثبت وضعیت امروز و به‌روزرسانی برنامه
        </button>
      </div>
    </div>
  );
}

function ProgramTab({ patient, onUpdate }) {
  const assessment = computeAssessment(patient);
  const program = patient.program && patient.program.length ? patient.program : [];
  const regenerate = () => onUpdate((p) => ({ ...p, program: buildProgram(p) }));
  const toggle = (exId) => onUpdate((p) => ({ ...p, program: p.program.map((pi) => (pi.exerciseId === exId ? { ...pi, included: !pi.included } : pi)) }));

  const grouped = REGIONS.map((r) => ({
    region: r,
    items: program.filter((pi) => EXERCISES.find((e) => e.id === pi.exerciseId)?.region === r.id),
  })).filter((g) => g.items.length);

  return (
    <div style={{ display: "grid", gap: 16 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 10 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <PhaseBadge phase={assessment.phase} />
          <span style={{ fontSize: 12.5, color: "var(--muted)" }}>{program.filter((p) => p.included).length} ورزش فعال از {program.length}</span>
        </div>
        <button onClick={regenerate} style={{ display: "flex", alignItems: "center", gap: 6, padding: "8px 14px", borderRadius: 10, border: "1px solid var(--teal)", background: "#fff", color: "var(--teal-deep)", fontWeight: 600, fontSize: 12.5, cursor: "pointer" }}>
          <Sparkles size={14} /> ساخت/به‌روزرسانی برنامه بر اساس ارزیابی
        </button>
      </div>

      {program.length === 0 && (
        <EmptyState icon={ClipboardList} title="هنوز برنامه‌ای ساخته نشده" desc="روی «ساخت برنامه بر اساس ارزیابی» بزنید تا الگوریتم با توجه به درد، عملکرد و ناحیهٔ درگیر، ورزش‌های مناسب را پیشنهاد دهد." action={{ label: "ساخت برنامه", onClick: regenerate }} />
      )}

      {grouped.map((g) => (
        <div key={g.region.id}>
          <div style={{ fontSize: 12.5, fontWeight: 700, color: "var(--muted)", marginBottom: 8 }}>{g.region.label}</div>
          <div style={{ display: "grid", gap: 8 }}>
            {g.items.map((pi) => {
              const ex = EXERCISES.find((e) => e.id === pi.exerciseId);
              return <ProgramRow key={pi.exerciseId} ex={ex} phase={assessment.phase} included={pi.included} onToggle={() => toggle(pi.exerciseId)} />;
            })}
          </div>
        </div>
      ))}
    </div>
  );
}

/* --------------------------------- ورود و پورتال بیمار --------------------------------- */

function PatientLockScreen({ patients, onUnlock }) {
  const [code, setCode] = useState("");
  const [error, setError] = useState("");
  const submit = () => {
    const found = patients.find((p) => p.accessCode === code.trim());
    if (found) { onUnlock(found.id); setError(""); }
    else setError("کد نامعتبر است. کد ۴ رقمی را از پزشک خود بگیرید.");
  };
  return (
    <div style={{ maxWidth: 380, margin: "50px auto", textAlign: "center", background: "var(--card)", border: "1px solid var(--line)", borderRadius: 18, padding: 28 }}>
      <div style={{ width: 52, height: 52, borderRadius: 14, background: "var(--paper)", display: "flex", alignItems: "center", justifyContent: "center", margin: "0 auto 14px" }}>
        <Lock size={22} color="var(--teal)" />
      </div>
      <div style={{ fontFamily: "Fraunces, serif", fontSize: 19, fontWeight: 600 }}>ورود بیمار</div>
      <div style={{ fontSize: 12.5, color: "var(--muted)", marginTop: 6 }}>کد دسترسی ۴ رقمی که پزشک به شما داده را وارد کنید.</div>
      <input
        value={code}
        onChange={(e) => setCode(e.target.value.replace(/\D/g, "").slice(0, 4))}
        onKeyDown={(e) => e.key === "Enter" && submit()}
        placeholder="----"
        style={{ ...inputStyle, textAlign: "center", fontSize: 22, letterSpacing: 8, fontFamily: "IBM Plex Mono, monospace", marginTop: 16 }}
      />
      {error && <div style={{ color: "var(--coral)", fontSize: 12, marginTop: 8 }}>{error}</div>}
      <button onClick={submit} style={{ marginTop: 14, width: "100%", padding: "10px", borderRadius: 10, border: "none", background: "var(--teal)", color: "#fff", fontWeight: 700, cursor: "pointer" }}>ورود</button>
      <div style={{ marginTop: 14, fontSize: 10.5, color: "var(--muted)", lineHeight: 1.7 }}>
        این کد فقط یک قفل سادهٔ نمایشی است، نه رمزنگاری واقعی. برای دادهٔ بالینی حساسِ واقعی به یک سامانهٔ احراز هویت معتبر (سرور و دیتابیس اختصاصی) نیاز است.
      </div>
    </div>
  );
}

function PatientPortal({ patient, setPatients, onLock }) {
  const assessment = computeAssessment(patient);
  const included = (patient.program || []).filter((pi) => pi.included);

  const logExercise = (exId, before, after) => {
    setPatients((prev) => prev.map((p) => {
      if (p.id !== patient.id) return p;
      const adherence = [...(p.adherence || []).filter((a) => !(a.date === todayStr() && a.exerciseId === exId)), { date: todayStr(), exerciseId: exId, painBefore: before, painAfter: after }];
      const hist = [...(p.history || [])];
      const idx = hist.findIndex((h) => h.date === todayStr());
      const entry = { date: todayStr(), pain: after, func: p.functionScore };
      if (idx >= 0) hist[idx] = entry; else hist.push(entry);
      return { ...p, adherence, history: hist };
    }));
  };

  const last7 = Array.from({ length: 7 }, (_, i) => { const d = new Date(); d.setDate(d.getDate() - i); return d.toISOString().slice(0, 10); });
  const doneDays = new Set((patient.adherence || []).filter((a) => last7.includes(a.date)).map((a) => a.date)).size;
  const adherencePct = Math.round((doneDays / 7) * 100);

  return (
    <div style={{ maxWidth: 640, margin: "0 auto", padding: "0 16px" }}>
      <div style={{ display: "flex", justifyContent: "flex-end", marginBottom: 8 }}>
        <button onClick={onLock} style={{ all: "unset", cursor: "pointer", display: "flex", alignItems: "center", gap: 5, fontSize: 12, color: "var(--muted)" }}>
          <LogOut size={13} /> خروج
        </button>
      </div>

      <div style={{ background: "linear-gradient(135deg, var(--teal), var(--teal-deep))", borderRadius: 18, padding: 20, color: "#fff", marginBottom: 16 }}>
        <div style={{ fontSize: 13, opacity: 0.85 }}>{faDate()}</div>
        <div style={{ fontFamily: "Fraunces, serif", fontSize: 24, fontWeight: 600, marginTop: 4 }}>سلام {patient.name} 👋</div>
        <div style={{ fontSize: 13, opacity: 0.9, marginTop: 6 }}>برنامهٔ امروز شما {toFa(included.length)} حرکت دارد — {toFa(adherencePct)}٪ پایبندی در ۷ روز اخیر</div>
      </div>

      {included.length === 0 && <EmptyState icon={ClipboardList} title="برنامه‌ای تنظیم نشده" desc="از پزشک خود بخواهید برنامهٔ ورزشی شما را تنظیم کند." />}

      <div style={{ display: "grid", gap: 12 }}>
        {included.map((pi) => {
          const ex = EXERCISES.find((e) => e.id === pi.exerciseId);
          const done = (patient.adherence || []).some((a) => a.date === todayStr() && a.exerciseId === ex.id);
          return <PortalCard key={ex.id} ex={ex} phase={assessment.phase} done={done} onLog={(b, a) => logExercise(ex.id, b, a)} />;
        })}
      </div>

      {(patient.history || []).length > 1 && (
        <div style={{ background: "var(--card)", border: "1px solid var(--line)", borderRadius: 16, padding: 18, marginTop: 16 }}>
          <div style={{ fontSize: 13.5, fontWeight: 600, marginBottom: 10 }}>روند درد شما</div>
          <MiniLineChart
            data={patient.history.map((h) => ({ date: new Date(h.date).toLocaleDateString("fa-IR", { day: "numeric", month: "short" }), pain: h.pain }))}
            height={140}
            series={[{ key: "pain", color: "var(--coral)", label: "درد" }]}
          />
        </div>
      )}
    </div>
  );
}

/* --------------------------------- اپ اصلی --------------------------------- */

function App() {
  const [patients, setPatients] = useState([]);
  const [mode, setMode] = useState("doctor");
  const [loading, setLoading] = useState(true);
  const [savedTick, setSavedTick] = useState(false);
  const [unlockedId, setUnlockedId] = useState(null);
  const mounted = useRef(false);
  const [resetConfirm, setResetConfirm] = useState(false);

  useEffect(() => {
    (async () => {
      try {
        const res = await window.storage.get("tavanyar-patients-shared-v1", true);
        setPatients(res ? JSON.parse(res.value) : []);
      } catch (e) { setPatients([]); }
      setLoading(false);
      mounted.current = true;
    })();
  }, []);

  useEffect(() => {
    if (!mounted.current) return;
    const t = setTimeout(async () => {
      try {
        await window.storage.set("tavanyar-patients-shared-v1", JSON.stringify(patients), true);
        setSavedTick(true);
        setTimeout(() => setSavedTick(false), 1200);
      } catch (e) { /* ذخیره بعداً دوباره تلاش می‌شود */ }
    }, 500);
    return () => clearTimeout(t);
  }, [patients]);

  const resetAll = async () => {
    setPatients([]);
    try { await window.storage.set("tavanyar-patients-shared-v1", JSON.stringify([]), true); } catch (e) {}
    setResetConfirm(false);
  };

  const unlockedPatient = patients.find((p) => p.id === unlockedId);

  return (
    <div style={{ minHeight: "100vh", background: "var(--paper)", direction: "rtl", fontFamily: "Inter, sans-serif", color: "var(--ink)", paddingBottom: 60 }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
        :root{
          --ink:#16232E; --teal:#2C7A7B; --teal-deep:#1F5B5C; --paper:#F1F4F1; --card:#FFFFFF;
          --coral:#D9645A; --sage:#6E9C7D; --amber:#C98A3B; --line:#DCE3DE; --muted:#5B6B66;
        }
        * { box-sizing: border-box; }
        body { margin: 0; }
        input[type=range]{ height:4px; border-radius:999px; }
        ::selection{ background: var(--teal); color:#fff; }
        @media (prefers-reduced-motion: reduce){ *{ animation-duration: .01ms !important; } }
      `}</style>

      <header style={{ position: "sticky", top: 0, zIndex: 20, background: "#F1F4F1EE", backdropFilter: "blur(6px)", borderBottom: "1px solid var(--line)", padding: "12px 16px" }}>
        <div style={{ maxWidth: 1180, margin: "0 auto", display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12, flexWrap: "wrap" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <div style={{ width: 38, height: 38, borderRadius: 11, background: "var(--teal)", display: "flex", alignItems: "center", justifyContent: "center" }}>
              <Stethoscope size={19} color="#fff" />
            </div>
            <div>
              <div style={{ fontFamily: "Fraunces, serif", fontWeight: 700, fontSize: 17, lineHeight: 1.1 }}>توان‌یار</div>
              <div style={{ fontSize: 10.5, color: "var(--muted)" }}>دستیار هوشمند تجویز ورزش توانبخشی</div>
            </div>
          </div>

          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            {savedTick && <span style={{ fontSize: 11, color: "var(--sage)" }}>ذخیره شد ✓</span>}
            <div style={{ display: "flex", background: "var(--card)", borderRadius: 999, padding: 3, border: "1px solid var(--line)" }}>
              {[{ id: "doctor", l: "پزشک", icon: Stethoscope }, { id: "patient", l: "بیمار", icon: User }].map((m) => (
                <button key={m.id} onClick={() => setMode(m.id)} style={{
                  all: "unset", cursor: "pointer", display: "flex", alignItems: "center", gap: 6, padding: "7px 14px", borderRadius: 999,
                  fontSize: 12.5, fontWeight: 600, background: mode === m.id ? "var(--teal)" : "transparent", color: mode === m.id ? "#fff" : "var(--muted)",
                }}>
                  <m.icon size={13} /> {m.l}
                </button>
              ))}
            </div>
          </div>
        </div>
      </header>

      <div style={{ maxWidth: 1180, margin: "0 auto", padding: "10px 16px 0" }}>
        <div style={{ display: "flex", gap: 8, alignItems: "flex-start", fontSize: 11.5, color: "var(--muted)" }}>
          <Info size={13} style={{ flexShrink: 0, marginTop: 1 }} />
          این ابزار صرفاً کمک‌تصمیم بالینی است و جایگزین قضاوت پزشک نمی‌شود. دادهٔ بیماران برای دسترسیِ بیمار از دستگاه خودش به‌صورت مشترک ذخیره می‌شود و فقط با یک کد ۴ رقمی محافظت سطحی دارد؛ این معادل احراز هویت واقعی نیست — برای اطلاعات بالینی حساس واقعی از یک سامانهٔ اختصاصی با ورود امن استفاده کنید.
        </div>
      </div>

      <div style={{ marginTop: 18 }}>
        {loading ? (
          <div style={{ textAlign: "center", padding: 60, color: "var(--muted)", fontSize: 13 }}>در حال بارگذاری…</div>
        ) : mode === "doctor" ? (
          <DoctorConsole patients={patients} setPatients={setPatients} />
        ) : unlockedPatient ? (
          <PatientPortal patient={unlockedPatient} setPatients={setPatients} onLock={() => setUnlockedId(null)} />
        ) : (
          <PatientLockScreen patients={patients} onUnlock={setUnlockedId} />
        )}
      </div>

      <div style={{ textAlign: "center", marginTop: 40 }}>
        <button onClick={() => (resetConfirm ? resetAll() : setResetConfirm(true))} style={{ all: "unset", cursor: "pointer", fontSize: 11, color: "var(--muted)" }}>
          {resetConfirm ? "برای پاک‌شدن همهٔ داده‌ها دوباره کلیک کنید" : "پاک کردن همهٔ داده‌ها"}
        </button>
      </div>
    </div>
  );
}


try {
  const rootEl = document.getElementById("root");
  const root = ReactDOM.createRoot(rootEl);
  root.render(<App />);
} catch (err) {
  document.getElementById("root").innerHTML =
    '<div id="boot-msg">خطا در اجرای برنامه: ' + (err && err.message ? err.message : err) + '</div>';
  console.error(err);
}
</script>
</body>
</html>

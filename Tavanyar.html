<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0F766E" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>توان‌یار کلینیک — دستیار تشخیصی و تجویز توانبخشی | بر پایه Braddom's PM&R</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<style>
  :root{
    --brand:#0F766E; --brand-d:#115E59; --brand-l:#CCFBF1; --brand-ll:#F0FDFA;
    --ink:#1E293B; --ink2:#475569; --muted:#64748B; --line:#E2E8F0; --line2:#CBD5E1;
    --bg:#F1F5F9; --card:#FFFFFF; --red:#DC2626; --red-l:#FEF2F2; --amber:#B45309; --amber-l:#FFFBEB;
    --green:#15803D; --green-l:#F0FDF4; --blue:#1D4ED8; --blue-l:#EFF6FF; --violet:#7C3AED; --violet-l:#F5F3FF;
    --r:16px; --shadow:0 1px 3px rgba(15,23,42,.07),0 8px 24px -12px rgba(15,23,42,.12);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{font-family:Vazirmatn,system-ui,sans-serif; background:var(--bg); color:var(--ink); line-height:1.75; font-size:14.5px;}
  #root{min-height:100vh;}
  #boot-msg{min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Vazirmatn,sans-serif;color:var(--muted);direction:rtl;text-align:center;padding:24px;font-size:14px;}
  button{font-family:inherit;}
  .wrap{max-width:1080px;margin:0 auto;padding:0 16px;}
  .muted{color:var(--muted);}
  .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .col{display:flex;flex-direction:column;gap:8px;}
  .mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}
  .mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}

  /* ===== Header ===== */
  .hdr{position:sticky;top:0;z-index:50;background:linear-gradient(135deg,#134E4A,#0F766E 55%,#0D9488);color:#fff;box-shadow:0 2px 14px rgba(15,118,110,.28);}
  .hdr-in{display:flex;align-items:center;gap:14px;padding:12px 16px;}
  .logo{width:42px;height:42px;border-radius:13px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;flex:0 0 auto;border:1px solid rgba(255,255,255,.22);}
  .hdr h1{font-size:17px;margin:0;font-weight:800;letter-spacing:-.2px;line-height:1.4;}
  .hdr .sub{font-size:11.5px;opacity:.85;font-weight:500;}
  .hdr .actions{margin-inline-start:auto;display:flex;gap:8px;}
  .chip-btn{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:999px;padding:6px 13px;font-size:12px;font-weight:600;cursor:pointer;transition:.15s;}
  .chip-btn:hover{background:rgba(255,255,255,.24);}
  .chip-btn.solid{background:#fff;color:var(--brand-d);border-color:#fff;}

  /* ===== Stepper ===== */
  .steps{display:flex;gap:6px;overflow-x:auto;padding:12px 4px 6px;scrollbar-width:thin;}
  .step{flex:1;min-width:150px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;display:flex;align-items:center;gap:9px;cursor:pointer;transition:.18s;}
  .step:hover{border-color:var(--line2);}
  .step.active{border-color:var(--brand);background:var(--brand-ll);box-shadow:0 0 0 3px rgba(15,118,110,.12);}
  .step.done{border-color:var(--brand-l);background:var(--brand-ll);}
  .step .n{width:24px;height:24px;border-radius:999px;background:var(--line);color:var(--ink2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex:0 0 auto;}
  .step.active .n,.step.done .n{background:var(--brand);color:#fff;}
  .step .t{font-size:12px;font-weight:700;color:var(--ink2);white-space:nowrap;}
  .step.active .t{color:var(--brand-d);}

  /* ===== Cards ===== */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;}
  .card + .card{margin-top:12px;}
  .sec-title{font-size:15px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:9px;margin:2px 0 4px;}
  .sec-title .bar{width:4px;height:18px;border-radius:4px;background:var(--brand);display:inline-block;}
  .sec-desc{font-size:12.5px;color:var(--muted);margin:0 0 12px;}

  /* ===== Region grid ===== */
  .region-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;}
  .region-card{border:1.5px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;transition:.16s;background:#fff;display:flex;flex-direction:column;gap:6px;}
  .region-card:hover{border-color:var(--brand);transform:translateY(-1px);box-shadow:var(--shadow);}
  .region-card.sel{border-color:var(--brand);background:var(--brand-ll);box-shadow:0 0 0 3px rgba(15,118,110,.13);}
  .region-card .ic{width:38px;height:38px;border-radius:11px;background:var(--brand-l);color:var(--brand-d);display:flex;align-items:center;justify-content:center;}
  .region-card .nm{font-weight:800;font-size:13.5px;}
  .region-card .hn{font-size:11.5px;color:var(--muted);line-height:1.6;}

  /* ===== Disease cards ===== */
  .dz-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;}
  .dz-card{border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;cursor:pointer;transition:.16s;background:#fff;}
  .dz-card:hover{border-color:var(--brand);box-shadow:var(--shadow);}
  .dz-card.sel{border-color:var(--brand);background:var(--brand-ll);box-shadow:0 0 0 3px rgba(15,118,110,.13);}
  .dz-card .nm{font-weight:800;font-size:13px;display:flex;align-items:flex-start;gap:7px;}
  .dz-card .dc{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.6;}
  .dz-card .src{display:inline-block;font-size:10px;font-weight:700;background:var(--blue-l);color:var(--blue);border-radius:999px;padding:1px 8px;margin-top:6px;}

  /* ===== Checkboxes ===== */
  .chk{display:flex;align-items:flex-start;gap:10px;padding:9px 12px;border:1.5px solid var(--line);border-radius:11px;cursor:pointer;transition:.14s;background:#fff;font-size:13px;line-height:1.7;}
  .chk:hover{border-color:var(--line2);}
  .chk.on{border-color:var(--brand);background:var(--brand-ll);}
  .chk .box{width:19px;height:19px;border-radius:6px;border:2px solid var(--line2);flex:0 0 auto;margin-top:2px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:900;transition:.14s;}
  .chk.on .box{background:var(--brand);border-color:var(--brand);}
  .chk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px;}
  .chk-grid.single{grid-template-columns:1fr;}
  .grp-label{font-size:12px;font-weight:800;color:var(--brand-d);margin:14px 2px 6px;display:flex;align-items:center;gap:6px;}

  /* ===== Plan ===== */
  .plan-card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;}
  .plan-head{padding:14px 18px;background:linear-gradient(135deg,#0F766E,#0D9488);color:#fff;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .plan-head .nm{font-size:16px;font-weight:800;}
  .plan-head .src-badge{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);border-radius:999px;font-size:10.5px;padding:2px 10px;font-weight:700;}
  .plan-body{padding:8px 18px 16px;}
  .psec{border:1px solid var(--line);border-radius:12px;margin-top:12px;overflow:hidden;}
  .psec .ph{display:flex;align-items:center;gap:8px;padding:9px 14px;font-weight:800;font-size:13px;background:var(--bg);border-bottom:1px solid var(--line);}
  .psec .pb{padding:11px 14px;display:flex;flex-direction:column;gap:7px;}
  .psec .pb ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px;}
  .psec .pb li{position:relative;padding-inline-start:20px;font-size:13px;line-height:1.8;}
  .psec .pb li:before{content:"";position:absolute;inset-inline-start:2px;top:10px;width:8px;height:8px;border-radius:3px;background:var(--brand-l);border:1.5px solid var(--brand);}
  .psec.red .ph{background:var(--red-l);color:var(--red);border-color:#FECACA;}
  .psec.red{border-color:#FECACA;}
  .psec.red .pb li:before{background:var(--red-l);border-color:var(--red);}
  .psec.amber .ph{background:var(--amber-l);color:var(--amber);border-color:#FDE68A;}
  .psec.amber{border-color:#FDE68A;}
  .psec.amber .pb li:before{background:var(--amber-l);border-color:var(--amber);}
  .psec.blue .ph{background:var(--blue-l);color:var(--blue);border-color:#BFDBFE;}
  .psec.blue{border-color:#BFDBFE;}
  .psec.blue .pb li:before{background:var(--blue-l);border-color:var(--blue);}
  .psec.green .ph{background:var(--green-l);color:var(--green);border-color:#BBF7D0;}
  .psec.green{border-color:#BBF7D0;}
  .psec.green .pb li:before{background:var(--green-l);border-color:var(--green);}

  /* phases */
  .phase-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px;}
  .phase{border:1px solid var(--line);border-radius:13px;padding:12px;background:#fff;}
  .phase .pt{display:flex;align-items:center;gap:8px;font-weight:800;font-size:12.5px;margin-bottom:8px;color:var(--ink);}
  .phase .pt .pn{width:22px;height:22px;border-radius:7px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;flex:0 0 auto;}
  .phase ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;}
  .phase li{font-size:11.8px;line-height:1.75;color:var(--ink2);padding-inline-start:14px;position:relative;}
  .phase li:before{content:"•";position:absolute;inset-inline-start:1px;color:var(--brand);font-weight:900;}

  /* findings chips */
  .chip{display:inline-flex;align-items:center;gap:5px;background:var(--brand-ll);border:1px solid var(--brand-l);color:var(--brand-d);border-radius:999px;padding:3px 11px;font-size:11.5px;font-weight:600;}
  .chip.warn{background:var(--red-l);border-color:#FECACA;color:var(--red);}

  /* history grid */
  .hx-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;}
  .hx-item{display:flex;gap:9px;padding:9px 12px;border:1.5px solid var(--line);border-radius:11px;cursor:pointer;background:#fff;transition:.14s;font-size:12.5px;font-weight:600;align-items:center;}
  .hx-item:hover{border-color:var(--line2);}
  .hx-item.on{border-color:var(--amber);background:var(--amber-l);box-shadow:0 0 0 3px rgba(180,83,9,.1);color:var(--amber);}
  .hx-item .bx{width:18px;height:18px;border-radius:6px;border:2px solid var(--line2);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;font-weight:900;}
  .hx-item.on .bx{background:var(--amber);border-color:var(--amber);}

  /* buttons */
  .btn{display:inline-flex;align-items:center;gap:8px;border-radius:12px;padding:11px 22px;font-weight:800;font-size:13.5px;cursor:pointer;border:1.5px solid transparent;transition:.16s;}
  .btn-p{background:var(--brand);color:#fff;box-shadow:0 4px 14px -6px rgba(15,118,110,.5);}
  .btn-p:hover{background:var(--brand-d);}
  .btn-o{background:#fff;color:var(--brand-d);border-color:var(--line2);}
  .btn-o:hover{border-color:var(--brand);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btn-lg{width:100%;justify-content:center;padding:14px;font-size:15px;}

  /* empty */
  .empty{text-align:center;padding:34px 16px;color:var(--muted);font-size:13px;}

  /* summary modal print */
  .note-box{background:var(--blue-l);border:1px solid #BFDBFE;border-radius:12px;padding:11px 14px;font-size:12.5px;color:var(--blue);line-height:1.9;}
  .warn-box{background:var(--red-l);border:1px solid #FECACA;border-radius:12px;padding:11px 14px;font-size:12.5px;color:var(--red);line-height:1.9;}
  .amber-box{background:var(--amber-l);border:1px solid #FDE68A;border-radius:12px;padding:11px 14px;font-size:12.5px;color:var(--amber);line-height:1.9;}

  /* patients list */
  .pat-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-top:8px;flex-wrap:wrap;}
  .pat-row .nm{font-weight:800;font-size:13.5px;}
  .pat-row .dt{font-size:11.5px;color:var(--muted);}
  .mini-tag{font-size:10.5px;background:var(--brand-l);color:var(--brand-d);border-radius:999px;padding:2px 9px;font-weight:700;}

  /* footer */
  .foot{text-align:center;color:var(--muted);font-size:11.5px;padding:26px 16px 34px;line-height:2;}
  .foot b{color:var(--ink2);}

  /* ===== Patient portal ===== */
  .pp-login-card{max-width:400px;margin:60px auto 0;text-align:center;}
  .pp-code-input{width:100%;text-align:center;letter-spacing:7px;font-size:22px;font-weight:800;padding:14px;border-radius:12px;border:1.5px solid var(--line2);font-family:'IBM Plex Mono',monospace;text-transform:uppercase;box-sizing:border-box;}
  .pp-code-input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(15,118,110,.15);}
  .code-pill{display:inline-flex;align-items:center;gap:8px;background:var(--brand-ll);border:1.5px dashed var(--brand);color:var(--brand-d);border-radius:12px;padding:8px 16px;font-family:'IBM Plex Mono',monospace;font-size:18px;font-weight:800;letter-spacing:3px;}
  .slider-lbl{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;margin-bottom:6px;}
  .pain-slider{width:100%;accent-color:var(--red);height:6px;}
  .ex-check{display:flex;align-items:flex-start;gap:10px;padding:11px 13px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;background:#fff;margin-top:8px;font-size:13px;line-height:1.75;transition:.14s;}
  .ex-check:hover{border-color:var(--line2);}
  .ex-check.done{border-color:var(--green);background:var(--green-l);}
  .ex-check .bx{width:20px;height:20px;border-radius:7px;border:2px solid var(--line2);flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:12px;margin-top:1px;}
  .ex-check.done .bx{background:var(--green);border-color:var(--green);}
  .log-row{display:flex;justify-content:space-between;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line);font-size:12.5px;}
  .log-row:last-child{border-bottom:none;}
  .pp-phase-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px;}
  .pp-phase-tab{border:1.5px solid var(--line2);background:#fff;border-radius:999px;padding:6px 14px;font-size:11.5px;font-weight:700;cursor:pointer;color:var(--ink2);}
  .pp-phase-tab.on{background:var(--brand);border-color:var(--brand);color:#fff;}

  @media print{
    body{background:#fff;}
    .no-print{display:none !important;}
    .hdr,.steps,.foot{display:none !important;}
    .card,.plan-card{box-shadow:none;border:1px solid #ddd;break-inside:avoid;}
    .wrap{max-width:100%;}
    .phase-grid{grid-template-columns:1fr 1fr;}
  }

  /* ——— انتخاب فاز (پزشک) ——— */
  .phase-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;}
  .phase-pick-card{border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;cursor:pointer;transition:.16s;background:#fff;}
  .phase-pick-card:hover{border-color:var(--brand);box-shadow:var(--shadow);}
  .phase-pick-card.sel{border-color:var(--brand);background:var(--brand-ll);box-shadow:0 0 0 3px rgba(15,118,110,.13);}
  .phase-pick-card .ppc-title{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px;color:var(--ink);}
  .phase-pick-card .ppc-n{width:22px;height:22px;border-radius:7px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;flex:0 0 auto;}
  .phase-pick-card .ppc-crit{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.7;}
  /* ——— جدول ورزش (پزشک) ——— */
  .ex-table{border:1px solid var(--line);border-radius:12px;overflow:hidden;}
  .ex-row{display:grid;grid-template-columns:2fr .6fr .7fr .9fr 1fr 1.6fr;gap:8px;padding:9px 12px;font-size:12px;align-items:center;border-bottom:1px solid var(--line);}
  .ex-row:last-child{border-bottom:none;}
  .ex-row.ex-head{background:var(--bg);font-weight:800;font-size:11px;color:var(--brand-d);}
  .ex-row .ex-n{font-weight:700;}
  .ex-row .ex-o{color:var(--muted);font-size:11px;line-height:1.6;}
  /* ——— توصیه‌های عمومی (بیمار) ——— */
  .advice-list{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;}
  .advice-list li{position:relative;padding-inline-start:20px;font-size:13px;line-height:1.8;}
  .advice-list li:before{content:"";position:absolute;inset-inline-start:2px;top:9px;width:8px;height:8px;border-radius:3px;background:var(--brand-l);border:1.5px solid var(--brand);}
  /* ——— تمرین خانگی با ست/تکرار (بیمار) ——— */
  .ex-check .ex-main{flex:1;}
  .ex-check .ex-name{font-weight:700;}
  .ex-check .ex-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;}
  .ex-check .ex-pill{font-size:10.5px;font-weight:700;background:var(--brand-ll);border:1px solid var(--brand-l);color:var(--brand-d);border-radius:999px;padding:1px 9px;}
  .ex-check .ex-tip{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.6;}

</style>
</head>
<body>
<div id="root"><div id="boot-msg">در حال بارگذاری توان‌یار کلینیک…</div></div>
<script>
  window.addEventListener("error", function (e) {
    var el = document.getElementById("boot-msg");
    if (el && (!window.React || !window.ReactDOM || !window.Babel)) {
      el.innerHTML = "بارگذاری کتابخانه‌های لازم (React/Babel) از CDN ناموفق بود.<br/>لطفاً از اتصال اینترنت خود مطمئن شوید و صفحه را دوباره بارگذاری کنید.";
    }
  }, true);
  window.storage = {
    async get(key){ try{ var r=window.localStorage.getItem(key); return r===null?null:{key:key,value:r}; }catch(e){ return null; } },
    async set(key,value){ try{ window.localStorage.setItem(key,value); return {ok:1}; }catch(e){ return {error:e&&e.name}; } },
    async del(key){ try{ window.localStorage.removeItem(key); return {ok:1}; }catch(e){ return null; } }
  };
</script>
<script>
/* داده‌های توانبخشی فازی — بر پایهٔ Braddom's PM&R (فصل ۱۶: تجویز ورزش/ACSM) و پروتکل‌های ارتوپدی */
// داده‌های توانبخشی فازی — بر پایهٔ Braddom's PM&R (فصل ۱۶) و پروتکل‌های ارتوپدی
// ساختار: diseaseId -> { phases: [ {id,title,criteria,modalities[],exercises[{n,s,r,h,f,o}],general[]} ] }
const PHASE_DATA = {
 "cerv_rad": {
  "phases": [
   {
    "id": "acute",
    "title": "فاز حاد",
    "criteria": "هفته ۱-۲ پس از شروع؛ درد شدید (۷-۱۰ از ۱۰)؛ علائم رادیکولار حاد؛ محدودیت شدید حرکت",
    "modalities": [
     "یخ ۲۰ دقیقه ۳-۴ بار روزانه",
     "کشش گردنی خوابیده (۲۰-۳۰ درجه فلکشن، حدود ۲۵ پوند)",
     "یقه نرم کوتاه‌مدت (حداکثر ۷۲ ساعت)",
     "NSAIDs؛ در درد نوروپاتیک گاباپنتین/پره‌گابالین"
    ],
    "exercises": [
     {
      "n": "ایزومتریک خم گردن",
      "s": "۲",

const STEPS = [
  { id: "region", title: "ناحیهٔ درگیر" },
  { id: "disease", title: "بیماری" },
  { id: "phase", title: "فاز بیماری" },
  { id: "plan", title: "برنامه" },
];

const STORAGE_KEY = "tav_plans_v2";

function loadRecords() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return [];
    var arr = JSON.parse(raw);
    return Array.isArray(arr) ? arr : [];
  } catch (e) { return []; }
}
function saveRecords(arr) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(arr)); } catch (e) {}
}

function HistoryEffects(sel) {
  var notes = [];
  sel.forEach(function (id) {
    var it = HISTORY_ITEMS.find(function (h) { return h.id === id; });
    if (it) notes.push({ id: it.id, label: it.label, note: it.note });
  });
  return notes;
}

function buildPlan(disease, findings, history) {
  var redSelected = findings.filter(function (f) { return f.red; });
  var fNotes = (FRONTERA_NOTES[disease.id] || []);
  var fBlock = "";
  if (fNotes.length) {
    fBlock = "\n\n— نکات مکمل از کتاب فرونترا (Essentials of PM&R):\n" + fNotes.map(function (x){return "• " + x;}).join("\n");
  }
  var yellowSelected = findings.filter(function (f) { return f.yellow; });
  var hx = HistoryEffects(history);
  var precautions = [];
  hx.forEach(function (h) {
    if (h.id === "anticoag") precautions.push("مصرف ضدانعقاد: قبل از هر تزریق تهاجمی (داخل مفصلی/اپیدورال/تریگرپوینت) ارزیابی INR و خطر خونریزی؛ EMG سوزنی با فشار کافی نسبتاً ایمن است.");
    if (h.id === "steroid") precautions.push("مصرف کورتیکواستروئید: تزریق مکرر استروئید می‌تواند تاندون را ضعیف کند؛ قند خون را پایش کنید.");
    if (h.id === "diabetes") precautions.push("دیابت: قند خون را قبل/حین/بعد ورزش چک کنید؛ اگر قند ناشتا >۴۰۰ باشد ورزش ممنوع؛ پای دیابتی و نوروپاتی را بررسی کنید.");
    if (h.id === "osteoporosis") precautions.push("پوکی استخوان: مانورهای HVLA و فلکشن شدید ستون ممنوع؛ ورزش اکستنشن کمر و تقویت با مقاومت ملایم توصیه می‌شود.");
    if (h.id === "preg") precautions.push("بارداری: کمربند باریک برای درد SIJ و عریض برای درد ستون؛ آب‌درمانی و فیزیوتراپی اختصاصی.");
    if (h.id === "heart") precautions.push("بیماری قلبی: شدت ورزش را با RPE تنظیم کنید نه ضربان قلب؛ از برنامه توانبخشی قلبی فازی پیروی کنید.");
    if (h.id === "renal") precautions.push("نارسایی کلیه: دوز گاباپنتین/پره‌گابالین و NSAIDs را بر اساس GFR تنظیم کنید.");
    if (h.id === "opioid") precautions.push("مصرف اپیوئید: ترکیب با بنزودیازپین خطرناک است؛ درمان را چندوجهی و غیراپیوئیدی هدایت کنید.");
    if (h.id === "psych") precautions.push("فلگ زرد روان‌شناختی: CBT، ACT، پِیسینگ فعالیت و انتظارات واقع‌بینانه را در پلن بگنجانید.");
    if (h.id === "cancer") precautions.push("سابقه سرطان: درد جدید شبانه/کاهش وزن = فلگ قرمز؛ مانیپولاسیون ممنوع.");
    if (h.id === "fall") precautions.push("سابقه افتادن/اختلال تعادل: تمرین تعادل و پروپریوسپشن و ارزیابی وسایل کمکی را اضافه کنید.");
    if (h.id === "obesity") precautions.push("چاقی: کاهش وزن ۵-۱۰٪ اثر درمانی بارز دارد؛ ورزش کم‌برخورد ترجیح دارد.");
    if (h.id === "neuro") precautions.push("بیماری نورولوژیک: اسپاستیسیتی و خطر افتادن؛ ارتز و توانبخشی اختصاصی را در نظر بگیرید.");
    if (h.id === "smoker") precautions.push("مصرف دخانیات: ترمیم بافت را به تأخیر می‌اندازد؛ ترک را توصیه کنید.");
  });
  return { redSelected: redSelected, yellowSelected: yellowSelected, hx: hx, precautions: precautions };
}

/* ——————— استپر ——————— */
function StepsBar({ step, setStep, canGo }) {
  return (
    <div className="wrap">
      <div className="steps">
        {STEPS.map(function (s, i) {
          var cls = "step";
          if (step === s.id) cls += " active";
          else if (STEPS.findIndex(function (x) { return x.id === step; }) > i) cls += " done";
          var locked = !canGo[s.id] && STEPS.findIndex(function (x) { return x.id === step; }) < i;
          return (
            <div key={s.id} className={cls} onClick={function () { if (!locked) setStep(s.id); }} style={locked ? { opacity: .5, cursor: "not-allowed" } : {}}>
              <div className="n">{step === s.id ? toFa(i + 1) : <Check size={13} />}</div>
              <div className="t">{s.title}</div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

      <div className="box">{on ? <Check size={12} /> : null}</div>
      <div>
        {item.label}
        {item.note ? <div style={{ fontSize: 11, color: "var(--muted)", marginTop: 2 }}>{item.note}</div> : null}
      </div>
    </div>
  );
}

function HxItem({ item, on, onClick }) {
  return (
    <div className={"hx-item" + (on ? " on" : "")} onClick={onClick}>
      <div className="bx">{on ? <Check size={11} /> : null}</div>
      <div style={{ flex: 1 }}>
        {item.label}
        {item.note ? <div style={{ fontSize: 10.5, color: "var(--muted)", marginTop: 1, fontWeight: 400, lineHeight: 1.6 }}>{item.note}</div> : null}
      </div>

  );
}

function EvalStep({ regionId, diseaseId, findings, onToggleFinding, history, onToggleHistory, patient, onEditPatient, onGenerate, onBack }) {
  var reg = DISEASE_MAP[regionId];
  var dz = reg.diseases.find(function (d) { return d.id === diseaseId; });
  var fCount = findings.length;
  return (
    <div className="wrap mt16">
      <div className="card">
        <div className="sec-title"><span className="bar" />یافته‌های بالینی — {dz.name}</div>
        <p className="sec-desc">تمام مواردی را که در معاینه و شرح حال بیمار یافتید تیک بزنید. موارد قرمز = فلگ قرمز (نیازمند بررسی فوری).</p>
        <div className="chk-grid">
          {dz.findings.map(function (f) {
            return <Chk key={f.id} item={f} on={findings.indexOf(f.id) >= 0} onClick={function () { onToggleFinding(f.id); }} />;
          })}
        </div>
        <div className="grp-label"><Flag size={14} /> فلگ‌های قرمز عمومی (در صورت وجود)</div>
        <div className="chk-grid">
          {COMMON_FINDINGS.map(function (f) {
            return <Chk key={f.id} item={f} on={findings.indexOf(f.id) >= 0} onClick={function () { onToggleFinding(f.id); }} />;
          })}
        </div>
      </div>

      <div className="card">
        <div className="sec-title"><span className="bar" style={{ background: "var(--amber)" }} />شرح حال و سوابق مؤثر در پلن</div>
        <p className="sec-desc">سوابق پزشکی که می‌توانند پلن تشخیصی/درمانی یا ایمنی بیمار را تغییر دهند (مرور سیستم‌ها).</p>
        <div className="hx-grid">
          {HISTORY_ITEMS.map(function (h) {
            return <HxItem key={h.id} item={h} on={history.indexOf(h.id) >= 0} onClick={function () { onToggleHistory(h.id); }} />;
          })}
        </div>
        <div style={{ marginTop: 12, fontSize: 12.5, color: "var(--ink2)" }}>
          <div className="row" style={{ gap: 6, marginBottom: 4 }}><b>بیمار:</b>
            {patient && patient.name ? patient.name + (patient.age ? "، " + toFa(patient.age) + " ساله" : "") : "—"}
          </div>
          <button className="btn btn-o" style={{ padding: "7px 14px", fontSize: 12 }} onClick={onEditPatient}><Edit3 size={14} /> {patient && patient.name ? "ویرایش اطلاعات بیمار" : "ثبت اطلاعات بیمار"}</button>
        </div>
      </div>

      <div className="row mt16" style={{ justifyContent: "space-between" }}>
        <button className="btn btn-o" onClick={onBack}><ChevronRight size={16} /> بازگشت</button>
        <button className="btn btn-p" onClick={onGenerate} disabled={fCount === 0}>
          <Sparkles size={16} /> تولید پلن تشخیصی/درمانی ({toFa(fCount)} مورد انتخابی)
        </button>
      </div>
    </div>
  );
}

function PhaseStep({ diseaseId, history, onToggleHistory, patient, onEditPatient, onGenerate, onBack }) {
  var meta = PHASE_META[diseaseId] || [];
  var [sel, setSel] = React.useState(0);
  var [showHx, setShowHx] = React.useState(false);
  return (
    <div className="wrap mt16">
      <div className="card">
        <div className="sec-title"><span className="bar" />فاز بیماری را انتخاب کنید</div>
        <p className="sec-desc">بر اساس زمان سپری‌شده از شروع، شدت درد و سایر معیارهای بالینی، فاز مناسب را انتخاب کنید؛ برنامهٔ توانبخشی، مدالیته‌ها و ورزش‌ها بر اساس آن ارائه می‌شود.</p>
        <div className="phase-pick">
          {meta.map(function (m, i) {
            return (
              <div key={m.id} className={"phase-pick-card" + (sel === i ? " sel" : "")} onClick={function () { setSel(i); }}>
                <div className="ppc-title"><span className="ppc-n">{toFa(i + 1)}</span>{m.title}</div>
                <div className="ppc-crit">{m.criteria}</div>
              </div>
            );
          })}
        </div>

        <div className="grp-label"><Info size={14} /> سوابق مؤثر در ایمنی پلن (اختیاری)</div>
        <button className="btn btn-o" style={{ padding: "7px 14px", fontSize: 12 }} onClick={function () { setShowHx(!showHx); }}>
          {showHx ? "بستن سوابق" : "انتخاب سوابق پزشکی (اختیاری)"}
        </button>
        {showHx ? (
          <div className="hx-grid" style={{ marginTop: 8 }}>
            {HISTORY_ITEMS.map(function (h) {
              return <HxItem key={h.id} item={h} on={history.indexOf(h.id) >= 0} onClick={function () { onToggleHistory(h.id); }} />;
            })}
          </div>
        ) : null}

        <div style={{ marginTop: 12 }}>
          <button className="btn btn-o" style={{ padding: "7px 14px", fontSize: 12 }} onClick={onEditPatient}><Edit3 size={14} /> {patient && patient.name ? "ویرایش اطلاعات بیمار" : "ثبت اطلاعات بیمار (اختیاری)"}</button>

      </div>

      <div className="row mt16" style={{ justifyContent: "space-between" }}>
        <button className="btn btn-o" onClick={onBack}><ChevronRight size={16} /> بازگشت</button>
        <button className="btn btn-p" onClick={function () { onGenerate(sel); }}>
          <Sparkles size={16} /> تولید برنامهٔ توانبخشی
        </button>
      </div>
    </div>
  );
}

function PlanStep({ regionId, diseaseId, history, patient, record, onUpdateRecord, onBack, onNew, onPrint }) {
  var reg = DISEASE_MAP[regionId];
  var dz = reg && reg.diseases.find(function (d) { return d.id === diseaseId; });
  if (!reg || !dz) {
    return (
      <div className="wrap mt16">
        <div className="card">
          <div className="sec-title"><span className="bar" />این پرونده قابل نمایش نیست</div>
          <p className="sec-desc">ناحیه یا بیماری مربوط به این پرونده در نسخهٔ فعلی برنامه پیدا نشد (ممکن است پرونده مربوط به نسخهٔ قدیمی‌تر باشد).</p>
          <button className="btn btn-p" onClick={onNew}><Plus size={16} /> پروندهٔ جدید</button>
        </div>
      </div>
    );
  }
  var phaseIdx = record ? (record.activePhase || 0) : 0;
  var phase = (PHASE_DATA[diseaseId] && PHASE_DATA[diseaseId].phases[phaseIdx]) || null;
  var hx = HistoryEffects(history);
  var precautions = [];
  hx.forEach(function (h) {
    if (h.id === "anticoag") precautions.push("مصرف ضدانعقاد: قبل از هر تزریق تهاجمی (داخل مفصلی/اپیدورال/تریگرپوینت) ارزیابی INR و خطر خونریزی؛ EMG سوزنی با فشار کافی نسبتاً ایمن است.");
    if (h.id === "steroid") precautions.push("مصرف کورتیکواستروئید: تزریق مکرر استروئید می‌تواند تاندون را ضعیف کند؛ قند خون را پایش کنید.");
    if (h.id === "diabetes") precautions.push("دیابت: قند خون را قبل/حین/بعد ورزش چک کنید؛ اگر قند ناشتا >۴۰۰ باشد ورزش ممنوع؛ پای دیابتی و نوروپاتی را بررسی کنید.");
    if (h.id === "osteoporosis") precautions.push("پوکی استخوان: مانورهای HVLA و فلکشن شدید ستون ممنوع؛ ورزش اکستنشن کمر و تقویت با مقاومت ملایم توصیه می‌شود.");
    if (h.id === "preg") precautions.push("بارداری: کمربند باریک برای درد SIJ و عریض برای درد ستون؛ آب‌درمانی و فیزیوتراپی اختصاصی.");
    if (h.id === "heart") precautions.push("بیماری قلبی: شدت ورزش را با RPE تنظیم کنید نه ضربان قلب؛ از برنامه توانبخشی قلبی فازی پیروی کنید.");
    if (h.id === "renal") precautions.push("نارسایی کلیه: دوز گاباپنتین/پره‌گابالین و NSAIDs را بر اساس GFR تنظیم کنید.");
    if (h.id === "opioid") precautions.push("مصرف اپیوئید: ترکیب با بنزودیازپین خطرناک است؛ درمان را چندوجهی و غیراپیوئیدی هدایت کنید.");
    if (h.id === "psych") precautions.push("فلگ زرد روان‌شناختی: CBT، ACT، پِیسینگ فعالیت و انتظارات واقع‌بینانه را در پلن بگنجانید.");
    if (h.id === "cancer") precautions.push("سابقه سرطان: درد جدید شبانه/کاهش وزن = فلگ قرمز؛ مانیپولاسیون ممنوع.");
    if (h.id === "fall") precautions.push("سابقه افتادن/اختلال تعادل: تمرین تعادل و پروپریوسپشن و ارزیابی وسایل کمکی را اضافه کنید.");
    if (h.id === "obesity") precautions.push("چاقی: کاهش وزن ۵-۱۰٪ اثر درمانی بارز دارد؛ ورزش کم‌برخورد ترجیح دارد.");
    if (h.id === "neuro") precautions.push("بیماری نورولوژیک: اسپاستیسیتی و خطر افتادن؛ ارتز و توانبخشی اختصاصی را در نظر بگیرید.");
    if (h.id === "smoker") precautions.push("مصرف دخانیات: ترمیم بافت را به تأخیر می‌اندازد؛ ترک را توصیه کنید.");
  });
  return (
    <div className="wrap mt16">
      {record ? (
        <PatientAccessPanel record={record} phases={PHASE_DATA[diseaseId] ? PHASE_DATA[diseaseId].phases : []} onUpdateRecord={onUpdateRecord} />
      ) : null}
      <div className="plan-card">
        <div className="plan-head">
          <span className="nm">{dz.name}</span>
          <span className="src-badge">Braddom's PM&amp;R — ویرایش ۷</span>
          <span className="src-badge">ناحیه: {reg.label}</span>
          {phase ? <span className="src-badge">{phase.title}</span> : null}
        </div>
        <div className="plan-body">
          {patient && patient.name ? (
            <div className="row mt12" style={{ gap: 8 }}>
              <span className="chip"><User size={12} /> {patient.name}{patient.age ? "، " + toFa(patient.age) + " ساله" : ""}{patient.sex ? "، " + patient.sex : ""}</span>
              <span className="chip"><Calendar size={12} /> {todayFa()}</span>
            </div>
          ) : null}

          {phase && phase.criteria ? (
            <Psec tone="blue" title="معیارهای فاز انتخابی" icon={<Info size={15} />}>
              <div style={{ fontSize: 13, lineHeight: 1.8 }}>{phase.criteria}</div>
            </Psec>
          ) : null}

          {dz.redFlags && dz.redFlags.length ? (
            <Psec tone="red" title="هشدار — فلگ‌های قرمز (بررسی فوری)" icon={<AlertTriangle size={16} />}>
              <ul>
                {dz.redFlags.map(function (r, i) {
                  var key = "rf" + i;
                  return <li key={key}>{r} — در صورت حضور، ارجاع فوری.</li>;
                })}
              </ul>
            </Psec>
          ) : null}

          {precautions.length > 0 ? (
            <Psec tone="amber" title="ملاحظات سوابق بیمار (در پلن اعمال شد)" icon={<Shield size={15} />}>
              <ul>{precautions.map(function (p, i) { return <li key={i}>{p}</li>; })}</ul>
            </Psec>
          ) : null}

          {phase && phase.modalities && phase.modalities.length ? (
            <Psec tone="green" title="مدالیته‌های درمانی" icon={<Activity size={15} />}>
              <ul>{phase.modalities.map(function (m, i) { return <li key={i}>{m}</li>; })}</ul>
            </Psec>
          ) : null}

          {phase && phase.exercises && phase.exercises.length ? (
            <Psec tone="green" title="ورزش‌های توانبخشی — با ست و تکرار مشخص" icon={<Dumbbell size={15} />}>
              <div className="ex-table">
                <div className="ex-row ex-head">
                  <span>ورزش</span><span>ست</span><span>تکرار</span><span>مدت/نگه‌داشت</span><span>تکرار در هفته</span><span>نکته</span>
                </div>
                {phase.exercises.map(function (ex, i) {
                  return (
                    <div key={i} className="ex-row">
                      <span className="ex-n">{ex.n}</span>
                      <span>{ex.s}</span>
                      <span>{ex.r}</span>
                      <span>{ex.h || "—"}</span>
                      <span>{ex.f}</span>
                      <span className="ex-o">{ex.o || "—"}</span>
                    </div>
                  );
                })}
              </div>
            </Psec>
          ) : null}

          {phase && phase.general && phase.general.length ? (
            <Psec title="توصیه‌های عمومی برای بیمار" icon={<Info size={15} />}>
              <ul>{phase.general.map(function (g, i) { return <li key={i}>{g}</li>; })}</ul>
            </Psec>
          ) : null}

          {dz.plan.referral && dz.plan.referral.length ? (
            <Psec title="زمان ارجاع تخصصی" icon={<Flag size={15} />}>
              <ul>{dz.plan.referral.map(function (d, i) { return <li key={i}>{d}</li>; })}</ul>
            </Psec>
          ) : null}

          {hx.length > 0 ? (
            <div className="amber-box mt12"><b>سوابق ثبت‌شده:</b> {hx.map(function (h) { return h.label; }).join("، ")}</div>
          ) : null}

          <div className="note-box mt12">
            <b>نکته:</b> این برنامه بر اساس Braddom's Physical Medicine and Rehabilitation (ویرایش هفتم، ۲۰۲۶) تولید شده و جایگزین قضاوت بالینی پزشک نیست. پیش از تجویز هر دارو/تزریق، موارد منع مصرف بیمار را بررسی کنید.
          </div>
        </div>
      </div>

      <div className="row mt16" style={{ justifyContent: "space-between" }}>
        <div className="row">
          <button className="btn btn-o" onClick={onBack}><ChevronRight size={16} /> تغییر فاز</button>
          <button className="btn btn-o no-print" onClick={onPrint}><Printer size={16} /> چاپ/PDF</button>
        </div>
        <button className="btn btn-p" onClick={onNew}><Plus size={16} /> پروندهٔ جدید</button>
      </div>
    </div>
  );
}

function findDiseaseById(diseaseId) {
  var regionKeys = Object.keys(DISEASE_MAP);
  for (var i = 0; i < regionKeys.length; i++) {
    var reg = DISEASE_MAP[regionKeys[i]];
    var dz = reg.diseases.find(function (d) { return d.id === diseaseId; });
    if (dz) return { reg: reg, dz: dz };
  }
  return { reg: null, dz: null };
}

function PatientDashboard({ record, setRecords }) {
  var found = findDiseaseById(record.diseaseId);
  var reg = found.reg, dz = found.dz;
  var activePhase = record.activePhase || 0;
  var phase = dz && PHASE_DATA[record.diseaseId] ? (PHASE_DATA[record.diseaseId].phases[activePhase] || PHASE_DATA[record.diseaseId].phases[0]) : null;
  var iso = todayISO();
  var todayLog = (record.logs || []).find(function (l) { return l.date === iso; }) || { date: iso, pain: null, done: [] };
  var [pain, setPain] = React.useState(todayLog.pain != null ? todayLog.pain : 5);

  function patch(updater) {
    setRecords(function (prev) { return prev.map(function (r) { return r.id === record.id ? Object.assign({}, r, updater(r)) : r; }); });
  }
  function toggleDone(idx) {
    patch(function (r) {
      var logs = (r.logs || []).slice();
      var i = logs.findIndex(function (l) { return l.date === iso; });
      var entry = i >= 0 ? Object.assign({}, logs[i]) : { date: iso, pain: null, done: [] };
      var done = (entry.done || []).slice();
      var pos = done.indexOf(idx);
      if (pos >= 0) done.splice(pos, 1); else done.push(idx);
      entry.done = done;
      if (i >= 0) logs[i] = entry; else logs.push(entry);
      return { logs: logs };
    });
  }
  function savePain() {
    patch(function (r) {
      var logs = (r.logs || []).slice();
      var i = logs.findIndex(function (l) { return l.date === iso; });
      var entry = i >= 0 ? Object.assign({}, logs[i]) : { date: iso, pain: null, done: [] };
      entry.pain = pain;
      if (i >= 0) logs[i] = entry; else logs.push(entry);
      return { logs: logs };
    });
  }

  if (!dz) {
    return <div className="wrap mt16"><div className="empty">برنامهٔ این کد یافت نشد. با پزشک خود تماس بگیرید.</div></div>;
  }

  var doneToday = (todayLog.done || []).length;
  var totalToday = phase ? phase.exercises.length : 0;

  return (
    <div className="wrap mt16">
      {/* بخش ۱: توصیه‌های عمومی */}
      <div className="card">
        <div className="sec-title"><span className="bar" />
          {record.patient && record.patient.name ? "سلام " + record.patient.name + " عزیز" : "سلام، خوش آمدید"}
        </div>
        <div className="row" style={{ gap: 6, marginTop: 4 }}>
          <span className="chip">{reg ? reg.label : ""}</span>
          <span className="chip">{dz.name}</span>
          {phase ? <span className="chip">{phase.title}</span> : null}
        </div>
        {record.coachNote ? <div className="note-box mt12"><b>یادداشت پزشک:</b> {record.coachNote}</div> : null}

        <div className="grp-label" style={{ marginTop: 14 }}><Info size={14} /> توصیه‌های عمومی</div>
        {phase && phase.general && phase.general.length ? (
          <ul className="advice-list">
            {phase.general.map(function (g, i) { return <li key={i}>{g}</li>; })}
          </ul>
        ) : null}

        {dz.redFlags && dz.redFlags.length ? (
          <div className="warn-box mt12">
            <b>در صورت مشاهدهٔ این علائم فوراً به پزشک مراجعه کنید:</b>
            <ul style={{ margin: "6px 0 0", paddingInlineStart: 18 }}>
              {dz.redFlags.map(function (r, i) { return <li key={i} style={{ fontSize: 12.5, lineHeight: 1.9 }}>{r}</li>; })}
            </ul>
          </div>
        ) : null}
      </div>

      {/* بخش ۲: ورزش‌های خانگی با ست و تکرار */}
      <div className="card">
        <div className="sec-title"><span className="bar" />ورزش‌های خانگی — {phase ? phase.title : ""}</div>
        <p className="sec-desc">این تمرین‌ها را در خانه با تعداد ست و تکرار مشخص انجام دهید. {toFa(doneToday)} از {toFa(totalToday)} تمرین امروز انجام شده.</p>
        {phase && phase.exercises.length ? phase.exercises.map(function (ex, idx) {
          var on = (todayLog.done || []).indexOf(idx) >= 0;
          return (
            <div key={idx} className={"ex-check" + (on ? " done" : "")} onClick={function () { toggleDone(idx); }}>
              <div className="bx">{on ? <Check size={12} /> : null}</div>
              <div className="ex-main">
                <div className="ex-name">{ex.n}</div>
                <div className="ex-meta">
                  <span className="ex-pill">ست: {ex.s}</span>
                  <span className="ex-pill">تکرار: {ex.r}</span>
                  {ex.h ? <span className="ex-pill">نگه‌داشت: {ex.h}</span> : null}
                  <span className="ex-pill">تکرار در هفته: {ex.f}</span>
                </div>
                {ex.o ? <div className="ex-tip">{ex.o}</div> : null}
              </div>
            </div>
          );
        }) : null}
      </div>

      <div className="note-box">
        <b>نکته:</b> این برنامه توسط پزشک شما بر اساس معاینه و شرح‌حال شما تنظیم شده است. در صورت تشدید درد یا بروز علائم جدید، پیش از ادامهٔ تمرین با پزشک خود مشورت کنید.
      </div>
    </div>
  );
}

function PatientPortal({ records, setRecords }) {
  var [recordId, setRecordId] = React.useState(function () {
    try { return localStorage.getItem(PATIENT_SESSION_KEY) || null; } catch (e) { return null; }
  });
  var record = recordId ? records.find(function (r) { return r.id === recordId; }) : null;

  function handleLogin(code) {
    var match = records.find(function (r) { return r.accessCode && r.accessCode.toUpperCase() === code.toUpperCase(); });
    if (!match) return false;
    setRecordId(match.id);
    try { localStorage.setItem(PATIENT_SESSION_KEY, match.id); } catch (e) {}
    return true;
  }
  function logout() {
    setRecordId(null);
    try { localStorage.removeItem(PATIENT_SESSION_KEY); } catch (e) {}
  }

  if (!record) {
    return <PatientLogin onLogin={handleLogin} />;
  }
  return (
    <div>
      <PatientDashboard record={record} setRecords={setRecords} />
      <div className="wrap" style={{ textAlign: "center", marginTop: 4 }}>
        <button className="btn btn-o no-print" onClick={logout}>خروج از حساب</button>
      </div>
    </div>
  );
}

/* ——————— اپلیکیشن ——————— */
function App() {
  var [step, setStep] = React.useState("region");
  var [regionId, setRegionId] = React.useState(null);
  var [diseaseId, setDiseaseId] = React.useState(null);
  var [findings, setFindings] = React.useState([]);
  var [history, setHistory] = React.useState([]);
  var [patient, setPatient] = React.useState(null);
  var [showPatient, setShowPatient] = React.useState(false);
  var [showList, setShowList] = React.useState(false);
  var [records, setRecords] = React.useState(loadRecords());
  var [currentId, setCurrentId] = React.useState(null);
  var [mode, setMode] = React.useState("doctor");
  var [docAuthed, setDocAuthed] = React.useState(function () {
    try { return sessionStorage.getItem(DOCTOR_AUTH_KEY) === "1"; } catch (e) { return false; }
  });

  useEffect(function () { saveRecords(records); }, [records]);
  // به رکوردهای قدیمی‌تر که کد دسترسی ندارند، یک کد اختصاص بده
  useEffect(function () {
    var missing = records.some(function (r) { return !r.accessCode; });
    if (missing) {
      setRecords(function (prev) {
        var used = new Set(prev.map(function (x) { return x.accessCode; }).filter(Boolean));
        return prev.map(function (r) {
          if (r.accessCode) return r;
          var code;
          do {
            code = "";
            for (var i = 0; i < 6; i++) code += CODE_ALPHABET[Math.floor(Math.random() * CODE_ALPHABET.length)];
          } while (used.has(code));
          used.add(code);
          return Object.assign({}, r, { accessCode: code, activePhase: r.activePhase || 0, coachNote: r.coachNote || "", logs: r.logs || [] });
        });
      });
    }
    // فقط یک‌بار در بارگذاری اولیه اجرا شود
    // eslint-disable-next-line
  }, []);

  function toggleFinding(id) {
    setFindings(function (prev) {
      return prev.indexOf(id) >= 0 ? prev.filter(function (x) { return x !== id; }) : prev.concat(id);
    });
  }
  function toggleHistory(id) {
    setHistory(function (prev) {
      return prev.indexOf(id) >= 0 ? prev.filter(function (x) { return x !== id; }) : prev.concat(id);
    });
  }
  function goRegion(rid) {
    setRegionId(rid);
    setDiseaseId(null);
    setFindings([]);
    setStep("disease");
  }
  function goDisease(did) {
    setDiseaseId(did);
    setFindings([]);
    setStep("phase");
  }
  function generate(phaseIdx) {
    var reg = DISEASE_MAP[regionId];
    var dz = reg.diseases.find(function (d) { return d.id === diseaseId; });
    var prevRec = currentId ? records.find(function (r) { return r.id === currentId; }) : null;
    var rec = {
      id: currentId || ("p" + Date.now()),
      date: todayFa(),
      regionLabel: reg.label,
      diseaseId: dz.id,
      diseaseLabel: dz.name,
      findings: findings,
      history: history,
      patient: patient,
      count: findings.length,
      accessCode: (prevRec && prevRec.accessCode) || genAccessCode(records),
      activePhase: prevRec ? (prevRec.activePhase || 0) : (phaseIdx || 0),
      coachNote: prevRec ? (prevRec.coachNote || "") : "",
      logs: prevRec ? (prevRec.logs || []) : [],
    };
    setRecords(function (prev) {
      var rest = prev.filter(function (r) { return r.id !== rec.id; });
      return rest.concat(rec);
    });
    setCurrentId(rec.id);
    setStep("plan");
    window.scrollTo(0, 0);
  }
  function updateRecord(id, updater) {
    setRecords(function (prev) { return prev.map(function (r) { return r.id === id ? Object.assign({}, r, updater(r)) : r; }); });
  }
  function loadRec(id) {
    var rec = records.find(function (r) { return r.id === id; });
    if (!rec) return;
    setRegionId(Object.keys(DISEASE_MAP).find(function (k) { return DISEASE_MAP[k].label === rec.regionLabel; }) || null);
    setDiseaseId(rec.diseaseId);
    setFindings(rec.findings || []);
    setHistory(rec.history || []);
    setPatient(rec.patient || null);
    setCurrentId(rec.id);
    setShowList(false);
    setStep("plan");
  }
  function deleteRec(id) {
    setRecords(function (prev) { return prev.filter(function (r) { return r.id !== id; }); });
  }
  function newRec() {
    setRegionId(null); setDiseaseId(null); setFindings([]); setHistory([]);
    setPatient(null); setCurrentId(null); setShowList(false); setShowPatient(false);
    setStep("region");
    window.scrollTo(0, 0);
  }
  function savePatient(p) {
    setPatient(p);
    setShowPatient(false);
  }
  function backFromPhase() { setStep("disease"); }

  var canGo = { region: true, disease: !!regionId, phase: !!diseaseId, plan: !!diseaseId };
  var reg = regionId ? DISEASE_MAP[regionId] : null;
  var dz = reg && diseaseId ? reg.diseases.find(function (d) { return d.id === diseaseId; }) : null;

  return (
    <div>
      <Header
        mode={mode}
        docAuthed={docAuthed}
        onSwitchMode={function () { setMode(mode === "doctor" ? "patient" : "doctor"); }}
        onLogoutDoctor={function () { setDocAuthed(false); try { sessionStorage.removeItem(DOCTOR_AUTH_KEY); } catch (e) {} }}
        onPatients={function () { setShowList(true); }} onNew={newRec} recCount={records.length}
      />

      {mode === "patient" ? (
        <PatientPortal records={records} setRecords={setRecords} />
      ) : !docAuthed ? (
        <DoctorLogin onLogin={function () { setDocAuthed(true); try { sessionStorage.setItem(DOCTOR_AUTH_KEY, "1"); } catch (e) {} }} />
      ) : (
        <>
          <StepsBar step={step} setStep={setStep} canGo={canGo} />

          {step === "region" ? <RegionStep regionId={regionId} onSelect={goRegion} /> : null}
          {step === "disease" && reg ? <DiseaseStep regionId={regionId} diseaseId={diseaseId} onSelect={goDisease} onBack={function () { setStep("region"); }} /> : null}
          {(step === "disease" || step === "phase" || step === "plan") && !reg ? (
            <div className="wrap mt16"><div className="card">
              <div className="sec-title"><span className="bar" />ناحیه پیدا نشد</div>
              <p className="sec-desc">این پرونده به ناحیه‌ای اشاره می‌کند که در نسخهٔ فعلی برنامه وجود ندارد.</p>
              <button className="btn btn-p" onClick={newRec}><Plus size={16} /> پروندهٔ جدید</button>
            </div></div>
          ) : null}
          {step === "phase" && reg && !dz ? (
            <div className="wrap mt16"><div className="card">
              <div className="sec-title"><span className="bar" />بیماری پیدا نشد</div>
              <p className="sec-desc">این پرونده به بیماری‌ای اشاره می‌کند که در نسخهٔ فعلی برنامه وجود ندارد یا حذف شده است.</p>
              <button className="btn btn-o" onClick={function () { setStep("disease"); }}><ChevronRight size={16} /> انتخاب بیماری</button>
            </div></div>
          ) : null}
          {step === "phase" && dz ? (
            <PhaseStep
              diseaseId={diseaseId} history={history} onToggleHistory={toggleHistory}
              patient={patient} onEditPatient={function () { setShowPatient(true); }}
              onGenerate={generate} onBack={backFromPhase}
            />
          ) : null}
          {step === "plan" ? (
            <PlanStep
              regionId={regionId} diseaseId={diseaseId} history={history} patient={patient}
              record={records.find(function (r) { return r.id === currentId; })}
              onUpdateRecord={function (updater) { updateRecord(currentId, updater); }}
              onBack={function () { setStep("phase"); }} onNew={newRec} onPrint={function () { window.print(); }}
            />
          ) : null}

          {showPatient ? (
            <PatientModal
              patient={patient}
              onSave={savePatient}
              onClose={function () { setShowPatient(false); }}
            />
          ) : null}
          {showList ? (
            <PatientsModal
              records={records.slice().reverse()}
              onLoad={loadRec}
              onDelete={deleteRec}
              onClose={function () { setShowList(false); }}
              onNewRec={newRec}
            />
          ) : null}
        </>
      )}

      <div className="foot no-print">
        <b>توان‌یار کلینیک</b> — دستیار تشخیصی و تجویز توانبخشی بر پایهٔ Braddom's Physical Medicine &amp; Rehabilitation (ویرایش ۷، ۲۰۲۶).<br />
        این ابزار صرفاً کمک‌بالینی است و جایگزین قضاوت پزشک نیست.
      </div>
    </div>
  );
}

class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { error: null, info: null };
  }
  static getDerivedStateFromError(error) {
    return { error: error };
  }
  componentDidCatch(error, info) {
    this.setState({ error: error, info: info });
    try { console.error("Tavanyar crash:", error, info); } catch (e) {}
  }
  handleReset() {
    this.setState({ error: null, info: null });
    try { window.scrollTo(0, 0); } catch (e) {}
  }
  render() {
    if (this.state.error) {
      var msg = (this.state.error && (this.state.error.message || String(this.state.error))) || "خطای نامشخص";
      var stack = (this.state.error && this.state.error.stack) || "";
      return (
        <div dir="rtl" style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", padding: 20, fontFamily: "Vazirmatn, sans-serif", background: "#F1F5F9" }}>
          <div style={{ maxWidth: 640, width: "100%", background: "#fff", border: "1px solid #FECACA", borderRadius: 16, padding: 22, boxShadow: "0 8px 24px -12px rgba(15,23,42,.2)" }}>
            <div style={{ fontWeight: 800, fontSize: 16, color: "#DC2626", marginBottom: 8 }}>یک خطا رخ داد و صفحه بارگذاری نشد</div>
            <div style={{ fontSize: 13, color: "#475569", lineHeight: 1.8, marginBottom: 12 }}>
              متأسفانه در نمایش این بخش مشکلی پیش آمد. پیام خطا (لطفاً برای رفع مشکل این متن را ارسال کنید):
            </div>
            <div style={{ background: "#FEF2F2", border: "1px solid #FECACA", borderRadius: 10, padding: 12, fontSize: 12, fontFamily: "monospace", direction: "ltr", textAlign: "left", color: "#991B1B", whiteSpace: "pre-wrap", wordBreak: "break-word", maxHeight: 220, overflow: "auto" }}>
              {msg}
              {stack ? "\n\n" + stack : ""}
            </div>
            <div style={{ display: "flex", gap: 8, marginTop: 16 }}>
              <button
                onClick={() => { try { localStorage.removeItem("tav_plans_v2"); } catch (e) {} window.location.reload(); }}
                style={{ background: "#DC2626", color: "#fff", border: "none", borderRadius: 999, padding: "9px 16px", fontSize: 12.5, fontWeight: 700, cursor: "pointer" }}
              >
                پاک کردن اطلاعات ذخیره‌شده و شروع مجدد
              </button>
              <button
                onClick={() => window.location.reload()}
                style={{ background: "#fff", color: "#334155", border: "1.5px solid #CBD5E1", borderRadius: 999, padding: "9px 16px", fontSize: 12.5, fontWeight: 700, cursor: "pointer" }}
              >
                بارگذاری مجدد صفحه
              </button>
            </div>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById("root")).render(<ErrorBoundary><App /></ErrorBoundary>);
</script>
</body>
</html>

      acute: "از فعالیت‌های پربرخورد و پلهٔ زیاد خودداری کنید. آب‌درمانی و دوچرخه ثابت با مقاومت کم مفیدند. در زانوی داغ و متورم، به پزشک مراجعه کنید.",
      subacute: "تقویت چهارسر و همسترینگ و کشش را به‌تدریج اضافه کنید. با تشدید درد، شدت را کم کنید.",
      functional: "برنامهٔ ورزشی منظم را برای حفظ قدرت و عملکرد ادامه دهید. کاهش وزن (در صورت اضافه وزن) بسیار کمک‌کننده است."
    };
    if (kneeOaWarn[phaseId]) return kneeOaWarn[phaseId];
  }

  // هشدار اختصاصی بیماری‌های مچ پا و کف پا
  var ankleDiseases = ["ankle_sprain", "achilles", "plantar", "pttd"];
  if (ankleDiseases.indexOf(diseaseId) >= 0) {
    // هشدار اختصاصی تاندینوپاتی آشیل
    if (diseaseId === "achilles") {
      var achWarn = {
        acute: "از پرش، دویدن و بالا رفتن سریع روی پنجه خودداری کنید. اگر صدای «تق» شنیدید یا احساس پارگی داشتید، فوراً به پزشک مراجعه کنید.",
        subacute: "پروتکل اکسنتریک آلفردسون مؤثرترین درمان است. ممکن است کمی ناراحتی ایجاد کند اما نباید درد شدید باشد. تزریق استروئید داخل تاندون ممنوع است.",
        functional: "بازگشت به دویدن را تدریجی انجام دهید و از افزایش ناگهانی شدت خودداری کنید."
      };
      if (achWarn[phaseId]) return achWarn[phaseId];
    }
    // هشدار اختصاصی اسپرین مچ پا
    if (diseaseId === "ankle_sprain") {
      var sprWarn = {
        acute: "یخ، فشرده‌سازی و بالا نگه داشتن پا در ۴۸ ساعت اول مهم است. اگر نمی‌توانید چهار قدم روی پای آسیب‌دیده راه بروید یا درد استخوانی دارید، به پزشک مراجعه کنید (احتمال شکستگی).",
        subacute: "تمرین‌های تعادل و تقویت اورتور برای پیشگیری از پیچ‌خوردگی مجدد ضروری هستند. بریس یا تاپینگ را طبق نظر پزشک استفاده کنید.",
        functional: "بازگشت به ورزش را فقط پس از بازگشت قدرت و تعادل کامل انجام دهید."
      };
      if (sprWarn[phaseId]) return sprWarn[phaseId];
    }
    // هشدار اختصاصی فاسییت کف پا
    if (diseaseId === "plantar") {
      var plWarn = {
        acute: "از راه رفتن با پای برهنه روی سطوح سخت خودداری کنید. کفش با حمایت قوس بپوشید و کشش فاسیا را قبل از بلند شدن از تخت انجام دهید.",
        subacute: "کشش منظم و اسپلینت شبانه در صورت نیاز مؤثرند. تمرین‌ها را منظم و روزانه انجام دهید.",
        functional: "بازگشت به فعالیت را تدریجی انجام دهید. در موارد مزمن مقاوم، ESWT یا تزریق با نظر پزشک."
      };
      if (plWarn[phaseId]) return plWarn[phaseId];
    }
    // هشدار اختصاصی اختلال تاندون تیبیالیس خلفی
    if (diseaseId === "pttd") {
      var pttdWarn = {
        acute: "از ایستادن طولانی و راه رفتن زیاد خودداری کنید. ارتز کف پا و کفش حمایت‌کننده را طبق نظر پزشک استفاده کنید.",
        subacute: "تقویت تیبیالیس خلفی و تمرین تعادل برای حمایت از قوس پا ضروری است. با تشدید درد، شدت را کم کنید.",
        functional: "با بهبود وضعیت، تمرین‌های عملکردی و اصلاح کفش را ادامه دهید. در پارگی یا بدشکلی پیشرونده، ارجاع ارتوپدی لازم است."
      };
      if (pttdWarn[phaseId]) return pttdWarn[phaseId];
    }
  }

  // هشدار عمومی پیش‌فرض (برای بیماری‌هایی که هشدار اختصاصی فاز ندارند)
  return "تمرین را طبق برنامهٔ پزشک انجام دهید و در صورت تشدید واضح علائم، آن را متوقف کنید.";
}

function patientExercisePatientData(diseaseId, ex, phaseId) {
  var map = PATIENT_EXERCISE_OVERRIDES[diseaseId] || {};
  var d = map[ex.n];
  var base = d || {
    name: patientExerciseTitle(ex.n),
    steps: [patientExerciseGuide(ex.n)],
    warning: ""
  };
  var phaseWarning = patientPhaseWarning(diseaseId, phaseId);
  var baseWarning = (base.warning || "").trim();
  var phaseWarningTrimmed = (phaseWarning || "").trim();
  var warning;
  if (baseWarning && phaseWarningTrimmed &&
      (baseWarning === phaseWarningTrimmed ||
       baseWarning.indexOf(phaseWarningTrimmed) !== -1 ||
       phaseWarningTrimmed.indexOf(baseWarning) !== -1)) {
    // هشدار پایه و هشدار فاز شبیه یا هم‌پوشان هستند؛ فقط نسخهٔ کامل‌تر (طولانی‌تر) نمایش داده شود
    warning = baseWarning.length >= phaseWarningTrimmed.length ? baseWarning : phaseWarningTrimmed;
  } else {
    warning = [baseWarning, phaseWarningTrimmed].filter(function(x){ return x && x.trim(); }).join(" ");
  }
  return {
    name: base.name,
    steps: base.steps,
    warning: warning || "تمرین را طبق برنامه پزشک انجام دهید و در صورت تشدید واضح علائم، آن را متوقف کنید."
  };
}

function PainChartMini({ entries }) {
  var days = 14;
  var today = new Date();
  today.setHours(0, 0, 0, 0);
  var dayMs = 24 * 60 * 60 * 1000;
  var buckets = [];
  for (var i = days - 1; i >= 0; i--) {
    var d = new Date(today.getTime() - i * dayMs);
    var key = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    buckets.push({ date: d, key: key, values: [] });
  }
  (entries || []).forEach(function (e) {
    if (!e.ts || e.nrs == null) return;
    var key = e.ts.substr(0, 10);
    var b = buckets.find(function (x) { return x.key === key; });
    if (b) b.values.push(Number(e.nrs));
  });
  var points = buckets.map(function (b) {
    return b.values.length ? (b.values.reduce(function (s, v) { return s + v; }, 0) / b.values.length) : null;
  });
  var hasAny = points.some(function (p) { return p != null; });

  if (!hasAny) {
    return <div className="muted" style={{ fontSize: 12, padding: "10px 2px" }}>در ۱۴ روز اخیر دردی ثبت نشده است.</div>;
  }

  var w = 320, h = 110, padL = 20, padR = 8, padT = 10, padB = 18;
  var plotW = w - padL - padR, plotH = h - padT - padB;
  var stepX = days > 1 ? plotW / (days - 1) : 0;
  function xAt(i) { return padL + i * stepX; }
  function yAt(v) { return padT + plotH - (v / 10) * plotH; }
  function colorFor(v) { return v >= 7 ? "#DC2626" : v >= 4 ? "#D97706" : "#15803D"; }

  var segments = [];
  var cur = [];
  points.forEach(function (v, i) {
    if (v == null) {
      if (cur.length) { segments.push(cur); cur = []; }
    } else {
      cur.push([xAt(i), yAt(v)]);
    }
  });
  if (cur.length) segments.push(cur);

  return (
    <svg viewBox={"0 0 " + w + " " + h} width="100%" height={h} style={{ display: "block" }}>
      {[0, 5, 10].map(function (g) {
        var y = yAt(g);
        return (
          <g key={g}>
            <line x1={padL} y1={y} x2={w - padR} y2={y} stroke="#E2E8F0" strokeWidth="1" />
            <text x={2} y={y + 3} fontSize="8" fill="#94A3B8">{toFa(g)}</text>
          </g>
        );
      })}
      {segments.map(function (seg, si) {
        var dAttr = seg.map(function (p, i) { return (i === 0 ? "M" : "L") + p[0] + "," + p[1]; }).join(" ");
        return <path key={si} d={dAttr} fill="none" stroke="var(--brand)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />;
      })}
      {points.map(function (v, i) {
        if (v == null) return null;
        return <circle key={i} cx={xAt(i)} cy={yAt(v)} r={i === days - 1 ? 4 : 3} fill={colorFor(v)} stroke="#fff" strokeWidth="1" />;
      })}
      <text x={padL} y={h - 4} fontSize="9" fill="#94A3B8">{toFa(buckets[0].date.getDate())}/{toFa(buckets[0].date.getMonth() + 1)}</text>
      <text x={w - padR} y={h - 4} fontSize="9" fill="#94A3B8" textAnchor="end">امروز</text>
    </svg>
  );
}

function PatientDashboard({ record, setRecords }) {
  var found = findDiseaseById(record.diseaseId);
  var reg = found.reg, dz = found.dz;
  var activePhase = record.activePhase || 0;
  var phase = dz && PHASE_DATA[record.diseaseId] ? (PHASE_DATA[record.diseaseId].phases[activePhase] || PHASE_DATA[record.diseaseId].phases[0]) : null;
  var iso = todayISO();
  var todayLog = (record.logs || []).find(function (l) { return l.date === iso; }) || { date: iso, pain: null, done: [] };
  var [pain, setPain] = React.useState(todayLog.pain != null ? todayLog.pain : 5);
  var [peNrs, setPeNrs] = React.useState(5);
  var [peLocation, setPeLocation] = React.useState("");
  var [peNote, setPeNote] = React.useState("");
  var [peSavedAt, setPeSavedAt] = React.useState(null);

  function savePainEntry() {
    var entry = {
      ts: new Date().toISOString(),
      nrs: peNrs,
      location: peLocation || "—",
      note: peNote || "",
      phase: activePhase,
      disease: record.diseaseId
    };
    patch(function (r) {
      var list = (r.painEntries || []).slice();
      list.push(entry);
      return { painEntries: list };
    });
    setPeSavedAt(entry.ts);
    setPeNote("");
  }

  function patch(updater) {
    setRecords(function (prev) { return prev.map(function (r) { return r.id === record.id ? Object.assign({}, r, updater(r)) : r; }); });
  }
  function toggleDone(idx) {
    patch(function (r) {
      var logs = (r.logs || []).slice();
      var i = logs.findIndex(function (l) { return l.date === iso; });
      var entry = i >= 0 ? Object.assign({}, logs[i]) : { date: iso, pain: null, done: [] };
      var done = (entry.done || []).slice();
      var pos = done.indexOf(idx);
      if (pos >= 0) done.splice(pos, 1); else done.push(idx);
      entry.done = done;
      var events = (r.exerciseEvents || []).slice();
      events.push({ id: "ex" + Date.now(), ts: new Date().toISOString(), date: iso, exerciseIdx: idx, phase: activePhase, action: pos >= 0 ? "undone" : "done" });
      if (i >= 0) logs[i] = entry; else logs.push(entry);
      return { logs: logs, exerciseEvents: events };
    });
  }
  function savePain() {
    patch(function (r) {
      var logs = (r.logs || []).slice();
      var i = logs.findIndex(function (l) { return l.date === iso; });
      var entry = i >= 0 ? Object.assign({}, logs[i]) : { date: iso, pain: null, done: [] };
      entry.pain = pain;
      if (i >= 0) logs[i] = entry; else logs.push(entry);
      return { logs: logs };
    });
  }

  if (!dz) {
    return <div className="wrap mt16"><div className="empty">برنامهٔ این کد یافت نشد. با پزشک خود تماس بگیرید.</div></div>;
  }

  var doneToday = (todayLog.done || []).length;
  var totalToday = phase ? phase.exercises.length : 0;
  var recentEvents = (record.exerciseEvents || []).filter(function(e){ return e.ts && e.action === "done"; });
  var lastActivityTs = recentEvents.length ? recentEvents[recentEvents.length - 1].ts : null;
  var inactiveDays = lastActivityTs ? Math.floor((Date.now() - new Date(lastActivityTs).getTime()) / (24*60*60*1000)) : null;

  return (
    <div className="wrap mt16">
      {inactiveDays != null && inactiveDays >= 3 ? <div className="warn-box" style={{marginBottom:12}}><b>یادآوری:</b> چند روز است فعالیت تمرینی ثبت نکرده‌اید. اگر پزشک شما برنامه را برایتان تجویز کرده، امروز تمرین‌های مجاز خود را انجام دهید.</div> : null}
      {/* بخش ۱: توصیه‌های عمومی */}
      <div className="card">
        <div className="sec-title"><span className="bar" />
          {record.patient && record.patient.name ? "سلام " + record.patient.name + " عزیز" : "سلام، خوش آمدید"}
        </div>
        <div className="row" style={{ gap: 6, marginTop: 4 }}>
          <span className="chip">{reg ? reg.label : ""}</span>
          <span className="chip">{dz.name}</span>
          {phase ? <span className="chip">{phase.title}</span> : null}
        </div>
        {record.coachNote ? <div className="note-box mt12"><b>یادداشت پزشک:</b> {record.coachNote}</div> : null}
        {record.approved ? <div className="note-box mt12" style={{ borderColor: "var(--green)" }}><b>نسخهٔ پزشک:</b> این برنامه توسط پزشک شما تأیید و قفل شده است؛ امکان تغییر تشخیص، فاز یا نسخه از این صفحه وجود ندارد.</div> : null}
        {record.messages && record.messages.length > 0 ? (
          <div style={{ marginTop: 12, background: "#EFF6FF", border: "1px solid #BFDBFE", borderRadius: 12, padding: "10px 12px" }}>
            <div className="grp-label" style={{ marginTop: 0 }}><Info size={14} /> پیام‌های پزشک</div>
            <div style={{ display: "grid", gap: 8 }}>
              {record.messages.slice().reverse().slice(0, 5).map(function (m, i) {
                var dt = m.ts ? m.ts.replace("T", " ").substr(0, 16) : "—";
                return (
                  <div key={m.id || i} style={{ background: "#fff", border: "1px solid #DBEAFE", borderRadius: 10, padding: "8px 10px" }}>
                    <div style={{ fontSize: 11, color: "#475569", marginBottom: 4 }}>{dt}</div>
                    <div style={{ fontSize: 13.5, lineHeight: 1.9 }}>{m.text}</div>
                  </div>
                );
              })}
            </div>
          </div>
        ) : null}

        <div className="grp-label" style={{ marginTop: 14 }}><Info size={14} /> توصیه‌های عمومی</div>
        {phase && phase.general && phase.general.length ? (
          <ul className="advice-list">
            {phase.general.map(function (g, i) { return <li key={i}>{g}</li>; })}

        {dz.redFlags && dz.redFlags.length ? (
          <div className="warn-box mt12">

      </div>

                </div>
                {ex.o ? <div className="ex-tip"><b>نکته:</b> {ex.o}</div> : null}

            </div>
          );

  );
}

function PainLogView({ entries }) {
  var sorted = (entries || []).slice().sort(function (a, b) { return (b.ts || "").localeCompare(a.ts || ""); });
  var last7 = sorted.filter(function (e) {
    if (!e.ts) return false;
    var days = (Date.now() - new Date(e.ts).getTime()) / (1000 * 60 * 60 * 24);
    return days <= 7;
  });
  var avg7 = last7.length ? (last7.reduce(function (s, e) { return s + (e.nrs || 0); }, 0) / last7.length) : null;
  var latest = sorted[0];
  var max7 = last7.length ? Math.max.apply(null, last7.map(function (e) { return e.nrs || 0; })) : null;
  var trend = null;
  if (last7.length >= 2) {
    var half = Math.ceil(last7.length / 2);
    var recent = last7.slice(0, half);
    var older = last7.slice(half);
    var avgR = recent.reduce(function (s, e) { return s + (e.nrs || 0); }, 0) / recent.length;
    var avgO = older.reduce(function (s, e) { return s + (e.nrs || 0); }, 0) / older.length;
    if (avgR - avgO >= 1) trend = "افزایشی";
    else if (avgO - avgR >= 1) trend = "کاهشی";
    else trend = "پایدار";
  }
  return (
    <div style={{ marginTop: 14 }}>
      <div className="grp-label" style={{ marginTop: 0 }}><Activity size={14} /> ثبت درد بیمار (NRS + محل)</div>
      <div className="card" style={{ padding: "10px 14px", background: "#fff" }}>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 10, marginBottom: 10 }}>
          <div className="chip">آخرین NRS: <b>{latest ? toFa(latest.nrs) + "/۱۰" : "—"}</b></div>
          <div className="chip">محل: <b>{latest && latest.location ? latest.location : "—"}</b></div>
          <div className="chip">میانگین ۷ روز: <b>{avg7 != null ? toFa(avg7.toFixed(1)) + "/۱۰" : "—"}</b></div>
          <div className="chip">بیشینهٔ ۷ روز: <b>{max7 != null ? toFa(max7) + "/۱۰" : "—"}</b></div>
          <div className="chip">روند: <b>{trend || (avg7 != null ? "ناکافی" : "—")}</b></div>
          <div className="chip">تعداد: <b>{toFa(sorted.length)}</b></div>
        </div>
        <div style={{ maxHeight: 220, overflow: "auto", borderTop: "1px solid var(--line)", paddingTop: 6 }}>
          {sorted.slice(0, 15).map(function (e, i) {
            var dt = e.ts ? e.ts.replace("T", " ").substr(0, 16) : "—";
            return (
              <div key={i} className="log-row" style={{ alignItems: "flex-start" }}>
                <div style={{ minWidth: 130, fontWeight: 600 }}>{dt}</div>
                <div style={{ minWidth: 70 }}>NRS: <b style={{ color: (e.nrs || 0) >= 7 ? "#DC2626" : (e.nrs || 0) >= 4 ? "#D97706" : "#059669" }}>{toFa(e.nrs)}/۱۰</b></div>
                <div style={{ flex: 1 }}>محل: <b>{e.location || "—"}</b></div>
                <div style={{ flex: 2, color: "var(--muted)" }}>{e.note || ""}</div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function PatientPortal({ records, setRecords, onExitPatient }) {
  var [recordId, setRecordId] = React.useState(function () {
    try { return localStorage.getItem(PATIENT_SESSION_KEY) || null; } catch (e) { return null; }
  });
  var [patientLoginOpen, setPatientLoginOpen] = React.useState(true);
  var record = recordId ? records.find(function (r) { return r.id === recordId; }) : null;

  function handleLogin(code) {
    var match = records.find(function (r) { return r.accessCode && r.accessCode.toUpperCase() === code.toUpperCase(); });
    if (!match) return false;
    /* بیمار فقط اجراکننده و ثبت‌کننده است؛ هیچ تغییری در Prescription پزشکی از این مسیر ممکن نیست. */
    setRecordId(match.id);
    try { localStorage.setItem(PATIENT_SESSION_KEY, match.id); } catch (e) {}
    return true;
  }
  function logout() {
    setRecordId(null);
    try { localStorage.removeItem(PATIENT_SESSION_KEY); } catch (e) {}
  }

  if (!record) {
    if (!patientLoginOpen) {
      return (
        <div className="wrap" style={{ textAlign: "center", paddingTop: 30 }}>
          <p style={{ color: "var(--muted)" }}>برای مشاهدهٔ برنامهٔ تأییدشدهٔ پزشک، با کد دسترسی خود وارد شوید.</p>
          <div className="row" style={{ justifyContent: "center" }}>
            <button className="btn btn-p" onClick={function () { setPatientLoginOpen(true); }}><User size={14} /> ورود بیمار با کد دسترسی</button>
            {onExitPatient ? <button className="btn btn-o" onClick={onExitPatient}>بازگشت به صفحهٔ پزشک</button> : null}
          </div>
        </div>
      );
    }
    return <PatientLogin onLogin={handleLogin} onBackDoctor={onExitPatient} />;
  }
  return (
    <div>
      <PatientDashboard record={record} setRecords={setRecords} />
      <div className="wrap" style={{ textAlign: "center", marginTop: 4 }}>
        <div className="row" style={{ justifyContent: "center" }}>
          <button className="btn btn-o no-print" onClick={logout}>خروج از حساب</button>
          {onExitPatient ? <button className="btn btn-o no-print" onClick={onExitPatient}>بازگشت به صفحهٔ پزشک</button> : null}
        </div>
      </div>
    </div>
  );
}

function App() {
  var [step, setStep] = React.useState("region");
  var [regionId, setRegionId] = React.useState(null);
  var [diseaseId, setDiseaseId] = React.useState(null);
  var [findings, setFindings] = React.useState([]);
  var [history, setHistory] = React.useState([]);
  var [patient, setPatient] = React.useState(null);
  var [showPatient, setShowPatient] = React.useState(false);
  var [showList, setShowList] = React.useState(false);
  var [records, setRecords] = React.useState(loadRecords());
  var [currentId, setCurrentId] = React.useState(null);
  var mode = "doctor"; /* معماری نهایی: پزشک + بیمار؛ هیچ پنل درمانگر مجریی وجود ندارد */
  var [patientRoute, setPatientRoute] = React.useState(function () { try { return window.location.hash === "#patient"; } catch (e) { return false; } });
  function openPatientRoute() { try { window.location.hash = "patient"; } catch (e) {} setPatientRoute(true); window.scrollTo(0, 0); }
  function exitPatientRoute() { try { window.location.hash = ""; } catch (e) {} setPatientRoute(false); window.scrollTo(0, 0); }
  var [docAuthed, setDocAuthed] = React.useState(function () {
    try { return sessionStorage.getItem(DOCTOR_AUTH_KEY) === "1"; } catch (e) { return false; }
  });

  useEffect(function () { saveRecords(records); }, [records]);
  // به رکوردهای قدیمی‌تر که کد دسترسی ندارند، یک کد اختصاص بده
  useEffect(function () {
    var missing = records.some(function (r) { return !r.accessCode; });
    if (missing) {
      setRecords(function (prev) {
        var used = new Set(prev.map(function (x) { return x.accessCode; }).filter(Boolean));
        return prev.map(function (r) {
          if (r.accessCode) return r;
          var code;
          do {
            code = "";
            for (var i = 0; i < 6; i++) code += CODE_ALPHABET[Math.floor(Math.random() * CODE_ALPHABET.length)];
          } while (used.has(code));
          used.add(code);
          return Object.assign({}, r, {
            accessCode: code,
            activePhase: r.activePhase || 0,
            coachNote: r.coachNote || "",
            logs: r.logs || [],
            painEntries: r.painEntries || [],
            exerciseEvents: r.exerciseEvents || [],
            messages: r.messages || []
          });
        });
      });
    }
    // فقط یک‌بار در بارگذاری اولیه اجرا شود
    // eslint-disable-next-line
  }, []);

  function toggleFinding(id) {
    setFindings(function (prev) {
      return prev.indexOf(id) >= 0 ? prev.filter(function (x) { return x !== id; }) : prev.concat(id);
    });
  }
  function toggleHistory(id) {
    setHistory(function (prev) {
      return prev.indexOf(id) >= 0 ? prev.filter(function (x) { return x !== id; }) : prev.concat(id);
    });
  }
  function goRegion(rid) {
    setRegionId(rid);
    setDiseaseId(null);
    setFindings([]);
    setStep("disease");
  }
  function goDisease(did) {
    setDiseaseId(did);
    setFindings([]);
    setStep("phase");
  }
  function generate(phaseIdx) {
    if (!patient || !patient.nationalId || !/^\d{10}$/.test(String(patient.nationalId))) {
      setShowPatient(true);
      alert("ابتدا اطلاعات بیمار را کامل کنید؛ کد ملی معتبر برای ثبت پرونده الزامی است.");
      return;
    }
    var reg = DISEASE_MAP[regionId];
    var dz = reg.diseases.find(function (d) { return d.id === diseaseId; });
    var prevRec = currentId ? records.find(function (r) { return r.id === currentId; }) : null;
    var rec = {
      id: currentId || ("p" + Date.now()),
      date: todayFa(),
      regionLabel: reg.label,
      diseaseId: dz.id,
      diseaseLabel: dz.name,
      findings: findings,
      history: history,
      patient: patient,
      nationalId: patient.nationalId,
      doctorName: patient.doctorName || "پزشک معالج",
      count: findings.length,
      accessCode: (prevRec && prevRec.accessCode) || genAccessCode(records),
      activePhase: prevRec ? (prevRec.activePhase || 0) : (phaseIdx || 0),
      coachNote: prevRec ? (prevRec.coachNote || "") : "",
      logs: prevRec ? (prevRec.logs || []) : [],
      painEntries: prevRec ? (prevRec.painEntries || []) : [],
      exerciseEvents: prevRec ? (prevRec.exerciseEvents || []) : [],
      messages: prevRec ? (prevRec.messages || []) : [],
    };
    setRecords(function (prev) {
      var rest = prev.filter(function (r) { return r.id !== rec.id; });
      return rest.concat(rec);
    });
    setCurrentId(rec.id);
    setStep("plan");
    window.scrollTo(0, 0);
  }
  function updateRecord(id, updater) {
    setRecords(function (prev) { return prev.map(function (r) { return r.id === id ? Object.assign({}, r, updater(r)) : r; }); });
  }
  function loadRec(id) {
    var rec = records.find(function (r) { return r.id === id; });
    if (!rec) return;
    setRegionId(Object.keys(DISEASE_MAP).find(function (k) { return DISEASE_MAP[k].label === rec.regionLabel; }) || null);
    setDiseaseId(rec.diseaseId);
    setFindings(rec.findings || []);
    setHistory(rec.history || []);
    setPatient(rec.patient || null);
    setCurrentId(rec.id);
    setShowList(false);
    setStep("plan");
  }
  function deleteRec(id) {
    setRecords(function (prev) { return prev.filter(function (r) { return r.id !== id; }); });
  }
  function newRec() {
    setRegionId(null); setDiseaseId(null); setFindings([]); setHistory([]);
    setPatient(null); setCurrentId(null); setShowList(false); setShowPatient(false);
    setStep("region");
    window.scrollTo(0, 0);
  }
  function savePatient(p) {
    setPatient(p);
    setShowPatient(false);
  }
  function backFromPhase() { setStep("disease"); }

  var canGo = { region: true, disease: !!regionId, phase: !!diseaseId, plan: !!diseaseId };
  var reg = regionId ? DISEASE_MAP[regionId] : null;
  var dz = reg && diseaseId ? reg.diseases.find(function (d) { return d.id === diseaseId; }) : null;

  return (
    <div>
      <Header
        mode={mode}
        docAuthed={docAuthed}
        onSwitchMode={function () {}}
        onLogoutDoctor={function () { setDocAuthed(false); try { sessionStorage.removeItem(DOCTOR_AUTH_KEY); } catch (e) {} }}
        onPatients={function () { setShowList(true); }} onNew={newRec} recCount={records.length}
      />

      {patientRoute ? (
        <PatientPortal records={records} setRecords={setRecords} onExitPatient={exitPatientRoute} />
      ) : !docAuthed ? (
        <DoctorLogin onLogin={function () { setDocAuthed(true); try { sessionStorage.setItem(DOCTOR_AUTH_KEY, "1"); } catch (e) {} }} />
      ) : (
        <>
          <StepsBar step={step} setStep={setStep} canGo={canGo} />

          {step === "region" ? <RegionStep regionId={regionId} onSelect={goRegion} /> : null}
          {step === "disease" && reg ? <DiseaseStep regionId={regionId} diseaseId={diseaseId} onSelect={goDisease} onBack={function () { setStep("region"); }} /> : null}
          {(step === "disease" || step === "phase" || step === "plan") && !reg ? (
            <div className="wrap mt16"><div className="card">
              <div className="sec-title"><span className="bar" />ناحیه پیدا نشد</div>
              <p className="sec-desc">این پرونده به ناحیه‌ای اشاره می‌کند که در نسخهٔ فعلی برنامه وجود ندارد.</p>
              <button className="btn btn-p" onClick={newRec}><Plus size={16} /> پروندهٔ جدید</button>
            </div></div>
          ) : null}
          {step === "phase" && reg && !dz ? (
            <div className="wrap mt16"><div className="card">
              <div className="sec-title"><span className="bar" />بیماری پیدا نشد</div>
              <p className="sec-desc">این پرونده به بیماری‌ای اشاره می‌کند که در نسخهٔ فعلی برنامه وجود ندارد یا حذف شده است.</p>
              <button className="btn btn-o" onClick={function () { setStep("disease"); }}><ChevronRight size={16} /> انتخاب بیماری</button>
            </div></div>
          ) : null}
          {step === "phase" && dz ? (
            <PhaseStep
              diseaseId={diseaseId} history={history} onToggleHistory={toggleHistory}
              patient={patient} onEditPatient={function () { setShowPatient(true); }}
              onGenerate={generate} onBack={backFromPhase}
            />
          ) : null}
          {step === "plan" ? (
            <PlanStep
              regionId={regionId} diseaseId={diseaseId} history={history} patient={patient}
              record={records.find(function (r) { return r.id === currentId; })}
              onUpdateRecord={function (updater) { updateRecord(currentId, updater); }}
              onBack={function () { setStep("phase"); }} onNew={newRec}
            />
          ) : null}

          {showPatient ? (
            <PatientModal
              patient={patient}
              onSave={savePatient}
              onClose={function () { setShowPatient(false); }}
            />
          ) : null}
          {showList ? (
            <PatientsModal
              records={records.slice().reverse()}
              onLoad={loadRec}
              onDelete={deleteRec}
              onClose={function () { setShowList(false); }}
              onNewRec={newRec}
            />
          ) : null}
        </>
      )}

      <div className="foot no-print">
        <b>توان‌یار</b> — پلتفرم مدیریت توانبخشی با هدایت پزشک؛ بر پایهٔ <bdi>Braddom's PM&amp;R</bdi> (ویرایش ۷) و <bdi>Frontera Essentials of PM&amp;R</bdi> (ویرایش ۴).<br />
        تصمیم بالینی نهایی همیشه در اختیار پزشک است؛ توان‌یار فقط تصمیم پزشک را ساختارمند می‌کند، نسخه را تولید می‌کند، اجرای بیمار را پایش می‌کند و نتیجه را به پزشک برمی‌گرداند.
        <div className="row" style={{ marginTop: 8 }}>
          <button className="btn btn-o" onClick={openPatientRoute}><User size={14} /> ورود بیمار با کد دسترسی</button>
        </div>
      </div>
    </div>
  );
}

class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { error: null, info: null };
  }
  static getDerivedStateFromError(error) {
    return { error: error };
  }
  componentDidCatch(error, info) {
    this.setState({ error: error, info: info });
    try { console.error("Tavanyar crash:", error, info); } catch (e) {}
  }
  handleReset() {
    this.setState({ error: null, info: null });
    try { window.scrollTo(0, 0); } catch (e) {}
  }
  render() {
    if (this.state.error) {
      var msg = (this.state.error && (this.state.error.message || String(this.state.error))) || "خطای نامشخص";
      var stack = (this.state.error && this.state.error.stack) || "";
      return (
        <div dir="rtl" style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", padding: 20, fontFamily: "Vazirmatn, sans-serif", background: "#F1F5F9" }}>
          <div style={{ maxWidth: 640, width: "100%", background: "#fff", border: "1px solid #FECACA", borderRadius: 16, padding: 22, boxShadow: "0 8px 24px -12px rgba(15,23,42,.2)" }}>
            <div style={{ fontWeight: 800, fontSize: 16, color: "#DC2626", marginBottom: 8 }}>یک خطا رخ داد و صفحه بارگذاری نشد</div>
            <div style={{ fontSize: 13, color: "#475569", lineHeight: 1.8, marginBottom: 12 }}>
              متأسفانه در نمایش این بخش مشکلی پیش آمد. پیام خطا (لطفاً برای رفع مشکل این متن را ارسال کنید):
            </div>
            <div style={{ background: "#FEF2F2", border: "1px solid #FECACA", borderRadius: 10, padding: 12, fontSize: 12, fontFamily: "monospace", direction: "ltr", textAlign: "left", color: "#991B1B", whiteSpace: "pre-wrap", wordBreak: "break-word", maxHeight: 220, overflow: "auto" }}>
              {msg}
              {stack ? "\n\n" + stack : ""}
            </div>
            <div style={{ display: "flex", gap: 8, marginTop: 16 }}>
              <button
                onClick={() => { try { localStorage.removeItem("tav_plans_v2"); } catch (e) {} window.location.reload(); }}
                style={{ background: "#DC2626", color: "#fff", border: "none", borderRadius: 999, padding: "9px 16px", fontSize: 12.5, fontWeight: 700, cursor: "pointer" }}
              >
                پاک کردن اطلاعات ذخیره‌شده و شروع مجدد
              </button>
              <button
                onClick={() => window.location.reload()}
                style={{ background: "#fff", color: "#334155", border: "1.5px solid #CBD5E1", borderRadius: 999, padding: "9px 16px", fontSize: 12.5, fontWeight: 700, cursor: "pointer" }}
              >
                بارگذاری مجدد صفحه
              </button>
            </div>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

<script>
  (function(){
    /* Splash: به‌جای تایمر ثابت ۲ ثانیه‌ای، تا کامل‌شدن انیمیشن (عنوان + نام توسعه‌دهنده) و آماده‌شدن برنامه صبر می‌کند */
    var el=document.getElementById("tavanyar-splash");
    if(!el) return;
    var t0=Date.now();
    var MIN_MS=5600;      /* حداقل نمایش: عنوان ≈۲٫۱ث، نام توسعه‌دهنده ≈۳٫۳ث، سپس حدود ۲ ثانیه ماندگاری */
    var MAX_MS=20000;     /* سقف ایمنی اگر بارگذاری برنامه طولانی شد */
    var SKIP_MS=3600;     /* پس از نمایش کامل نام توسعه‌دهنده، با لمس می‌توان رد کرد */
    var done=false;
    function appReady(){
      var r=document.getElementById("root");
      return !!(r && r.children.length && !document.getElementById("boot-msg"));
    }
    function hide(){
      if(done) return; done=true;
      el.classList.add("hide");
      setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 900);
    }
    function tick(){
      if(done) return;
      var dt=Date.now()-t0;
      if(dt>=SKIP_MS) el.classList.add("skippable");
      if((dt>=MIN_MS && appReady()) || dt>=MAX_MS) hide(); else setTimeout(tick,150);
    }
    el.addEventListener("click", function(){ if(Date.now()-t0>=SKIP_MS && appReady()) hide(); });
    tick();
  })();
</script>

<script>
/* ===== Tavanyar Prescription Core v1 — لایهٔ نگاشت PHASE_DATA → Clinical Guide → Physician Prescription =====
   معماری: پزشک = تصمیم‌گیرنده و تعیین‌کنندهٔ مسیر؛ توان‌یار = پشتیبان تصمیم و تولید نسخه؛
   درمانگر مجری = مجری نسخهٔ چاپی (بدون پنل مستقل)؛ بیمار = دریافت‌کننده و ثبت‌کنندهٔ برنامه.

(function () {
  function faD(v) { return String(v == null ? "" : v).replace(/\d/g, function (d) { return "۰۱۲۳۴۵۶۷۸۹"[+d]; }); }
  var CORE = {};

  /* — Patient Clinical Snapshot — فقط از پروندهٔ موجود؛ کد ملی ماسک می‌شود (Privacy) */
  CORE.snapshot = function (record, dz, reg, hxLabels) {
    var p = (record && record.patient) || {};
    var nid = String(p.nationalId || (record && record.nationalId) || "");
    var nidMasked = nid.length === 10 ? nid.substr(0, 3) + "••••" + nid.substr(7) : "—";
    return {
      name: p.name || "—",
      age: (p.age != null && p.age !== "") ? faD(p.age) : "—",
      sex: p.sex || "—",
      recordId: (record && record.id) ? String(record.id) : "—",
      nidMasked: nidMasked,
      diagnosis: (dz && dz.name) || (record && record.diseaseLabel) || "—",
      region: (reg && reg.label) || (record && record.regionLabel) || "—",
      side: p.side || "ثبت نشده",
      bodyArea: (reg && reg.label) || "—",
      comorbid: (hxLabels && hxLabels.length) ? hxLabels.join("، ") : "ثبت نشده",
      symptomStart: p.symptomStart || "ثبت نشده",
      injuryMechanism: p.injuryMechanism || "ثبت نشده",
      surgeryDate: p.surgeryDate || "ثبت نشده",
      physician: p.doctorName || (record && record.doctorName) || "پزشک معالج",
      visitDate: (record && record.date) || "—",
      visitType: (record && record.approved) ? "ویزیت با تأیید و صدور نسخهٔ توانبخشی" : "ویزیت — نسخه هنوز توسط پزشک تأیید نشده است",
      clinicalBrief: [
        p.note ? "یادداشت بالینی پزشک: " + p.note : "",
        (hxLabels && hxLabels.length) ? "سوابق / comorbidities مؤثر: " + hxLabels.join("، ") : "",

        p.surgeryDate ? "جراحی/مداخله: " + p.surgeryDate : "",
        (dz && dz.redFlags && dz.redFlags.length) ? "فلگ‌های قرمز تشخیص (نمایش در بخش مراجعه مجدد): " + dz.redFlags.slice(0, 3).join("؛ ") : ""
      ].filter(Boolean).join(" — ") || "موردی ثبت نشده است",
      phaseTitle: "—"
    };
  };

  /* — Clinical Guide — فقط از داده‌های موجود (PHASE_DATA / PHASE_META / Evidence KB / redFlags) */
  CORE.guide = function (dz, diseaseId, phaseIdx) {
    var EB = (window.TAVANYAR_EVIDENCE_KB || {})[diseaseId] || null;
    var phase = null, metaTitle = "";
    try {
      var PDATA = window.PHASE_DATA || {};
      var phasesData = (PDATA[diseaseId] && PDATA[diseaseId].phases) || [];
      phase = phasesData[phaseIdx] || null;
      var META = window.PHASE_META || {};
      var meta = (META[diseaseId]) ? META[diseaseId][phaseIdx] : null;
      metaTitle = meta ? meta.title : "";
    } catch (e) {}
    var chapters = {};
    if (EB) {
      ["bd_mod", "bd_ex", "bd_con", "fr_mod", "fr_ex", "fr_con"].forEach(function (f) {
        (EB[f] || []).forEach(function (q) {
          if (q && q.ch) { var ch = String(q.ch).trim(); if (ch) chapters[ch.substr(0, 70)] = true; }
        });
      });
    }
    var quoteCount = EB ? ["bd_mod", "bd_ex", "bd_con", "fr_mod", "fr_ex", "fr_con"].reduce(function (s, f) { return s + ((EB[f] || []).length); }, 0) : 0;
    return {
      phaseTitle: phase ? phase.title : (metaTitle || "—"),
      goalsText: phase ? (phase.criteria || "در Knowledge Base ثبت نشده است") : "در Knowledge Base ثبت نشده است",
      assessments: ["Pain (NRS)", "ROM", "Strength", "Swelling/Edema", "Functional status"],
      assessmentsNote: "شاخص‌های عمومی ارزیابی مطابق روال بالینی فاز. PROM اختصاصی بیماری (مانند ODI، NDI، LEFS، DASH، KOOS) در Knowledge Base فعلی تعریف نشده است؛ تا وقتی منبع معتبر آن در سیستم ثبت نشود، آزمون اختصاصی ساخته نمی‌شود.",
      redFlags: (dz && dz.redFlags) ? dz.redFlags.slice() : [],
      precautions: EB ? (EB.precaut || []).slice() : [],
      pearls: EB ? (EB.pearls || []).slice() : [],
      chapters: Object.keys(chapters),
      quoteCount: quoteCount,
      sourceLabel: (window.sourceLabel && dz) ? window.sourceLabel(dz.id) : ""
    };
  };

  /* — Modality Clinical Cards — از Agent Evidence منتقل‌شده؛ بدون پارامتر یا شواهد جدید */
  CORE.agentCards = function (diseaseId, phase) {
    var KW = window.__TAV_AGENT_KW__ || [];
    var DZM = window.__TAV_AGENT_DZ__ || {};
    var dzE = DZM[diseaseId] || null;
    var mods = (phase && (phase.modalities || [])) || [];
    var cards = [];
    mods.forEach(function (m) {
      var matched = null;
      for (var j = 0; j < KW.length; j++) { if (KW[j].re.test(m)) { matched = KW[j]; break; } }
      var dzMatch = null;
      if (dzE) {
        for (var j2 = 0; j2 < (dzE.m || []).length; j2++) {
          var cand = dzE.m[j2];
          if (m.indexOf(cand.m) > -1 || cand.m.indexOf(m) > -1) { dzMatch = cand; break; }
        }
      }
      var evidence;
      if (dzMatch) evidence = "Disease-specific external evidence" + (dzMatch.src ? " — " + dzMatch.src : "");
      else if (matched) evidence = "Agent-level evidence" + (matched.src ? " — " + matched.src : "");
      else evidence = "No specific Cameron evidence identified — شواهد اختصاصی کافی در منابع بررسی‌شده ثبت نشده است";
      cards.push({
        name: m,
        indication: dzMatch ? dzMatch.m : (matched ? matched.m : m),
        parameters: "Parameter not specifically defined in the reviewed source.",
        contraindications: matched ? (matched.ac || []).slice() : [],
        dzRelativePrecautions: (dzE ? (dzE.rc || []) : []).slice(),
        stop: "توقف در صورت تشدید درد، علامت جدید یا بروز هر مورد از فلگ‌های قرمز پرونده",
        evidence: evidence
      });
    });
    return cards;
  };

  /* — Printable Prescription (A4) — پنجرهٔ تمیز مستقل از UI نرم‌افزار؛ بدون کد دسترسی و دادهٔ حساس */
  CORE.printable = function (ctx) {
    function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
    function ul(items) {
      if (!items || !items.length) return '<div class="empty">موردی ثبت نشده است.</div>';
      return '<ul>' + items.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>';
    }
    var S = ctx.snapshot || {};
    var snapRows = [
      ["نام بیمار", S.name], ["سن", S.age], ["جنس", S.sex], ["شناسهٔ پرونده", S.recordId],
      ["تشخیص اصلی", S.diagnosis], ["ناحیه / سمت", (S.region || "—") + " / " + (S.side || "—")],
      ["کد ملی (ماسک‌شده)", S.nidMasked],
      ["سابقهٔ مؤثر", S.comorbid], ["شروع علائم", S.symptomStart],
      ["مکانیسم آسیب", S.injuryMechanism], ["جراحی/مداخله", S.surgeryDate],
      ["پزشک مسئول", S.physician], ["تاریخ ویزیت", S.visitDate], ["نوع ویزیت", S.visitType],
      ["خلاصهٔ بالینی (Clinical Brief)", S.clinicalBrief], ["فاز فعلی توانبخشی", S.phaseTitle]
    ].map(function (r) { return '<div><span>' + esc(r[0]) + '</span><b>' + esc(r[1] || "—") + '</b></div>'; }).join('');
    var exRows = (ctx.exercises || []).map(function (ex) {
      return '<tr><td>' + esc(ex.n) + '</td><td>' + esc(ex.s) + '</td><td>' + esc(ex.r) + '</td><td>' + esc(ex.h || "—") + '</td><td>' + esc(ex.f) + '</td><td>' + esc(ex.o || "—") + '</td></tr>';
    }).join('');
    var modHtml = (ctx.modalities || []).map(function (m) {
      return '<div class="mod"><div class="mod-t">' + esc(m.name) + '</div>' +
        '<div><b>هدف / Indication:</b> ' + esc(m.indication || "—") + '</div>' +
        '<div><b>Parameters:</b> ' + esc(m.parameters || "طبق تعیین پزشک") + '</div>' +
        '<div><b>Contraindications:</b> ' + (m.contraindications && m.contraindications.length ? esc(m.contraindications.join("؛ ")) : "موردی ثبت نشده است.") + '</div>' +
        '<div><b>Evidence Status:</b> ' + esc(m.evidence || "—") + '</div></div>';
    }).join('') || '<div class="empty">مدالیتهٔ فیزیکی توسط پزشک تأیید نشده است (شواهد اختصاصی کافی موجود نیست ← سیستم مدالیته حدس نمی‌زند).</div>';
    var restrictions = (ctx.ebPrecaut || []).slice();
    var rxMeta = (ctx.freq || ctx.goalNote)
      ? '<div><b>تعداد جلسات / دفعات (Frequency / Duration):</b> ' + esc(ctx.freq || "مطابق تعیین پزشک") + '</div>' +
        (ctx.goalNote ? '<div><b>هدف / تعدیل ویژهٔ پزشک:</b> ' + esc(ctx.goalNote) + '</div>' : '') +
        '<div><b>وضعیت نسخه:</b> تأیید و قفل‌شده توسط پزشک (Physician-controlled)</div>'
      : "";
    var precautions = (ctx.hxPrecautions || []).slice();
    var dnp = ((window.__TAV_AGENT_DZ__ || {})[ctx.diseaseId] || {}).ac || [];
    var legal = "این برنامه بر اساس ارزیابی و تصمیم پزشک تنظیم شده است. اجرای مداخلات توانبخشی باید با توجه به وضعیت بالینی بیمار و محدودیت‌های درج‌شده در این برنامه انجام شود. هرگونه تغییر اساسی در مسیر توانبخشی، فاز درمان یا محدودیت‌های پزشکی باید با پزشک مسئول هماهنگ شود.";
    return '<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8" />' +
      '<title>توان‌یار — برنامه توانبخشی بیمار</title>' +
      '<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet" />' +
      '<style>' +
      '@page{size:A4;margin:14mm 13mm 16mm 13mm;}' +
      '*{box-sizing:border-box;}' +
      'body{font-family:Vazirmatn,Tahoma,sans-serif;color:#0F172A;font-size:12px;line-height:1.9;margin:0;background:#fff;}' +
      '.head{display:flex;justify-content:space-between;align-items:center;border-bottom:2.5px solid #0F766E;padding-bottom:10px;margin-bottom:14px;}' +
      '.brand{font-size:19px;font-weight:800;color:#0F766E;}' +
      '.brand small{display:block;font-size:10.5px;color:#475569;font-weight:500;}' +
      '.meta{text-align:left;font-size:11px;color:#475569;}' +
      'h2{font-size:13px;color:#0F766E;border-bottom:1.5px solid #CBD5E1;padding-bottom:4px;margin:16px 0 8px;break-after:avoid;}' +
      '.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;}' +
      '.grid>div{background:#F8FAFC;border:1px solid #E2E8F0;border-radius:8px;padding:6px 9px;}' +
      '.grid span{display:block;color:#64748B;font-size:9.5px;}' +
      '.grid b{font-size:11px;}' +
      'table{width:100%;border-collapse:collapse;font-size:10.5px;}' +
      'th,td{border:1px solid #CBD5E1;padding:5px 7px;text-align:right;vertical-align:top;}' +
      'th{background:#F0FDFA;color:#115E59;font-size:10px;}' +
      'ul{margin:4px 0;padding-inline-start:20px;}' +
      'li{margin-bottom:3px;}' +
      '.empty{color:#64748B;font-size:11px;}' +
      '.mod{border:1px solid #E2E8F0;border-radius:9px;padding:8px 11px;margin:7px 0;font-size:11px;break-inside:avoid;}' +
      '.mod-t{font-weight:800;color:#0F766E;margin-bottom:3px;}' +
      '.warn{background:#FEF2F2;border:1px solid #FECACA;border-radius:9px;padding:8px 11px;}' +
      '.amber{background:#FFFBEB;border:1px solid #FDE68A;border-radius:9px;padding:8px 11px;}' +
      '.sig{display:flex;gap:24px;margin-top:20px;font-size:11px;}' +
      '.sig>div{flex:1;border-top:1.5px dashed #94A3B8;padding-top:6px;text-align:center;color:#334155;}' +
      '.legal{margin-top:14px;background:#F8FAFC;border:1px solid #E2E8F0;border-radius:9px;padding:9px 12px;font-size:10.5px;color:#334155;text-align:justify;}' +
      '.rxmeta{background:#F0FDFA;border:1px solid #99F6E4;border-radius:9px;padding:8px 11px;font-size:11px;}' +
      '.foot{margin-top:10px;font-size:9.5px;color:#64748B;display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;}' +
      '.toolbar{position:fixed;top:10px;left:10px;display:flex;gap:8px;}' +
      '.toolbar button{font-family:inherit;border:none;background:#0F766E;color:#fff;border-radius:8px;padding:8px 16px;font-size:12.5px;font-weight:700;cursor:pointer;}' +
      '.toolbar button.sec{background:#fff;color:#0F172A;border:1.5px solid #CBD5E1;}' +
      '@media print{.toolbar{display:none !important;}body{font-size:11.5px;}h2{break-after:avoid;}table,.mod,.warn,.amber,.legal{break-inside:avoid;}}' +
      '</style></head><body>' +
      '<div class="toolbar"><button onclick="window.print()">چاپ / ذخیره PDF</button><button class="sec" onclick="window.close()">بستن</button></div>' +
      '<div class="head"><div class="brand">توان‌یار<small>برنامه توانبخشی بیمار — Physician-Guided Rehabilitation Prescription</small></div>' +
      '<div class="meta">شمارهٔ پرونده: ' + esc(ctx.recordId) + '<br/>تاریخ صدور: ' + esc(ctx.recordDate) + '</div></div>' +
      '<h2>اطلاعات بیمار (Patient Information)</h2><div class="grid">' + snapRows + '</div>' +
      '<h2>تشخیص (Diagnosis)</h2><div>' + esc((ctx.dz && ctx.dz.name) || "—") + (S.region ? ' — ناحیه: ' + esc(S.region) : '') + '</div>' +
      '<h2>فاز فعلی توانبخشی (Current Rehabilitation Phase)</h2><div><b>' + esc((ctx.phase && ctx.phase.title) || "—") + '</b>' + (ctx.phase && ctx.phase.criteria ? '<div style="font-size:11px;color:#475569">' + esc(ctx.phase.criteria) + '</div>' : '') + '</div>' +
      '<h2>اهداف (Goals)</h2><div>' + esc((ctx.guide && ctx.guide.goalsText) || "در Knowledge Base ثبت نشده است") + '</div>' +
      '<h2>ارزیابی‌های مورد انتظار (Assessment)</h2><div>' + esc((ctx.guide && ctx.guide.assessments || []).join("، ")) + '<div style="font-size:10.5px;color:#64748B">' + esc((ctx.guide && ctx.guide.assessmentsNote) || "") + '</div></div>' +
      (rxMeta ? '<h2>Frequency / Duration و هدف پزشک</h2><div class="rxmeta">' + rxMeta + '</div>' : '') +
      '<h2>برنامه تمرینی (Exercise Prescription)</h2>' +
      (exRows ? '<table><thead><tr><th>تمرین</th><th>ست</th><th>تکرار</th><th>مدت/نگه‌داشت</th><th>تکرار در هفته</th><th>نکته</th></tr></thead><tbody>' + exRows + '</tbody></table>' : '<div class="empty">تمرینی تأیید نشده است.</div>') +
      '<h2>مداخلات فیزیکی (Physical Agents / Interventions)</h2>' + modHtml +
      '<h2>محدودیت‌ها (Restrictions)</h2>' + ul(restrictions) +
      '<h2>احتیاطات (Precautions)</h2>' + (precautions.length ? '<div class="amber">' + ul(precautions) + '</div>' : ul(precautions)) +
      '<h2>موارد ممنوع (Do Not Perform)</h2>' + ul(dnp) +
      '<h2>معیارهای توقف (Stop Criteria)</h2>' + ul(["توقف فوری تمرین و تماس با پزشک در صورت بروز هر یک از موارد بخش «مراجعه مجدد به پزشک»", "تشدید واضح درد، علامت جدید عصبی، تورم یا ناتوانی جدید"]) +
      '<h2>معیارهای مراجعه مجدد به پزشک (Return-to-Physician Criteria)</h2>' +
      '<div class="warn">' + ul(((ctx.redFlags && ctx.redFlags.length) ? ctx.redFlags.slice() : []).concat(["در صورت بروز هر یک از موارد بالا، تمرین‌ها متوقف و فوراً به پزشک مراجعه شود."]).concat((ctx.redFlags && ctx.redFlags.length) ? [] : ["تشدید درد، علامت جدید عصبی، ضعف پیشرونده یا عدم بهبود مورد انتظار ← مراجعه به پزشک."])) + '</div>' +
      '<h2>برنامه منزل (Home Program)</h2>' + ul(ctx.general) +
      '<h2>تعداد جلسات / دفعات (Frequency / Duration)</h2><div>مطابق تعیین پزشک در همین نسخه (در صورت تعریف؛ در غیر این صورت اجرا طبق برنامهٔ تمرینی بالا و صلاحدید مرکز اجرا، بدون تغییر مسیر درمان).</div>' +
      '<div class="sig"><div>پزشک: ' + esc(ctx.physician) + '</div><div>تاریخ: ' + esc(ctx.recordDate) + '</div><div>امضا و مهر پزشک</div></div>' +
      '<div class="legal">' + esc(legal) + '</div>' +
      '<div class="foot"><span>توان‌یار — پلتفرم مدیریت توانبخشی با هدایت پزشک</span><span>این نسخه برای ارائه به مرکز/درمانگر اجراکننده طراحی شده است و نیازی به حساب کاربری در توان‌یار نیست (مسیر: پزشک ← چاپ ← بیمار ← اجرا).</span></div>' +
      '<script>setTimeout(function(){window.print();},600);<\/script>' +
      '</body></html>';
  };

  CORE.open = function (html) {
    var w = window.open("", "_blank");
    if (!w) { alert("اجازهٔ باز کردن پنجرهٔ چاپ داده نشد؛ لطفاً popup این صفحه را مجاز کنید."); return false; }
    w.document.open(); w.document.write(html); w.document.close();
    return true;
  };

  /* — ساخت و بازکردن نسخهٔ چاپی فقط برای پروندهٔ تأییدشدهٔ پزشک — */
  CORE.openPrintableForRecord = function (record) {
    if (!record) { alert("پرونده‌ای برای چاپ یافت نشد."); return; }
    if (!record.approved) { alert("نسخهٔ چاپی فقط پس از تأیید نهایی پزشک فعال می‌شود."); return; }
    var found = (window.findDiseaseById) ? window.findDiseaseById(record.diseaseId) : { reg: null, dz: null };
    var dz = found.dz, reg = found.reg;
    var PDATA = window.PHASE_DATA || {};
    var phaseIdx = (record.rx && typeof record.rx.phase === "number") ? record.rx.phase : (record.activePhase || 0);
    var phase = (PDATA[record.diseaseId] && PDATA[record.diseaseId].phases[phaseIdx]) || null;
    if (!phase) { alert("دادهٔ فاز برای این پرونده یافت نشد."); return; }
    var guide = CORE.guide(dz, record.diseaseId, phaseIdx);
    var cards = CORE.agentCards(record.diseaseId, phase);
    var rx = record.rx || { exercises: (phase.exercises || []).map(function (_, i) { return i; }), modalities: (phase.modalities || []).map(function (_, i) { return i; }) };
    var exercises = (rx.exercises || []).map(function (i) { return (phase.exercises || [])[i]; }).filter(Boolean);
    var modalities = (rx.modalities || []).map(function (i) { return (phase.modalities || [])[i]; }).filter(Boolean).map(function (mName) {
      var card = cards.filter(function (c) { return c.name === mName; })[0];
      return card ? card : { name: mName, indication: mName, parameters: "Parameter not specifically defined in the reviewed source.", contraindications: [], evidence: "No specific Cameron evidence identified — شواهد اختصاصی کافی در منابع بررسی‌شده ثبت نشده است." };
    });
    var eb = (window.TAVANYAR_EVIDENCE_KB || {})[record.diseaseId] || {};
    var rxRaw = record.rx || {};
    var ebPrecautAll = eb.precaut || [];
    var restrictions = (rx && rx.restrictions && typeof rx.restrictions.length === "number")
      ? rx.restrictions.map(function (i) { return ebPrecautAll[i]; }).filter(Boolean)
      : ebPrecautAll.slice();
    var home = (rx && rx.home && typeof rx.home.length === "number")
      ? rx.home.map(function (i) { return (phase.general || [])[i]; }).filter(Boolean)
      : (phase.general || []).slice();
    var snap = CORE.snapshot(record, dz, reg, (window.HistoryEffects ? (window.HistoryEffects(record.history || []) || []) : []).map(function (h) { return h.label; }));
    snap.phaseTitle = phase.title;
    var hxPrec = (window.buildPlan && dz) ? ((window.buildPlan(dz, [], record.history || []) || {}).precautions || []) : [];
    var html = CORE.printable({
      snapshot: snap, dz: dz, diseaseId: record.diseaseId, phase: phase, phaseIdx: phaseIdx,
      guide: guide, exercises: exercises, modalities: modalities,
      ebPrecaut: restrictions,
      hxPrecautions: hxPrec, general: home, redFlags: (dz && dz.redFlags) || [],
      physician: snap.physician, recordDate: record.date || "", recordId: record.id || "",
      freq: rxRaw.freq || "", goalNote: rxRaw.goalNote || ""
    });
    CORE.open(html);
  };

  window.TAVANYAR_CORE = CORE;
  window.findDiseaseByIdRef = null; /* در اسکریپت اصلی تنظیم نمی‌شود؛ findDiseaseById به‌صورت سراسری در دسترس است */
})();

</script>

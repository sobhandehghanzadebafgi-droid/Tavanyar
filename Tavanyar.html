<script>
  window.addEventListener("error", function (e) {
    var el = document.getElementById("boot-msg");
    if (el && (!window.React || !window.ReactDOM || !window.Babel)) {
      el.innerHTML = "بارگذاری کتابخانه‌های لازم (React/Babel) از CDN ناموفق بود.<br/>لطفاً از اتصال اینترنت خود مطمئن شوید و صفحه را دوباره بارگذاری کنید.";
    }
  }, true);

  window.storage = {
    async get(key, shared) {
      try {
        var raw = window.localStorage.getItem(key);
        if (raw === null || raw === undefined) return null;
        return { key: key, value: raw, shared: !!shared };
      } catch (e) { return null; }
    },
    async set(key, value, shared) {
      try {
        window.localStorage.setItem(key, value);
        return { key: key, value: value, shared: !!shared };
      } catch (e) { return { error: e && e.name }; }
    },
    async delete(key, shared) {
      try {
        window.localStorage.removeItem(key);
        return { key: key, deleted: true, shared: !!shared };
      } catch (e) { return null; }
    },
    async list(prefix, shared) {
      try {
        var keys = Object.keys(window.localStorage).filter(function (k) { return !prefix || k.indexOf(prefix) === 0; });
        return { keys: keys, prefix: prefix, shared: !!shared };
      } catch (e) { return null; }
    }
  };
</script>

function MiniLineChart({ data, series, height = 160 }) {
  const width = 640;
  const padding = { top: 12, right: 14, bottom: 26, left: 28 };
  const innerW = width - padding.left - padding.right;
  const innerH = height - padding.top - padding.bottom;
  const n = data.length;
  if (!n) return <div className="muted" style={{ padding: 20, textAlign: "center" }}>داده‌ای نیست</div>;
  const xStep = n > 1 ? innerW / (n - 1) : 0;
  const yMin = 0, yMax = 10;
  const yScale = (v) => padding.top + innerH - ((v - yMin) / (yMax - yMin)) * innerH;
  const xScale = (i) => padding.left + i * xStep;
  const gridVals = [0, 2, 4, 6, 8, 10];
  const step = Math.max(1, Math.ceil(n / 8));
  return (
    <div>
      <svg viewBox={`0 0 ${width} ${height}`} width="100%" height={height} preserveAspectRatio="none" style={{ display: "block", direction: "ltr" }}>
        {gridVals.map((v) => (
          <g key={v}>
            <line x1={padding.left} x2={width - padding.right} y1={yScale(v)} y2={yScale(v)} stroke="var(--line)" strokeDasharray="3 3" />
            <text x={padding.left - 6} y={yScale(v) + 3} fontSize="9" textAnchor="end" fill="var(--muted)">{toFa(v)}</text>
          </g>
        ))}
        {data.map((d, i) => (
          i % step === 0 || i === n - 1 ? (
            <text key={i} x={xScale(i)} y={height - 6} fontSize="9" textAnchor="middle" fill="var(--muted)">{d.date}</text>
          ) : null
        ))}
        {series.map((s) => {
          const points = data.map((d, i) => `${xScale(i)},${yScale(d[s.key] ?? 0)}`).join(" ");
          return (
            <g key={s.key}>
              <polyline points={points} fill="none" stroke={s.color} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" />
              {data.map((d, i) => <circle key={i} cx={xScale(i)} cy={yScale(d[s.key] ?? 0)} r="3" fill={s.color} />)}
            </g>
          );
        })}
      </svg>
      {series.length > 1 && (
        <div className="row" style={{ gap: 14, justifyContent: "center", marginTop: 6 }}>
          {series.map((s) => (
            <div key={s.key} className="row" style={{ gap: 5, fontSize: 11.5, color: "var(--muted)" }}>
              <span style={{ width: 8, height: 8, borderRadius: 999, background: s.color }} />
              {s.label}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function useIsMobile(breakpoint = 760) {
  const [isMobile, setIsMobile] = useState(() => (typeof window !== "undefined" ? window.innerWidth <= breakpoint : false));
  useEffect(() => {
    const onResize = () => setIsMobile(window.innerWidth <= breakpoint);
    window.addEventListener("resize", onResize);
    return () => window.removeEventListener("resize", onResize);
  }, [breakpoint]);
  return isMobile;
}

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const toFa = (n) => String(n).replace(/[0-9]/g, (d) => "۰۱۲۳۴۵۶۷۸۹"[d]);
const todayStr = () => new Date().toISOString().slice(0, 10);
const faDate = () => new Date().toLocaleDateString("fa-IR", { weekday: "long", day: "numeric", month: "long" });
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const DEFAULT_ADMIN_HASH = "7d6da613d5f2832f7aab8a585983ecadfca5ee1f624d130b1b67097adf02800a";
async function sha256Hex(text) {
  const buf = await window.crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join("");
}
function validatePassword(pw) {
  if (!pw || pw.length < 8) return "رمز باید حداقل ۸ کاراکتر باشد.";
  if (!/[A-Za-z]/.test(pw)) return "رمز باید حداقل یک حرف داشته باشد.";
  if (!/[0-9]/.test(pw)) return "رمز باید حداقل یک عدد داشته باشد.";
  if (!/[^A-Za-z0-9]/.test(pw)) return "رمز باید حداقل یک نماد (مثل !@#$%) داشته باشد.";
  return "";
}

function compressImageFile(file, maxW = 860, quality = 0.82) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("خطا در خواندن فایل"));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("فایل تصویر معتبر نیست"));
      img.onload = () => {
        const scale = Math.min(1, maxW / img.width);
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function beep(ok = true) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = ok ? 880 : 420;
    g.gain.value = 0.05;
    o.start();
    setTimeout(() => { o.stop(); ctx.close(); }, 160);
  } catch (e) {}
}

function computeStreak(patient) {
  const days = new Set((patient.adherence || []).map((a) => a.date));
  let streak = 0;
  const d = new Date();
  if (!days.has(d.toISOString().slice(0, 10))) d.setDate(d.getDate() - 1);
  while (days.has(d.toISOString().slice(0, 10))) { streak++; d.setDate(d.getDate() - 1); }
  return streak;
}

function weekAdherence(patient) {
  const last7 = Array.from({ length: 7 }, (_, i) => { const d = new Date(); d.setDate(d.getDate() - i); return d.toISOString().slice(0, 10); });
  const doneDays = new Set((patient.adherence || []).filter((a) => last7.includes(a.date)).map((a) => a.date)).size;
  return Math.round((doneDays / 7) * 100);
}

function computeAssessment(p) {
  const hasFlag = (p.redFlags || []).length > 0;
  if (hasFlag) {
    return { phase: 1, reason: "به‌دلیل وجود علامت هشدار، پیش از پیشروی برنامه، ارزیابی بالینی تکمیلی لازم است.", flagged: true };
  }
  let phase;
  if (p.painNRS >= 7) phase = 1;
  else if (p.painNRS >= 4) phase = p.functionScore < 4 ? 1 : 2;
  else phase = p.functionScore >= 7 ? 3 : 2;
  if (p.timeSinceOnset === "acute" && phase > 1) phase = 1;
  if (p.timeSinceOnset === "chronic" && phase < 2) phase = 2;
  const reasons = {
    1: "درد بالا یا مرحلهٔ حاد — تمرکز بر دامنهٔ بدون درد و تمرینات ایزومتریک ملایم.",
    2: "کنترل نسبی درد — افزودن تقویت و تمرینات ثبات کنترل‌شده.",
    3: "درد کم و عملکرد مناسب — تمرکز بر بازگشت به عملکرد و تقویت پیشرفته.",
  };
  return { phase, reason: reasons[phase], flagged: false };
}

function buildProgram(patient, allExercises) {
  const { phase } = computeAssessment(patient);
  const list = allExercises || EXERCISES;
  const suggested = list.filter((e) => (patient.regions || []).includes(e.region) && e.startPhase <= phase).map((e) => e.id);
  const prevMap = new Map((patient.program || []).map((pi) => [pi.exerciseId, pi]));
  const ids = [...new Set([...suggested, ...((patient.program || []).map((p) => p.exerciseId))])];
  return ids.filter((id) => list.some((e) => e.id === id)).map((id) => prevMap.get(id) || { exerciseId: id, included: suggested.includes(id) });
}

function computeInsights(patient) {
  const hist = patient.history || [];
  const adh = patient.adherence || [];
  const insights = [];
  if (hist.length >= 4) {
    const recent = hist.slice(-3).reduce((s, h) => s + h.pain, 0) / 3;
    const older = hist.slice(0, Math.min(3, hist.length)).reduce((s, h) => s + h.pain, 0) / Math.min(3, hist.length);
    if (recent < older - 1) insights.push({ type: "good", text: "درد نسبت به ابتدای ثبت، روند کاهشی دارد." });
    if (recent > older + 1) insights.push({ type: "warn", text: "درد اخیراً افزایش یافته؛ شدت تمرین را بازبینی کنید." });
  }
  const streak = computeStreak(patient);
  if (streak >= 3) insights.push({ type: "good", text: `${toFa(streak)} روز پیاپی تمرین — عادت در حال شکل‌گیری است.` });
  const deltas = adh.slice(-12).map((a) => (a.painAfter ?? 0) - (a.painBefore ?? 0));
  if (deltas.length >= 3) {
    const avg = deltas.reduce((a, b) => a + b, 0) / deltas.length;
    if (avg > 1.5) insights.push({ type: "warn", text: "بعد از تمرین معمولاً درد بالا می‌رود. دامنه یا مقاومت را کم کنید." });
    if (avg < -0.8) insights.push({ type: "good", text: "تمرین‌ها معمولاً درد را کم می‌کنند — نشانهٔ خوبی است." });
  }
  if (weekAdherence(patient) < 30 && (patient.program || []).some((p) => p.included)) {
    insights.push({ type: "warn", text: "پایبندی ۷ روز اخیر پایین است. برنامه را ساده‌تر کنید یا هدف روزانه تعیین کنید." });
  }
  return insights;
}

function polarToCartesian(cx, cy, r, angleDeg) {
  const rad = (-angleDeg * Math.PI) / 180;
  return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
}
function describeArc(cx, cy, r, startAngle, endAngle) {
  const start = polarToCartesian(cx, cy, r, endAngle);
  const end = polarToCartesian(cx, cy, r, startAngle);
  const largeArcFlag = endAngle - startAngle <= 180 ? "0" : "1";
  return ["M", start.x, start.y, "A", r, r, 0, largeArcFlag, 0, end.x, end.y].join(" ");
}

function findEx(id, all) {
  return (all || EXERCISES).find((e) => e.id === id);
}

function Swing({ id, pivot, from = 0, to, mode = "rotate", duration = 2.2, delay = 0, loop = false, children }) {
  const name = `m-${id}`;
  let kf = "";
  if (mode === "rotate") kf = `@keyframes ${name}{0%{transform:rotate(${from}deg)}100%{transform:rotate(${to}deg)}}`;
  else if (mode === "translateY") kf = `@keyframes ${name}{0%{transform:translateY(0px)}100%{transform:translateY(${to}px)}}`;
  else if (mode === "translateX") kf = `@keyframes ${name}{0%{transform:translateX(0px)}100%{transform:translateX(${to}px)}}`;
  else if (mode === "scale") kf = `@keyframes ${name}{0%{transform:scale(1)}100%{transform:scale(${to})}}`;
  return (
    <>
      <style>{kf}</style>
      <g style={{
        transformOrigin: pivot ? `${pivot[0]}px ${pivot[1]}px` : "50px 50px",
        animation: `${name} ${duration}s ease-in-out ${delay}s infinite ${loop ? "normal" : "alternate"}`,
      }}>
        {children}
      </g>
    </>
  );
}
const Seg = (x1, y1, x2, y2, w = 6) => <line x1={x1} y1={y1} x2={x2} y2={y2} stroke="var(--teal)" strokeWidth={w} strokeLinecap="round" />;
const HeadC = (cx, cy, r = 7.5) => <circle cx={cx} cy={cy} r={r} fill="var(--teal)" />;
const FigureBase = ({ size, children }) => <svg viewBox="0 0 100 100" width={size} height={size}>{children}</svg>;

function StandingFigure({ id, motion, size }) {

  if (motion === "armRotateElbow") rightArm = <>{Seg(50, 24, 62, 36, 5.5)}<Swing id={id} pivot={[62, 36]} from={0} to={70}>{Seg(62, 36, 62, 50, 5)}</Swing></>;
  if (motion === "armSwing") {
    bodyGroup = <g style={{ transform: "rotate(18deg)", transformOrigin: "50px 55px" }}>{Seg(50, 21, 50, 55, 6)}{HeadC(50, 14)}</g>;
    leftArm = <Swing id={id} pivot={[50, 26]} from={-10} to={25} duration={1.8}>{Seg(50, 26, 40, 50, 5)}</Swing>;

  if (motion === "legAbduct") rightLeg = <Swing id={id} pivot={hip} from={0} to={28}>{Seg(50, 55, 58, 90, 6)}</Swing>;
  if (motion === "balance") rightLeg = <Swing id={id} pivot={hip} from={0} to={-14} duration={2.6}>{Seg(50, 55, 58, 88, 6)}</Swing>;
  if (motion === "squatBend") {
    return (
      <FigureBase size={size}>
        <Swing id={id} pivot={[50, 40]} mode="translateY" to={10} duration={1.6}>
          <>{Seg(50, 21, 50, 55, 6)}{HeadC(50, 14)}{leftArm}{rightArm}{Seg(50, 55, 42, 84, 6)}{Seg(50, 55, 58, 84, 6)}</>

    leftLeg = <Swing id={id + "l"} pivot={hip} from={18} to={-18} duration={1.1}>{Seg(50, 55, 42, 90, 6)}</Swing>;
    rightArm = <Swing id={id + "ra"} pivot={shoulder} from={15} to={-15} duration={1.1}>{Seg(50, 24, 64, 46, 5.5)}</Swing>;
    leftArm = <Swing id={id + "la"} pivot={shoulder} from={-15} to={15} duration={1.1}>{Seg(50, 24, 36, 46, 5.5)}</Swing>;

}
function BustFigure({ id, motion, size }) {
  const base = <>{Seg(50, 60, 50, 42, 7)}{HeadC(50, 34, 11)}</>;
  let head = base;
  if (motion === "rotate") head = <Swing id={id} pivot={[50, 60]} from={-18} to={18} duration={1.8}>{base}</Swing>;
  if (motion === "tilt") head = <Swing id={id} pivot={[50, 60]} from={-14} to={14} duration={2}>{base}</Swing>;
  if (motion === "tuck") head = <Swing id={id} pivot={[50, 60]} mode="translateY" to={-4} duration={1.6}>{base}</Swing>;
  if (motion === "pulse") head = <Swing id={id} pivot={[50, 60]} mode="scale" to={1.06} duration={1.4}>{base}</Swing>;

function SupineFigure({ id, motion, size, legMode = "bent" }) {
  const hip = [55, 50], knee = [68, 32], shoulder = [28, 50];
  let torso = Seg(25, 50, 55, 50, 6);
  const staticArm = Seg(28, 50, 25, 40, 5);
  let arm = staticArm;
  let legEl;
  if (legMode === "straight") {

    if (motion === "legRaiseStraight") legEl = <Swing id={id} pivot={hip} from={0} to={-40}>{Seg(55, 50, 85, 50, 6)}</Swing>;

    else if (motion === "footFlex") legEl = <>{legLine}<Swing id={id} pivot={[85, 50]} from={-18} to={18} duration={1.4}>{Seg(85, 50, 92, 44, 4)}</Swing></>;
    else if (motion === "footCircle") legEl = <>{legLine}<Swing id={id} pivot={[85, 50]} from={0} to={360} duration={2.4} loop>{Seg(85, 50, 92, 44, 4)}</Swing></>;
    else if (motion === "deadBug") {
      legEl = <Swing id={id} pivot={hip} from={-5} to={-40}>{legLine}</Swing>;

    else if (motion === "heelSlide") legEl = <>{Seg(55, 50, 68, 32, 6)}<Swing id={id} pivot={knee} from={0} to={45} duration={1.8}>{Seg(68, 32, 78, 50, 6)}</Swing></>;
    else if (motion === "bridgeLift") {

        </FigureBase>

    } else legEl = <>{Seg(55, 50, 68, 32, 6)}{Seg(68, 32, 78, 50, 6)}</>;
  }
  if (motion === "pelvicRock") torso = <Swing id={id} pivot={hip} from={-4} to={4} duration={2}>{Seg(25, 50, 55, 50, 6)}</Swing>;

function ProneFigure({ id, motion, size, kneeSupport = false }) {
  const hip = [55, 55];

function QuadrupedFigure({ id, motion, size }) {

function ExerciseFigure({ ex, size = 56 }) {
  if (!ex) return null;
  const props = { id: ex.id, motion: ex.motion, size };
  switch (ex.posture) {
    case "standing": return <StandingFigure {...props} />;
    case "bust": return <BustFigure {...props} />;
    case "supine": return <SupineFigure {...props} legMode={ex.legMode || "bent"} />;
    case "prone": return <ProneFigure {...props} kneeSupport={ex.kneeSupport} />;
    case "quadruped": return <QuadrupedFigure {...props} />;
    case "sidelying": return <SideLyingFigure {...props} />;
    case "kneeling": return <KneelingFigure {...props} />;
    default: return <StandingFigure {...props} />;
  }
}

function HoldTimer({ seconds, compact }) {
  const [left, setLeft] = useState(null);
  const [running, setRunning] = useState(false);
  useEffect(() => {
    if (!running || left === null) return;
    if (left <= 0) { setRunning(false); beep(true); return; }
    const t = setTimeout(() => setLeft((x) => x - 1), 1000);
    return () => clearTimeout(t);
  }, [running, left]);
  if (!seconds) return null;
  const start = () => { setLeft(seconds); setRunning(true); };
  const pct = left === null ? 0 : (seconds - left) / seconds;
  return (
    <div className="timer-box">
      <div className="row" style={{ justifyContent: "space-between" }}>
        <span className="muted" style={{ fontSize: 12 }}><Timer size={13} /> تایمر نگه‌داری</span>
        <span className="num" style={{ color: "var(--teal-deep)", fontWeight: 700 }}>{left === null ? toFa(seconds) + "ث" : toFa(left)}</span>
      </div>
      <div className="timer-track"><div className="timer-fill" style={{ width: `${pct * 100}%` }} /></div>
      <div className="row" style={{ gap: 8, marginTop: 8 }}>
        {!running && <button className="btn btn-primary btn-sm" onClick={start}><Play size={13} /> شروع</button>}
        {running && <button className="btn btn-ghost btn-sm" onClick={() => setRunning(false)}><Pause size={13} /> مکث</button>}
        <button className="btn btn-ghost btn-sm" onClick={() => { setRunning(false); setLeft(seconds); }}><RotateCcw size={13} /> از نو</button>
      </div>
    </div>
  );
}

}

  const fileRef = useRef(null);
  const region = REGIONS.find((r) => r.id === ex.region);
  const handleFile = async (file) => {
    if (!file) return;
    if (!file.type.startsWith("image/")) { setUploadErr("لطفاً یک فایل تصویری انتخاب کنید."); return; }
    setUploading(true); setUploadErr("");
    try {
      const dataUrl = await compressImageFile(file);
      await onImageChange(ex.id, dataUrl);
    } catch (e) { setUploadErr("آپلود تصویر ناموفق بود."); }
    setUploading(false);
  };
  return (
    <div className="card pad-sm">
      <button className="plain-btn row" style={{ width: "100%", gap: 12 }} onClick={() => setOpen((o) => !o)}>
        <div className="thumb">
          {ex.gif ? <img src={ex.gif} alt={ex.name} /> : image ? <img src={image} alt={ex.name} /> : <ExerciseFigure ex={ex} size={52} />}

          <div className="row wrap" style={{ gap: 8, marginTop: 3 }}>
            <span className="tag-teal">{region?.label}</span>
            <CategoryTag category={ex.category} />

            {ex.gif && <span className="gif-badge"><Play size={10} /> نمایش متحرک</span>}{image && <span className="ok-mini"><Check size={11} /> دارای عکس</span>}
          </div>
        </div>
        {open ? <ChevronDown size={18} color="var(--muted)" /> : <ChevronRight size={18} color="var(--muted)" />}
      </button>
      {open && (
        <div className="ex-details">
          <div>{ex.cues}</div>
          {ex.caution && <div className="caution"><AlertTriangle size={14} /> {ex.caution}</div>}
          <div className="dose-grid">
            {[1, 2, 3].map((ph) => (
              <div key={ph} className="dose-cell">
                <div style={{ fontSize: 10.5, color: PHASE_META[ph].color, fontWeight: 700, marginBottom: 2 }}>{PHASE_META[ph].short}</div>
                <div className="muted" style={{ fontSize: 11.5 }}>{ex.startPhase <= ph ? DOSAGE[ex.category][ph] : "هنوز مناسب نیست"}</div>
              </div>
            ))}
          </div>
          {ex.ref && <div className="muted" style={{ fontSize: 11.5, fontStyle: "italic" }}>منبع: {ex.ref}</div>}
          <div style={{ marginTop: 4, paddingTop: 8, borderTop: "1px dashed var(--line)" }}>
            <div className="muted" style={{ fontSize: 12, marginBottom: 6, fontWeight: 600 }}>عکس آموزشی حرکت</div>
            {image && (
              <div className="row" style={{ gap: 10, marginBottom: 8 }}>
                <img src={image} alt={ex.name} className="thumb-img" />
                <button className="plain-btn danger-text row" style={{ gap: 4, fontSize: 12 }} onClick={() => onImageChange(ex.id, null)}>

            )}
            <input ref={fileRef} type="file" accept="image/*" style={{ display: "none" }} onChange={(e) => handleFile(e.target.files && e.target.files[0])} />
            <div className="row wrap" style={{ gap: 8 }}>
              <button className="btn btn-ghost btn-sm" onClick={() => fileRef.current && fileRef.current.click()} disabled={uploading}>

function DoctorConsole({ patients, setPatients, exerciseImages, onImageChange, regionAdvice, onAdviceChange, allExercises, customExercises, setCustomExercises, notify }) {
  const isMobile = useIsMobile();
  const [selectedId, setSelectedId] = useState(patients[0]?.id || null);
  const [tab, setTab] = useState("home");
  const [showForm, setShowForm] = useState(false);
  const [editing, setEditing] = useState(null);
  const [search, setSearch] = useState("");
  const [libRegion, setLibRegion] = useState("all");
  const [listFilter, setListFilter] = useState("all");
  const [showCustom, setShowCustom] = useState(false);

  useEffect(() => { if (!selectedId && patients[0]) setSelectedId(patients[0].id); }, [patients]);
  const patient = patients.find((p) => p.id === selectedId);

  const updatePatient = (id, updater) => {
    setPatients((prev) => prev.map((p) => (p.id === id ? { ...updater(p), updatedAt: Date.now() } : p)));
  };
  const savePatient = (form) => {
    if (editing) {
      updatePatient(editing.id, (p) => ({ ...p, ...form }));
      notify("تغییرات بیمار ذخیره شد", "ok");
    } else {
      const np = {
        id: uid(), accessCode: genAccessCode(patients), ...form,
        createdAt: Date.now(), history: [{ date: todayStr(), pain: form.painNRS, func: form.functionScore }],
        program: [], adherence: [], coachNote: "", patientNote: "", messages: [],
      };
      setPatients((prev) => [...prev, np]);
      setSelectedId(np.id);
      notify("بیمار افزوده شد", "ok");
    }
    setShowForm(false); setEditing(null);
  };
  const removePatient = (id) => {
    setPatients((prev) => prev.filter((p) => p.id !== id));
    if (selectedId === id) setSelectedId(null);
    notify("بیمار حذف شد");
  };

  const filteredPatients = patients.filter((p) => {
    if (search && !p.name.includes(search)) return false;
    const a = computeAssessment(p);
    if (listFilter === "flag" && !a.flagged) return false;
    if (listFilter === "p1" && a.phase !== 1) return false;
    if (listFilter === "low" && weekAdherence(p) >= 40) return false;
    return true;
  });

  const addDemo = () => {
    const demo = {
      id: uid(), accessCode: genAccessCode(patients), name: "بیمار نمونه", age: "42",
      regions: ["lumbar", "core"], timeSinceOnset: "subacute", painNRS: 5, functionScore: 6,
      redFlags: [], notes: "کمردرد مکانیکال بدون ردفلگ", goal: "نشستن ۴۵ دقیقه در محل کار بدون درد تیز",
      createdAt: Date.now(),
      history: [
        { date: isoAgo(10), pain: 7, func: 4 },
        { date: isoAgo(7), pain: 6, func: 5 },
        { date: isoAgo(3), pain: 5, func: 6 },
        { date: todayStr(), pain: 5, func: 6 },
      ],
      program: [], adherence: [
        { date: isoAgo(3), exerciseId: "lb1", painBefore: 5, painAfter: 4 },
        { date: isoAgo(2), exerciseId: "lb3", painBefore: 5, painAfter: 4 },
        { date: isoAgo(1), exerciseId: "lb5", painBefore: 5, painAfter: 3 },
      ],
      coachNote: "حرکات را آرام و بدون حبس نفس انجام دهید.",
      patientNote: "",
    };
    demo.program = buildProgram(demo, allExercises);
    setPatients((prev) => [...prev, demo]);
    setSelectedId(demo.id);
    notify("بیمار نمونه افزوده شد", "ok");
  };

  return (
    <div className={`doc-layout ${isMobile ? "col" : ""}`}>
      <aside className="card pad-sm sidebar">
        <div className="row" style={{ gap: 8, marginBottom: 10 }}>
          <div className="search-box" style={{ flex: 1 }}>
            <Search size={14} color="var(--muted)" />

          </div>
          <button className="icon-btn solid" title="بیمار جدید" onClick={() => { setEditing(null); setShowForm(true); }}>
            <Plus size={18} color="#fff" />
          </button>
        </div>
        <div className="row wrap" style={{ gap: 4, marginBottom: 8 }}>
          {[{ id: "all", l: "همه" }, { id: "flag", l: "هشدار" }, { id: "p1", l: "فاز ۱" }, { id: "low", l: "پایبندی کم" }].map((f) => (
            <button key={f.id} className={`chip xs ${listFilter === f.id ? "on" : ""}`} onClick={() => setListFilter(f.id)}>{f.l}</button>
          ))}

}

function isoAgo(n) {
  const d = new Date(); d.setDate(d.getDate() - n); return d.toISOString().slice(0, 10);
}

/* ===================== پیام دوطرفه (Thread) ===================== */
// تابع مهاجرت: یادداشت‌های قدیمی coachNote/patientNote را به آرایهٔ messages تبدیل می‌کند.
function getMessages(patient) {
  if (Array.isArray(patient.messages)) return patient.messages;
  const arr = [];
  if (patient.coachNote && patient.coachNote.trim()) {
    arr.push({ id: uid(), role: "coach", text: patient.coachNote, ts: patient.updatedAt || Date.now(), read: true, migrated: true });
  }
  if (patient.patientNote && patient.patientNote.trim()) {
    arr.push({ id: uid(), role: "patient", text: patient.patientNote, ts: patient.updatedAt || Date.now(), read: false, migrated: true });
  }
  return arr;
}

function MessageThread({ messages, role, draft, onDraftChange, onSend, onMarkAllRead, onClear }) {
  const [expanded, setExpanded] = useState(false);
  const scrollRef = useRef(null);
  const isCoach = role === "coach";
  useEffect(() => {
    if (expanded && scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [expanded, messages.length]);
  useEffect(() => {
    if (isCoach && messages.some((m) => m.role === "patient" && !m.read)) onMarkAllRead && onMarkAllRead();
    // علامت‌گذاری پیام‌های بیمار به‌عنوان خوانده‌شده هنگامی که پزشک thread را باز می‌کند
    // (فقط در همان لحظهٔ mount، پس از آن پیام‌های جدید بیمار خوانده‌نشده می‌مانند تا بعداً در داشبورد دیده شوند)
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [expanded]);
  if (messages.length === 0 && !draft) {
    return (
      <div className="muted" style={{ fontSize: 12.5, lineHeight: 1.8 }}>
        هنوز گفت‌وگویی با بیمار شروع نشده است. پیام خود را بنویسید و ارسال کنید.
      </div>
    );
  }
  const send = () => {
    const t = (draft || "").trim();
    if (!t) return;
    onSend(t);
    onDraftChange("");
  };
  return (
    <div>
      {messages.length > 0 && (
        <button className="linkish" style={{ marginBottom: 8 }} onClick={() => setExpanded((x) => !x)}>
          {expanded ? "بستن گفت‌وگو" : `نمایش گفت‌وگو (${toFa(messages.length)} پیام)`}
        </button>
      )}
      {expanded && (
        <div ref={scrollRef} className="msg-thread" style={{ maxHeight: 260, overflowY: "auto", marginBottom: 10, padding: 8, background: "var(--paper-2)", borderRadius: 10 }}>
          {messages.map((m) => {
            const mine = m.role === role;
            const other = m.role === (isCoach ? "patient" : "coach");
            return (
              <div key={m.id} style={{ display: "flex", justifyContent: mine ? "flex-start" : "flex-end", marginBottom: 8 }}>
                <div className={`msg-bubble ${mine ? "mine" : "theirs"}`}>
                  <div className="msg-meta">
                    {m.role === "coach" ? "پزشک/درمانگر" : "بیمار"} · {new Date(m.ts).toLocaleString("fa-IR", { hour: "2-digit", minute: "2-digit", month: "short", day: "numeric" })}
                  </div>
                  <div style={{ whiteSpace: "pre-wrap", lineHeight: 1.8 }}>{m.text}</div>
                </div>
              </div>
            );
          })}
        </div>
      )}
      <textarea
        className="input"
        rows={2}
        value={draft}
        onChange={(e) => onDraftChange(e.target.value)}
        placeholder={isCoach ? "پیام شما برای بیمار…" : "پیام شما برای پزشک…"}
        onKeyDown={(e) => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) send(); }}
      />
      <div className="row" style={{ gap: 8, marginTop: 8 }}>
        <button className="btn btn-plum btn-sm" onClick={send}>ارسال پیام</button>
        {onClear && messages.length > 0 && (
          <button className="plain-btn muted" style={{ fontSize: 11.5 }} onClick={onClear}>پاک کردن گفت‌وگو</button>
        )}
        <span className="muted" style={{ fontSize: 10.5, marginInlineStart: "auto" }}>ارسال: Ctrl/⌘ + Enter</span>
      </div>
    </div>
  );
}

function DashboardTab({ patients, allExercises, onSelect, onAdd }) {
  const stats = useMemo(() => {
    const n = patients.length;
    const flagged = patients.filter((p) => computeAssessment(p).flagged).length;
    const phases = { 1: 0, 2: 0, 3: 0 };
    let adh = 0;
    const attention = [];
    let reflexCount = 0;
    let bindingCount = 0;
    let highAdhCount = 0;
    patients.forEach((p) => {
      const a = computeAssessment(p);
      phases[a.phase]++;
      adh += weekAdherence(p);
      // رفلک: بیمارانی که نشانه‌های رفلکسی / علائم عصبی در پرونده دارند (ردفلگ یا درد بالا)
      const hasReflex = (p.redFlags && p.redFlags.length > 0) || p.painNRS >= 7;
      if (hasReflex) reflexCount++;
      // بایندی: بیمارانی که عملکرد پایین یا محدودیت بالینی دارند (نیاز به بایندینگ تمرین)
      if (p.functionScore !== undefined && p.functionScore <= 4) bindingCount++;
      // پایبندی بالا: بیمارانی که در ۷ روز اخیر >= ۶۰٪ پایبندی دارند
      if (weekAdherence(p) >= 60) highAdhCount++;
      if (a.flagged) attention.push({ p, why: "علامت هشدار" });
      else if (p.painNRS >= 7) attention.push({ p, why: "درد بالا" });
      else if (weekAdherence(p) < 20 && (p.program || []).some((x) => x.included)) attention.push({ p, why: "پایبندی بسیار کم" });
      const unreadFromPatient = (p.messages || []).some((m) => m.role === "patient" && !m.read);
      if (unreadFromPatient) attention.push({ p, why: "پیام خوانده‌نشده از بیمار" });
    });
    return { n, flagged, phases, adh: n ? Math.round(adh / n) : 0, attention, reflexCount, bindingCount, highAdhCount };
  }, [patients]);

  return (
    <div className="stack" style={{ gap: 16 }}>
      <div className="kpi-grid">
        <div className="card pad kpi">
          <div className="muted" style={{ fontSize: 12 }}>بیماران فعال</div>
          <div className="serif kpi-n">{toFa(stats.n)}</div>
        </div>
        <div className="card pad kpi">
          <div className="muted" style={{ fontSize: 12 }}>میانگین پایبندی ۷روز</div>
          <div className="serif kpi-n" style={{ color: "var(--teal-deep)" }}>{toFa(stats.adh)}٪</div>
        </div>
        <div className="card pad kpi">
          <div className="muted" style={{ fontSize: 12 }}>دارای رفلک</div>
          <div className="serif kpi-n" style={{ color: "var(--coral)" }}>{toFa(stats.reflexCount)}</div>
          <div className="muted" style={{ fontSize: 10.5, marginTop: 4 }}>علائم عصبی/ردفلگ/درد ≥ ۷</div>
        </div>
        <div className="card pad kpi">
          <div className="muted" style={{ fontSize: 12 }}>نیاز به بایندی</div>
          <div className="serif kpi-n" style={{ color: "var(--amber)" }}>{toFa(stats.bindingCount)}</div>
          <div className="muted" style={{ fontSize: 10.5, marginTop: 4 }}>عملکرد ≤ ۴ (نیاز به محدودسازی)</div>
        </div>
        <div className="card pad kpi">
          <div className="muted" style={{ fontSize: 12 }}>پایبندی بالا (≥۶۰٪)</div>
          <div className="serif kpi-n" style={{ color: "var(--sage)" }}>{toFa(stats.highAdhCount)}</div>
        </div>
        <div className="card pad kpi">
          <div className="muted" style={{ fontSize: 12 }}>دارای ردفلگ</div>
          <div className="serif kpi-n" style={{ color: "var(--coral)" }}>{toFa(stats.flagged)}</div>
        </div>
        <div className="card pad kpi">
          <div className="muted" style={{ fontSize: 12 }}>توزیع فاز</div>
          <div className="row" style={{ gap: 8, marginTop: 8 }}>
            {[1, 2, 3].map((ph) => (
              <div key={ph} style={{ flex: 1 }}>
                <div style={{ height: 8, borderRadius: 99, background: "var(--paper-2)", overflow: "hidden" }}>
                  <div style={{ height: "100%", width: `${stats.n ? (stats.phases[ph] / stats.n) * 100 : 0}%`, background: PHASE_META[ph].color }} />
                </div>
                <div className="muted" style={{ fontSize: 10.5, marginTop: 4 }}>{PHASE_META[ph].short} {toFa(stats.phases[ph])}</div>
              </div>
            ))}
          </div>
        </div>
      </div>

      <div className="card pad">
        <div className="row" style={{ justifyContent: "space-between", marginBottom: 10 }}>
          <div className="title-md"><Flag size={15} /> نیازمند توجه</div>
          <button className="btn btn-primary btn-sm" onClick={onAdd}><Plus size={13} /> بیمار جدید</button>
        </div>
        {stats.attention.length === 0 && <div className="muted" style={{ fontSize: 13 }}>مورد فوری نیست. عالی.</div>}
        <div className="stack" style={{ gap: 8 }}>
          {stats.attention.slice(0, 8).map((a, i) => (
            <button key={i} className="plain-btn row card pad-sm" style={{ gap: 10, width: "100%" }} onClick={() => onSelect(a.p.id)}>
              <User size={16} color="var(--teal)" />
              <div style={{ flex: 1, textAlign: "right" }}>
                <div className="title-sm">{a.p.name}</div>
                <div className="muted" style={{ fontSize: 12 }}>{a.why}</div>
              </div>
              <ChevronLeftish />
            </button>
          ))}
        </div>
      </div>

      {patients.length > 0 && (
        <div className="card pad">
          <div className="title-md" style={{ marginBottom: 10 }}>بیماران</div>
          <div className="stack" style={{ gap: 8 }}>
            {patients.slice(0, 12).map((p) => {
              const a = computeAssessment(p);
              return (
                <button key={p.id} className="plain-btn row" style={{ gap: 10, width: "100%" }} onClick={() => onSelect(p.id)}>
                  <PhaseBadge phase={a.phase} size="sm" />
                  <div style={{ flex: 1, textAlign: "right" }} className="title-sm">{p.name}</div>
                  <span className="muted" style={{ fontSize: 12 }}>{toFa(weekAdherence(p))}٪</span>
                </button>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}
const ChevronLeftish = () => <ChevronRight size={16} color="var(--muted)" />;

function EmptyState({ icon: Icon, title, desc, action }) {

    <div className="card empty">
      <Icon size={30} color="var(--muted)" style={{ marginBottom: 10 }} />
      <div className="serif" style={{ fontSize: 18 }}>{title}</div>
      <div className="muted" style={{ fontSize: 13.5, marginTop: 6, maxWidth: 340, marginInline: "auto" }}>{desc}</div>
      {action && <button className="btn btn-primary" style={{ marginTop: 16 }} onClick={action.onClick}>{action.label}</button>}
    </div>
  );
}

    onUpdate((p) => ({ ...p, accessCode: genAccessCode([p]) }));

  return (
    <div className="stack" style={{ gap: 16 }}>
      <div className="card pad">
        <div className="row" style={{ justifyContent: "space-between", alignItems: "flex-start" }}>
          <div>
            <div className="serif" style={{ fontSize: 22 }}>{patient.name}</div>
            <div className="muted" style={{ fontSize: 12.5, marginTop: 2 }}>
              {patient.age ? `${toFa(patient.age)} سال · ` : ""}{(patient.regions || []).map((r) => REGIONS.find((x) => x.id === r)?.label).join("، ")}

            <div className="row wrap" style={{ gap: 6, marginTop: 8 }}>

              <span className="muted" style={{ fontSize: 11.5 }}>کد دسترسی:</span>

              <button className="linkish" onClick={regenCode}>تولید کد جدید</button>
            </div>
            {patient.goal && <div className="muted" style={{ fontSize: 12.5, marginTop: 8 }}><Target size={12} /> هدف: {patient.goal}</div>}
          </div>
          <div className="row" style={{ gap: 6 }}>
            <button className="icon-btn" onClick={onEdit}><Edit3 size={15} /></button>
            <button className="icon-btn" style={{ color: confirmDel ? "#fff" : "var(--coral)", background: confirmDel ? "var(--coral)" : "transparent" }}

          <div style={{ flex: 1, minWidth: 180 }}>

              {unreadFromPatient > 0 && <span className="tag-teal" style={{ background: "color-mix(in srgb, var(--coral) 18%, transparent)", color: "var(--coral)" }}>{toFa(unreadFromPatient)} پیام خوانده‌نشده</span>}

            <div className="msg-thread" style={{ maxHeight: 260, overflowY: "auto", padding: 8, background: "var(--paper-2)", borderRadius: 10 }}>
              {msgs.map((m) => {

            const idx = hist.findIndex((h) => h.date === todayStr());
            const entry = { date: todayStr(), pain: p.painNRS, func: p.functionScore };
            if (idx >= 0) hist[idx] = entry; else hist.push(entry);
            return { ...p, history: hist, program: buildProgram(p, allExercises) };
          })}
        >
          <Sparkles size={15} /> ثبت وضعیت امروز و به‌روزرسانی برنامه
        </button>
      </div>

      <div className="card pad">
        <div className="row" style={{ justifyContent: "space-between", marginBottom: 8 }}>
          <div className="title-sm row" style={{ gap: 6 }}><Message size={14} /> گفت‌وگوی دوطرفه با بیمار</div>
          {(() => {
            const msgs = getMessages(patient);
            const unreadFromPatient = msgs.filter((m) => m.role === "patient" && !m.read).length;
            return unreadFromPatient > 0 ? (
              <span className="tag-teal" style={{ background: "color-mix(in srgb, var(--coral) 18%, transparent)", color: "var(--coral)" }}>{toFa(unreadFromPatient)} پیام خوانده‌نشده</span>
            ) : null;
          })()}
        </div>
        <MessageThread
          messages={getMessages(patient)}
          role="coach"
          draft={coach}
          onDraftChange={setCoach}
          onSend={(text) => {
            onUpdate((p) => {
              const msgs = getMessages(p);
              return { ...p, messages: [...msgs, { id: uid(), role: "coach", text, ts: Date.now(), read: true }] };
            });
            notify("پیام ارسال شد", "ok");
          }}
          onMarkAllRead={() => {
            onUpdate((p) => ({ ...p, messages: (p.messages || []).map((m) => ({ ...m, read: true })) }));
          }}
          onClear={() => {
            onUpdate((p) => ({ ...p, messages: [] }));
            setCoach("");
            notify("گفت‌وگو پاک شد");
          }}
        />
      </div>

      <div className="card pad">
        <div className="title-sm" style={{ marginBottom: 8 }}>تقویم پایبندی</div>
        <Heatmap adherence={patient.adherence} />
      </div>
    </div>
  );
}

    <style>body{font-family:Tahoma,sans-serif;padding:24px;color:#16232E} h1{font-size:20px} .ex{border:1px solid #ddd;border-radius:10px;padding:12px;margin:10px 0} .muted{color:#667} .dose{background:#f4f7f5;padding:4px 8px;border-radius:6px;display:inline-block}</style></head><body>

function ProgramTab({ patient, onUpdate, allExercises, exerciseImages, notify }) {
  const [showAdd, setShowAdd] = useState(false);
  const assessment = computeAssessment(patient);
  const program = patient.program && patient.program.length ? patient.program : [];
  const regenerate = () => { onUpdate((p) => ({ ...p, program: buildProgram(p, allExercises) })); notify("برنامه بازسازی شد", "ok"); };
  const toggle = (exId) => onUpdate((p) => ({ ...p, program: p.program.map((pi) => (pi.exerciseId === exId ? { ...pi, included: !pi.included } : pi)) }));
  const addEx = (id) => onUpdate((p) => {
    const prog = [...(p.program || [])];
    if (prog.some((x) => x.exerciseId === id)) return p;
    return { ...p, program: [...prog, { exerciseId: id, included: true }] };
  });
  const grouped = REGIONS.map((r) => ({
    region: r,
    items: program.filter((pi) => findEx(pi.exerciseId, allExercises)?.region === r.id),
  })).filter((g) => g.items.length);

  return (
    <div className="stack" style={{ gap: 16 }}>
      <div className="row wrap" style={{ justifyContent: "space-between", gap: 10 }}>
        <div className="row wrap" style={{ gap: 10 }}>
          <PhaseBadge phase={assessment.phase} />
          <span className="muted" style={{ fontSize: 12.5 }}>{toFa(program.filter((p) => p.included).length)} ورزش فعال از {toFa(program.length)}</span>
        </div>
        <div className="row wrap" style={{ gap: 6 }}>
          <button className="btn btn-ghost btn-sm" onClick={() => setShowAdd(true)}><Plus size={13} /> افزودن ورزش</button>
          <button className="btn btn-ghost btn-sm" onClick={() => printProgram(patient, allExercises, exerciseImages)}><Printer size={13} /> چاپ</button>
          <button className="btn btn-ghost btn-sm" onClick={regenerate}><Sparkles size={13} /> ساخت بر اساس ارزیابی</button>
        </div>
      </div>
      {program.length === 0 && (
        <EmptyState icon={ClipboardList} title="هنوز برنامه‌ای ساخته نشده" desc="الگوریتم با توجه به درد، عملکرد و ناحیه، ورزش‌ها را پیشنهاد می‌دهد." action={{ label: "ساخت برنامه", onClick: regenerate }} />
      )}
      {grouped.map((g) => (
        <div key={g.region.id}>
          <div className="muted" style={{ fontSize: 12.5, fontWeight: 700, marginBottom: 8 }}>{g.region.label}</div>
          <div className="stack" style={{ gap: 8 }}>
            {g.items.map((pi) => {
              const ex = findEx(pi.exerciseId, allExercises);
              return <ProgramRow key={pi.exerciseId} ex={ex} phase={assessment.phase} included={pi.included} onToggle={() => toggle(pi.exerciseId)} image={exerciseImages[pi.exerciseId]} />;
            })}
          </div>
        </div>
      ))}
      {showAdd && (
        <AddFromLibraryModal
          allExercises={allExercises}
          existingIds={program.map((p) => p.exerciseId)}
          onAdd={addEx}
          onClose={() => setShowAdd(false)}
        />
      )}
    </div>
  );
}

function PatientLockScreen({ patients, onUnlock }) {
  const [code, setCode] = useState("");
  const [error, setError] = useState("");
  const submit = (c) => {
    const v = (c ?? code).trim();
    const found = patients.find((p) => p.accessCode === v);
    if (found) { onUnlock(found.id); setError(""); }
    else setError("کد نامعتبر است. کد ۴ رقمی را از پزشک خود بگیرید.");
  };
  const push = (d) => {
    const next = (code + d).slice(0, 4);
    setCode(next);
    if (next.length === 4) setTimeout(() => submit(next), 80);
  };
  const keys = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "←", "0", "ورود"];
  return (
    <div className="lock-card fade-in">
      <div className="lock-icon"><Lock size={22} color="var(--teal)" /></div>
      <div className="serif" style={{ fontSize: 22 }}>ورود بیمار</div>
      <div className="muted" style={{ fontSize: 12.5, marginTop: 6 }}>کد دسترسی ۴ رقمی پزشک را وارد کنید</div>
      <div className="pin-dots">
        {[0, 1, 2, 3].map((i) => <i key={i} className={code.length > i ? "on" : ""} />)}
      </div>
      {error && <div className="danger-text" style={{ fontSize: 12, marginTop: 8 }}>{error}</div>}
      <div className="pin-pad">
        {keys.map((k) => (
          <button key={k} className={`pin-key ${k === "ورود" ? "go" : ""}`}
            onClick={() => {
              if (k === "←") setCode((c) => c.slice(0, -1));
              else if (k === "ورود") submit();
              else push(k);
            }}>{k === "ورود" ? "OK" : k}</button>
        ))}
      </div>
      <div className="muted" style={{ marginTop: 14, fontSize: 10.5, lineHeight: 1.7 }}>
        این کد یک قفل سادهٔ نمایشی است، نه احراز هویت بیمارستانی.
      </div>
    </div>
  );
}

function SessionOverlay({ items, phase, images, onLog, onClose }) {
  const [idx, setIdx] = useState(0);
  const [before, setBefore] = useState(4);
  const [after, setAfter] = useState(3);
  const [stage, setStage] = useState("do");
  const ex = items[idx];
  if (!ex) return null;
  const image = images[ex.id];
  const next = () => {
    onLog(ex.id, before, after);
    if (idx + 1 >= items.length) onClose(true);
    else { setIdx(idx + 1); setStage("do"); setBefore(after); setAfter(Math.max(0, after - 1)); }
  };
  return (
    <div className="session-back">
      <div className="session-bar">
        <div className="muted" style={{ color: "#fff", fontSize: 12 }}>{toFa(idx + 1)} از {toFa(items.length)}</div>
        <button className="plain-btn" style={{ color: "#fff" }} onClick={() => onClose(false)}><X size={18} /></button>
      </div>
      <div className="session-track"><div style={{ width: `${((idx + (stage === "log" ? 0.5 : 0)) / items.length) * 100}%` }} /></div>
      <div className="session-body fade-in">
        <div className="session-fig">
          {ex.gif ? <img src={ex.gif} alt={ex.name} /> : image ? <img src={image} alt={ex.name} /> : <ExerciseFigure ex={ex} size={160} />}
        </div>
        <div className="serif" style={{ fontSize: 22, color: "#fff", marginTop: 8 }}>{ex.name}</div>
        <div style={{ color: "#ffffffcc", lineHeight: 1.9, marginTop: 8, fontSize: 14.5 }}>{ex.cues}</div>
        <div className="dose" style={{ marginTop: 12, background: "#ffffff22", color: "#fff" }}>{DOSAGE[ex.category]?.[phase]}</div>
        {ex.caution && <div style={{ color: "#ffd0cb", marginTop: 8, fontSize: 13 }}>⚠ {ex.caution}</div>}
        <HoldTimer seconds={HOLD_SEC[ex.category]?.[phase] || 0} />
        {stage === "do" && (
          <button className="btn btn-primary" style={{ width: "100%", marginTop: 18, background: "#fff", color: "var(--teal-deep)" }} onClick={() => setStage("log")}>
            انجام شد — ثبت درد
          </button>
        )}
        {stage === "log" && (
          <div className="card pad" style={{ marginTop: 14 }}>
            <div className="lbl">درد قبل: {toFa(before)}</div>
            <input type="range" min="0" max="10" value={before} onChange={(e) => setBefore(+e.target.value)} style={{ width: "100%", accentColor: "var(--coral)" }} />
            <div className="lbl">درد بعد: {toFa(after)}</div>
            <input type="range" min="0" max="10" value={after} onChange={(e) => setAfter(+e.target.value)} style={{ width: "100%", accentColor: "var(--sage)" }} />
            <button className="btn btn-primary" style={{ width: "100%", marginTop: 10 }} onClick={next}>
              {idx + 1 >= items.length ? "پایان جلسه" : "حرکت بعدی"}
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

function PatientPortal({ patient, setPatients, onLock, exerciseImages, regionAdvice, allExercises }) {
  const assessment = computeAssessment(patient);
  const included = (patient.program || []).filter((pi) => pi.included).map((pi) => findEx(pi.exerciseId, allExercises)).filter(Boolean);
  const [session, setSession] = useState(false);
  const [note, setNote] = useState(patient.patientNote || "");
  const [celebrate, setCelebrate] = useState(false);

  const logExercise = (exId, before, after) => {
    setPatients((prev) => prev.map((p) => {
      if (p.id !== patient.id) return p;
      const adherence = [...(p.adherence || []).filter((a) => !(a.date === todayStr() && a.exerciseId === exId)), { date: todayStr(), exerciseId: exId, painBefore: before, painAfter: after }];
      const hist = [...(p.history || [])];
      const idx = hist.findIndex((h) => h.date === todayStr());
      const entry = { date: todayStr(), pain: after, func: p.functionScore };
      if (idx >= 0) hist[idx] = entry; else hist.push(entry);
      return { ...p, adherence, history: hist };
    }));
  };

  const streak = computeStreak(patient);
  const doneToday = new Set((patient.adherence || []).filter((a) => a.date === todayStr()).map((a) => a.exerciseId));
  const doneTodayCount = included.filter((ex) => doneToday.has(ex.id)).length;
  const allDone = included.length > 0 && doneTodayCount === included.length;
  const advices = (patient.regions || []).map((r) => ({ region: REGIONS.find((x) => x.id === r), text: regionAdvice[r] })).filter((a) => a.region && a.text);
  const insights = computeInsights(patient);
  const quote = MOTIVATION[new Date().getDate() % MOTIVATION.length];

  useEffect(() => {
    if (allDone) setCelebrate(true);
  }, [allDone]);

  return (
    <div className="portal fade-in">
      {celebrate && allDone && (
        <div className="confetti" aria-hidden="true">
          {Array.from({ length: 18 }).map((_, i) => <i key={i} style={{ left: `${(i * 53) % 100}%`, animationDelay: `${i * 0.08}s`, background: i % 3 === 0 ? "var(--gold)" : i % 3 === 1 ? "var(--teal)" : "var(--coral)" }} />)}
        </div>
      )}
      <div className="row" style={{ justifyContent: "flex-end", marginBottom: 8 }}>
        <button className="plain-btn row muted" style={{ gap: 5, fontSize: 12 }} onClick={onLock}><LogOut size={13} /> خروج</button>
      </div>

      <div className="hero">
        <div className="hero-glow" />
        <div className="row wrap" style={{ position: "relative", justifyContent: "space-between", gap: 14 }}>
          <div style={{ flex: 1, minWidth: 180 }}>
            <div style={{ fontSize: 13, opacity: 0.85 }}>{faDate()}</div>
            <div className="serif" style={{ fontSize: 25, fontWeight: 700, marginTop: 4 }}>سلام {patient.name} 👋</div>
            <div style={{ fontSize: 13, opacity: 0.92, marginTop: 6 }}>امروز {toFa(doneTodayCount)} از {toFa(included.length)} حرکت را انجام داده‌اید</div>
            <div className="row wrap" style={{ gap: 8, marginTop: 12 }}>
              <StreakBadge streak={streak} />
              <span className="pill-light">{toFa(weekAdherence(patient))}٪ پایبندی ۷ روز</span>
            </div>
            {patient.goal && <div style={{ marginTop: 10, fontSize: 12.5, opacity: 0.9 }}>🎯 {patient.goal}</div>}
          </div>
          {included.length > 0 && <ProgressRing value={doneTodayCount} total={included.length} />}
        </div>
      </div>

      <div className="quote">{quote}</div>

      {(() => {
        const msgs = getMessages(patient);
        const lastCoachMsg = [...msgs].reverse().find((m) => m.role === "coach");
        return lastCoachMsg ? (
          <div className="coach-note">
            <div className="title-sm" style={{ color: "var(--teal-deep)", marginBottom: 4 }}><Stethoscope size={14} /> آخرین پیام پزشک</div>
            <div style={{ lineHeight: 1.9 }}>{lastCoachMsg.text}</div>
            <div className="muted" style={{ fontSize: 10.5, marginTop: 6 }}>{new Date(lastCoachMsg.ts).toLocaleString("fa-IR", { hour: "2-digit", minute: "2-digit", month: "short", day: "numeric" })}</div>
          </div>
        ) : null;
      })()}

      {allDone && (
        <div className="insight good">آفرین — برنامهٔ امروز کامل شد. فردا همین ساعت برگردید.</div>
      )}

      {included.length === 0 && <EmptyState icon={ClipboardList} title="برنامه‌ای تنظیم نشده" desc="از پزشک خود بخواهید برنامهٔ ورزشی شما را تنظیم کند." />}

      {included.length > 0 && !allDone && (
        <button className="btn btn-primary" style={{ width: "100%", marginBottom: 12 }} onClick={() => setSession(true)}>
          <Play size={15} /> شروع جلسهٔ امروز
        </button>
      )}

      <div className="stack" style={{ gap: 12 }}>
        {included.map((ex) => (
          <PortalCard key={ex.id} ex={ex} phase={assessment.phase} done={doneToday.has(ex.id)}
            onLog={(b, a) => logExercise(ex.id, b, a)} image={exerciseImages[ex.id]} />
        ))}
      </div>

      {(patient.history || []).length > 1 && (
        <div className="card pad" style={{ marginTop: 16 }}>
          <div className="title-sm" style={{ marginBottom: 10 }}>روند درد شما</div>
          <MiniLineChart
            data={patient.history.map((h) => ({ date: new Date(h.date).toLocaleDateString("fa-IR", { day: "numeric", month: "short" }), pain: h.pain }))}
            height={140}
            series={[{ key: "pain", color: "var(--coral)", label: "درد" }]}
          />
        </div>
      )}

      <div className="card pad" style={{ marginTop: 16 }}>
        <div className="title-sm" style={{ marginBottom: 8 }}><Calendar size={14} /> پایبندی شما</div>
        <Heatmap adherence={patient.adherence} />
      </div>

      {insights.length > 0 && (
        <div className="stack" style={{ gap: 8, marginTop: 16 }}>
          {insights.map((ins, i) => (
            <div key={i} className={`insight ${ins.type}`}>{ins.text}</div>
          ))}
        </div>
      )}

      {advices.length > 0 && (
        <div style={{ marginTop: 16 }} className="stack" >
          <div className="title-sm row" style={{ gap: 6 }}><Info size={15} color="var(--teal-deep)" /> توصیه‌های عمومی</div>
          {advices.map((a) => (
            <div key={a.region.id} className="advice-box">
              <div className="title-sm" style={{ color: "var(--teal-deep)", marginBottom: 6 }}>{a.region.label}</div>
              <div style={{ fontSize: 13.5, lineHeight: 2, whiteSpace: "pre-wrap" }}>{a.text}</div>
            </div>
          ))}
        </div>
      )}

      <div className="card pad" style={{ marginTop: 16 }}>
        <div className="row" style={{ justifyContent: "space-between", marginBottom: 8 }}>
          <div className="title-sm row" style={{ gap: 6 }}><Message size={14} /> گفت‌وگو با پزشک</div>
          {(() => {
            const unreadFromCoach = getMessages(patient).filter((m) => m.role === "coach" && !m.read).length;
            return unreadFromCoach > 0 ? (
              <span className="tag-teal" style={{ background: "color-mix(in srgb, var(--teal) 18%, transparent)" }}>{toFa(unreadFromCoach)} پیام جدید از پزشک</span>
            ) : null;
          })()}
        </div>
        <MessageThread
          messages={getMessages(patient)}
          role="patient"
          draft={note}
          onDraftChange={setNote}
          onSend={(text) => {
            setPatients((prev) => prev.map((p) => {
              if (p.id !== patient.id) return p;
              const msgs = getMessages(p);
              return { ...p, messages: [...msgs, { id: uid(), role: "patient", text, ts: Date.now(), read: true }] };
            }));
            setNote("");
          }}
          onMarkAllRead={() => {
            setPatients((prev) => prev.map((p) => p.id === patient.id ? { ...p, messages: (p.messages || []).map((m) => ({ ...m, read: true })) } : p));
          }}
          onClear={null}
        />
      </div>

      {session && (
        <SessionOverlay
          items={included}
          phase={assessment.phase}
          images={exerciseImages}
          onLog={logExercise}
          onClose={() => setSession(false)}
        />
      )}
    </div>
  );
}

function AdminGate({ onSubmit, onClose, error }) {
  const [pw, setPw] = useState("");
  const [localErr, setLocalErr] = useState("");
  const [busy, setBusy] = useState(false);
  const submit = async () => {
    if (!pw) { setLocalErr("رمز عبور را وارد کنید."); return; }
    setLocalErr(""); setBusy(true);
    await onSubmit(pw);
    setBusy(false);
  };
  return (
    <div className="modal-back" onClick={onClose}>
      <div className="modal" style={{ maxWidth: 380, textAlign: "center" }} onClick={(e) => e.stopPropagation()}>
        <div className="lock-icon plum"><KeyRound size={20} color="var(--plum)" /></div>
        <div className="serif" style={{ fontSize: 19 }}>ورود به پنل مدیریت</div>
        <div className="muted" style={{ fontSize: 12, marginTop: 6, lineHeight: 1.8 }}>جدا از بخش بیمار — فقط با رمز شما.</div>
        <input type="password" className="input" value={pw} onChange={(e) => setPw(e.target.value)} placeholder="رمز عبور"
          onKeyDown={(e) => e.key === "Enter" && submit()} style={{ marginTop: 16, textAlign: "center", letterSpacing: 2 }} autoFocus autoComplete="current-password" />
        {(localErr || error) && <div className="danger-text" style={{ fontSize: 12, marginTop: 8 }}>{localErr || error}</div>}
        <button className="btn btn-plum" style={{ marginTop: 14, width: "100%" }} onClick={submit} disabled={busy}>{busy ? "در حال بررسی…" : "ورود"}</button>
        <button className="plain-btn muted" style={{ marginTop: 12, fontSize: 11.5 }} onClick={onClose}>انصراف</button>
      </div>
    </div>
  );
}

function ChangePasswordModal({ onSubmit, onClose }) {
  const [current, setCurrent] = useState("");
  const [next, setNext] = useState("");
  const [next2, setNext2] = useState("");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  const submit = async () => {
    const check = validatePassword(next);
    if (check) { setErr(check); return; }
    if (next !== next2) { setErr("رمزهای جدید یکسان نیستند."); return; }
    setErr(""); setBusy(true);
    const ok = await onSubmit(current, next);
    setBusy(false);
    if (!ok) setErr("رمز فعلی اشتباه است.");
  };
  return (
    <div className="modal-back" onClick={onClose}>
      <div className="modal" style={{ maxWidth: 380 }} onClick={(e) => e.stopPropagation()}>
        <div className="serif" style={{ fontSize: 18, marginBottom: 14 }}>تغییر رمز پنل مدیریت</div>
        <div className="stack">
          <input type="password" className="input" placeholder="رمز فعلی" value={current} onChange={(e) => setCurrent(e.target.value)} />
          <input type="password" className="input" placeholder="رمز جدید (حرف + عدد + نماد)" value={next} onChange={(e) => setNext(e.target.value)} />
          <input type="password" className="input" placeholder="تکرار رمز جدید" value={next2} onChange={(e) => setNext2(e.target.value)} />
        </div>
        {err && <div className="danger-text" style={{ fontSize: 12, marginTop: 8 }}>{err}</div>}
        <div className="row" style={{ gap: 8, marginTop: 16 }}>
          <button className="btn btn-plum" style={{ flex: 1 }} onClick={submit} disabled={busy}>{busy ? "در حال ذخیره…" : "ذخیره"}</button>
          <button className="btn btn-ghost" onClick={onClose}>انصراف</button>
        </div>
      </div>
    </div>
  );
}

/* ===================== اپ ===================== */
function App() {
  const [patients, setPatients] = useState([]);
  const [loading, setLoading] = useState(true);
  const [savedTick, setSavedTick] = useState(false);
  const [unlockedId, setUnlockedId] = useState(null);
  const mounted = useRef(false);
  const [resetConfirm, setResetConfirm] = useState(false);
  const [exerciseImages, setExerciseImages] = useState({});
  const [regionAdvice, setRegionAdvice] = useState({});
  const [customExercises, setCustomExercises] = useState([]);
  const [adminHash, setAdminHash] = useState(DEFAULT_ADMIN_HASH);
  const [adminMode, setAdminMode] = useState(false);
  const [showAdminGate, setShowAdminGate] = useState(false);
  const [showChangePw, setShowChangePw] = useState(false);
  const [adminError, setAdminError] = useState("");
  const [theme, setTheme] = useState("light");
  const [toasts, setToasts] = useState([]);
  const fileRef = useRef(null);

  const notify = (msg, type = "info") => {
    const id = uid();
    setToasts((t) => [...t, { id, msg, type }]);
    setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 2800);
  };

  const allExercises = useMemo(() => [...EXERCISES, ...customExercises], [customExercises]);

  useEffect(() => {
    (async () => {
      try { const res = await window.storage.get("tavanyar-patients-shared-v1", true); setPatients(res ? JSON.parse(res.value) : []); } catch (e) { setPatients([]); }
      try { const res2 = await window.storage.get("tavanyar-exercise-images-v1", true); setExerciseImages(res2 ? JSON.parse(res2.value) : {}); } catch (e) { setExerciseImages({}); }
      try { const res3 = await window.storage.get("tavanyar-region-advice-v1", true); setRegionAdvice(res3 ? JSON.parse(res3.value) : {}); } catch (e) { setRegionAdvice({}); }
      try { const resC = await window.storage.get("tavanyar-custom-exercises-v1", true); setCustomExercises(resC ? JSON.parse(resC.value) : []); } catch (e) { setCustomExercises([]); }
      try {
        const th = await window.storage.get("tavanyar-theme-v1", true);
        if (th && th.value) setTheme(th.value);
        else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) setTheme("dark");
      } catch (e) {}
      try {
        const params = new URLSearchParams(window.location.search);
        if (params.get("resetpw") === "1") {
          try { await window.storage.delete("tavanyar-admin-auth-v2", true); } catch (e) {}
          setAdminHash(DEFAULT_ADMIN_HASH);
        } else {
          const res4 = await window.storage.get("tavanyar-admin-auth-v2", true);
          setAdminHash(res4 && res4.value ? res4.value : DEFAULT_ADMIN_HASH);
        }
      } catch (e) { setAdminHash(DEFAULT_ADMIN_HASH); }
      try {
        if (sessionStorage.getItem("tavanyar-admin-session") === "1") setAdminMode(true);
        const pid = sessionStorage.getItem("tavanyar-patient-session");
        if (pid) setUnlockedId(pid);
      } catch (e) {}
      setLoading(false);
      mounted.current = true;
    })();
  }, []);

  useEffect(() => {
    document.documentElement.setAttribute("data-theme", theme);
    if (mounted.current) window.storage.set("tavanyar-theme-v1", theme, true);
  }, [theme]);

  const persist = async (key, value) => {
    const r = await window.storage.set(key, JSON.stringify(value), true);
    if (r && r.error === "QuotaExceededError") notify("حافظه پر است — عکس‌های قدیمی را حذف کنید", "warn");
  };

  useEffect(() => {
    if (!mounted.current) return;
    const t = setTimeout(async () => { await persist("tavanyar-patients-shared-v1", patients); setSavedTick(true); setTimeout(() => setSavedTick(false), 1200); }, 500);
    return () => clearTimeout(t);
  }, [patients]);
  useEffect(() => { if (!mounted.current) return; const t = setTimeout(() => persist("tavanyar-exercise-images-v1", exerciseImages), 400); return () => clearTimeout(t); }, [exerciseImages]);
  useEffect(() => { if (!mounted.current) return; const t = setTimeout(() => persist("tavanyar-region-advice-v1", regionAdvice), 400); return () => clearTimeout(t); }, [regionAdvice]);
  useEffect(() => { if (!mounted.current) return; const t = setTimeout(() => persist("tavanyar-custom-exercises-v1", customExercises), 400); return () => clearTimeout(t); }, [customExercises]);

  const resetAll = async () => {
    setPatients([]);
    try { await window.storage.set("tavanyar-patients-shared-v1", JSON.stringify([]), true); } catch (e) {}
    setResetConfirm(false);
    notify("داده‌های بیماران پاک شد");
  };

  const unlockedPatient = patients.find((p) => p.id === unlockedId);

  const handleImageChange = (exId, dataUrlOrNull) => {
    setExerciseImages((prev) => {
      const next = { ...prev };
      if (dataUrlOrNull) next[exId] = dataUrlOrNull; else delete next[exId];
      return next;
    });
  };

  const onAdminButtonClick = () => {
    if (adminMode) {
      setAdminMode(false);
      try { sessionStorage.removeItem("tavanyar-admin-session"); } catch (e) {}
      return;
    }
    setAdminError("");
    setShowAdminGate(true);
  };

  const submitAdminGate = async (pw) => {
    try {
      const hash = await sha256Hex(pw);
      if (hash === adminHash) {
        setAdminMode(true);
        setShowAdminGate(false);
        setAdminError("");
        try { sessionStorage.setItem("tavanyar-admin-session", "1"); } catch (e) {}
      } else setAdminError("رمز اشتباه است.");
    } catch (e) { setAdminError("خطایی رخ داد، دوباره تلاش کنید."); }
  };

  const submitChangePassword = async (currentPw, nextPw) => {
    const currentHash = await sha256Hex(currentPw);
    if (currentHash !== adminHash) return false;
    const newHash = await sha256Hex(nextPw);
    setAdminHash(newHash);
    try { await window.storage.set("tavanyar-admin-auth-v2", newHash, true); } catch (e) {}
    setShowChangePw(false);
    notify("رمز تغییر کرد", "ok");
    return true;
  };

  const exportBackup = () => {
    const blob = new Blob([JSON.stringify({
      patients, exerciseImages, regionAdvice, customExercises, adminHash, exportedAt: new Date().toISOString(), v: 3,
    }, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `tavanyar-backup-${todayStr()}.json`;
    a.click();
    notify("فایل پشتیبان دانلود شد", "ok");
  };

  const importBackup = async (file) => {
    try {
      const text = await file.text();
      const data = JSON.parse(text);
      if (!data || !Array.isArray(data.patients)) throw new Error("bad");
      setPatients(data.patients);
      setExerciseImages(data.exerciseImages || {});
      setRegionAdvice(data.regionAdvice || {});
      setCustomExercises(data.customExercises || []);
      notify("پشتیبان بازیابی شد", "ok");
    } catch (e) { notify("فایل پشتیبان نامعتبر است", "warn"); }
  };

  const unlockPatient = (id) => {
    setUnlockedId(id);
    try { sessionStorage.setItem("tavanyar-patient-session", id); } catch (e) {}
  };
  const lockPatient = () => {
    setUnlockedId(null);
    try { sessionStorage.removeItem("tavanyar-patient-session"); } catch (e) {}
  };

  return (
    <div className="app">
      <style>{APP_CSS}</style>
      <Toasts items={toasts} />

      <button className={`fab-admin ${adminMode ? "on" : ""}`} onClick={onAdminButtonClick} title="پنل مدیریت">
        <Stethoscope size={18} color={adminMode ? "#fff" : "var(--plum)"} />
      </button>
      <button className="fab-theme" onClick={() => setTheme((t) => t === "dark" ? "light" : "dark")} title="تم">
        {theme === "dark" ? <Sun size={16} /> : <Moon size={16} />}
      </button>

      {adminMode ? (
        <header className="hdr hdr-admin">
          <div className="hdr-inner">
            <div className="row" style={{ gap: 10 }}>
              <div className="brand-mark admin"><Stethoscope size={18} color="#fff" /></div>
              <div>
                <div className="serif" style={{ fontWeight: 700, fontSize: 17, color: "#fff" }}>پنل مدیریت توان‌یار</div>
                <div style={{ fontSize: 10.5, color: "#ffffffb0" }}>جدا از تجربهٔ بیمار — فقط برای پزشک/درمانگر</div>
              </div>
            </div>
            <div className="row wrap" style={{ gap: 8 }}>
              {savedTick && <span style={{ fontSize: 11, color: "#fff" }}>ذخیره شد ✓</span>}
              <button className="hdr-chip" onClick={exportBackup}><Download size={13} /> پشتیبان</button>
              <button className="hdr-chip" onClick={() => fileRef.current && fileRef.current.click()}><Upload size={13} /> بازیابی</button>
              <input ref={fileRef} type="file" accept="application/json" style={{ display: "none" }} onChange={(e) => e.target.files && e.target.files[0] && importBackup(e.target.files[0])} />
              <button className="hdr-chip" onClick={() => setShowChangePw(true)}><KeyRound size={13} /> تغییر رمز</button>
              <button className="hdr-chip light" onClick={onAdminButtonClick}><LogOut size={13} /> خروج</button>
            </div>
          </div>
        </header>
      ) : (
        <header className="hdr hdr-public">
          <div className="hdr-inner">
            <div className="row" style={{ gap: 10 }}>
              <div className="brand-mark"><Sparkles size={18} color="#fff" /></div>
              <div>
                <div className="serif" style={{ fontWeight: 700, fontSize: 17 }}>توان‌یار</div>
                <div className="muted" style={{ fontSize: 10.5 }}>دستیار هوشمند تجویز ورزش توانبخشی</div>
              </div>
            </div>
          </div>
        </header>
      )}

      <div className="disclaimer">
        <Info size={13} />
        {adminMode
          ? "کمک‌تصمیم بالینی است و جایگزین قضاوت پزشک نیست. داده در همین مرورگر ذخیره می‌شود."
          : "کمک‌تصمیم بالینی است و جایگزین قضاوت پزشک نیست. برنامه را پزشک تنظیم می‌کند."}
      </div>

      <div style={{ marginTop: 18 }}>
        {loading ? (
          <div className="muted" style={{ textAlign: "center", padding: 60, fontSize: 13 }}>در حال بارگذاری…</div>
        ) : adminMode ? (
          <div className="fade-in" style={{ maxWidth: 1180, margin: "0 auto", padding: "0 16px" }}>
            <DoctorConsole
              patients={patients} setPatients={setPatients}
              exerciseImages={exerciseImages} onImageChange={handleImageChange}
              regionAdvice={regionAdvice} onAdviceChange={(id, text) => setRegionAdvice((p) => ({ ...p, [id]: text }))}
              allExercises={allExercises} customExercises={customExercises} setCustomExercises={setCustomExercises}
              notify={notify}
            />
            <div style={{ textAlign: "center", marginTop: 40 }}>
              <button className="plain-btn muted" style={{ fontSize: 11 }} onClick={() => (resetConfirm ? resetAll() : setResetConfirm(true))}>
                {resetConfirm ? "برای پاک‌شدن همهٔ دادهٔ بیماران دوباره کلیک کنید" : "پاک کردن همهٔ دادهٔ بیماران"}
              </button>
            </div>
          </div>
        ) : unlockedPatient ? (
          <PatientPortal patient={unlockedPatient} setPatients={setPatients} onLock={lockPatient}
            exerciseImages={exerciseImages} regionAdvice={regionAdvice} allExercises={allExercises} />
        ) : (
          <PatientLockScreen patients={patients} onUnlock={unlockPatient} />
        )}
      </div>

      {showAdminGate && <AdminGate onSubmit={submitAdminGate} onClose={() => setShowAdminGate(false)} error={adminError} />}
      {showChangePw && <ChangePasswordModal onSubmit={submitChangePassword} onClose={() => setShowChangePw(false)} />}
    </div>
  );
}

  .heatmap{ display:grid; grid-template-columns: repeat(7, 1fr); gap:4px; max-width:280px; }
  .heat-cell{ aspect-ratio:1; border-radius:4px; }
  .timer-box{ margin-top:8px; background: var(--paper-2); border-radius:10px; padding:10px; }
  .timer-track{ height:6px; background: var(--line); border-radius:99px; overflow:hidden; margin-top:6px; }
  .timer-fill{ height:100%; background: var(--teal); transition: width .3s linear; }
  .doc-layout{ display:flex; gap:18px; align-items:flex-start; max-width:1180px; margin:0 auto; padding:0 16px; }
  .doc-layout.col{ flex-direction:column; gap:12px; padding:0 12px; }
  .sidebar{ width:260px; flex-shrink:0; position:sticky; top:88px; }
  .doc-layout.col .sidebar{ width:100%; position:static; }
  .patient-list{ display:grid; gap:6px; max-height:520px; overflow-y:auto; }
  .doc-layout.col .patient-list{ max-height:240px; }
  .patient-item{
    all:unset; cursor:pointer; display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:11px;
    border:1px solid transparent;
  }
  .patient-item.active{ background: var(--paper-2); border-color: var(--teal); }
  .avatar{ width:34px; height:34px; border-radius:999px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .tabs{ display:flex; gap:6px; margin-bottom:16px; border-bottom:1px solid var(--line); overflow-x:auto; }
  .tab{
    all:unset; cursor:pointer; display:flex; align-items:center; gap:6px; padding:10px 12px; font-size:13px;
    color: var(--muted); white-space:nowrap; border-bottom:2px solid transparent; flex-shrink:0;
  }
  .tab.on{ font-weight:700; color: var(--teal-deep); border-bottom-color: var(--teal); }
  .doc-main{ flex:1; min-width:0; }
  .lib-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(280px,1fr)); gap:10px; }
  .kpi-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(180px,1fr)); gap:10px; }
  .kpi-n{ font-size:28px; margin-top:4px; }
  .lock-card{
    max-width:380px; margin:40px auto; text-align:center; background: var(--card); border:1px solid var(--line);
    border-radius:22px; padding:28px; box-shadow: var(--shadow-md);
  }
  .lock-icon{
    width:52px; height:52px; border-radius:14px; background: var(--paper-2);
    display:flex; align-items:center; justify-content:center; margin:0 auto 14px;
  }
  .lock-icon.plum{ background: color-mix(in srgb, var(--plum) 14%, transparent); }
  .pin-dots{ display:flex; justify-content:center; gap:10px; margin:18px 0 8px; }
  .pin-dots i{ width:12px; height:12px; border-radius:99px; background: var(--line); display:block; transition: background .15s; }
  .pin-dots i.on{ background: var(--teal); }
  .pin-pad{ display:grid; grid-template-columns: repeat(3, 1fr); gap:8px; margin-top:12px; }
  .pin-key{
    height:52px; border-radius:14px; border:1px solid var(--line); background: var(--paper-2); color: var(--ink);
    font-size:18px; font-weight:700; font-family: inherit; cursor:pointer;
  }
  .pin-key.go{ background: var(--teal); color:#fff; border-color: var(--teal); font-size:14px; }
  .portal{ max-width:640px; margin:0 auto; padding:0 16px; }
  .hero{
    background: linear-gradient(135deg, var(--teal), var(--teal-deep) 65%, var(--plum-deep));
    border-radius:20px; padding:22px; color:#fff; margin-bottom:16px; position:relative; overflow:hidden;
  }
  .hero-glow{ position:absolute; inset:0; opacity:.5; background: radial-gradient(circle at 88% -10%, #ffffff30, transparent 45%), radial-gradient(circle at 0% 120%, #ffffff22, transparent 40%); }
  .pill-light{
    display:inline-flex; align-items:center; gap:5px; background:#ffffff26; border-radius:999px;
    padding:5px 12px; font-size:12.5px; font-weight:700; color:#fff;
  }
  .quote{ text-align:center; color: var(--muted); font-size:13px; margin-bottom:14px; font-style:italic; }
  .coach-note{ background: var(--teal-light); border:1px solid color-mix(in srgb, var(--teal) 30%, transparent); border-radius:16px; padding:14px; margin-bottom:14px; }
  .advice-box{ background: var(--teal-light); border:1px solid color-mix(in srgb, var(--teal) 20%, transparent); border-radius:16px; padding:16px; }
  .clamp2{ overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .session-back{ position:fixed; inset:0; z-index:80; background: linear-gradient(160deg, #0F766E, #115E59 50%, #4E3659); overflow-y:auto; padding:16px 16px 40px; }
  .session-bar{ display:flex; justify-content:space-between; align-items:center; max-width:520px; margin:0 auto; }
  .session-track{ height:4px; background:#ffffff33; border-radius:99px; max-width:520px; margin:10px auto 18px; overflow:hidden; }
  .session-track > div{ height:100%; background:#fff; }
  .session-body{ max-width:520px; margin:0 auto; }
  .session-fig{
    background:#ffffff14; border-radius:20px; min-height:180px; display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  .session-fig img{ width:100%; max-height:260px; object-fit:cover; }
  .hdr{ position:sticky; top:0; z-index:20; }
  .hdr-admin{ background: linear-gradient(135deg, var(--plum), var(--plum-deep)); padding:12px 16px; box-shadow: var(--shadow-md); }
  .hdr-public{ background: color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter: blur(8px); border-bottom:1px solid var(--line); padding:12px 16px; }
  .hdr-inner{ max-width:1180px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .brand-mark{
    width:38px; height:38px; border-radius:11px; background: linear-gradient(135deg, var(--teal), var(--teal-deep));
    display:flex; align-items:center; justify-content:center; box-shadow: var(--shadow-sm);
  }
  .brand-mark.admin{ background:#ffffff22; }
  .hdr-chip{ all:unset; cursor:pointer; display:flex; align-items:center; gap:5px; font-size:12px; color:#fff; background:#ffffff22; border-radius:999px; padding:7px 12px; }
  .hdr-chip.light{ background:#fff; color: var(--plum-deep); font-weight:700; }
  .disclaimer{
    max-width:1180px; margin:0 auto; padding:10px 16px 0; display:flex; gap:8px; align-items:flex-start;
    font-size:11.5px; color: var(--muted);
  }
  .fab-admin, .fab-theme{
    all:unset; cursor:pointer; position:fixed; z-index:60; width:42px; height:42px; border-radius:13px;
    display:flex; align-items:center; justify-content:center; background: var(--card); border:1px solid var(--line);
    box-shadow: var(--shadow-md);
  }
  .fab-admin{ top:16px; left:16px; }
  .fab-admin.on{ background: var(--plum); border-color: var(--plum); }
  .fab-theme{ top:16px; left:66px; color: var(--ink); }
  .toast-wrap{ position:fixed; bottom:18px; left:50%; transform:translateX(-50%); z-index:100; display:grid; gap:8px; width:min(420px, calc(100% - 24px)); }
  .toast{ background: var(--ink); color: var(--card); padding:10px 14px; border-radius:12px; font-size:13px; text-align:center; box-shadow: var(--shadow-lg); }
  .toast-ok{ background: var(--teal-deep); color:#fff; }
  .toast-warn{ background: var(--coral); color:#fff; }
  .bodymap-part{ cursor:pointer; transition: fill .15s; }
  .msg-thread{ display:flex; flex-direction:column; }
  .msg-bubble{ max-width:78%; padding:9px 12px; border-radius:14px; font-size:13.5px; box-shadow: var(--shadow-sm); }
  .msg-bubble.mine{ background: var(--teal); color:#fff; border-bottom-right-radius:4px; }
  .msg-bubble.theirs{ background: var(--card); color: var(--ink); border:1px solid var(--line); border-bottom-left-radius:4px; }
  .msg-meta{ font-size:10px; opacity:.75; margin-bottom:4px; }
  .bodymap-part:hover{ filter: brightness(1.08); }
  .confetti{ pointer-events:none; position:fixed; inset:0; z-index:90; overflow:hidden; }
  .confetti i{ position:absolute; top:-12px; width:8px; height:14px; border-radius:2px; animation: fall 1.8s linear forwards; opacity:.9; }
  @keyframes fall{ to{ transform: translateY(110vh) rotate(220deg); opacity:0; } }
  @keyframes fadeInUp{ from{ opacity:0; transform: translateY(8px);} to{ opacity:1; transform: translateY(0);} }
  @keyframes flamePulse{ 0%,100%{ transform: scale(1);} 50%{ transform: scale(1.12);} }
  .fade-in{ animation: fadeInUp .45s cubic-bezier(.2,.7,.3,1) both; }
  input[type=range]{ height:4px; border-radius:999px; accent-color: var(--teal); }
  ::selection{ background: var(--teal); color:#fff; }
  @media (prefers-reduced-motion: reduce){ *{ animation-duration: .01ms !important; } }
  /* ==== پاسخ‌گویی موبایل — جلوگیری از سرریز افقی در پنل پزشک ==== */
  html, body{ overflow-x:hidden; }
  .app{ overflow-x:hidden; }
  img, svg{ max-width:100%; }
  @media (max-width: 900px){
    .doc-layout{ flex-direction:column !important; gap:12px; padding:0 12px; }
    .doc-layout .sidebar{ width:100% !important; position:static !important; }
    .doc-layout .patient-list{ max-height:240px; }
    .doc-main{ width:100%; min-width:0; }
    .tabs{ flex-wrap:nowrap; }
  }
  @media (max-width: 560px){
    .kpi-grid{ grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); }
    .lib-grid{ grid-template-columns:1fr; }
    .dose-grid{ grid-template-columns:repeat(3,1fr); }
    .modal{ padding:16px; }
    .hdr-inner{ gap:8px; }
    .tab{ padding:8px 9px; font-size:12px; }
    .hero{ padding:16px; }
    .session-fig{ min-height:150px; }
  }
  @media print{ .fab-admin, .fab-theme, .hdr, .disclaimer { display:none !important; } }
`;

try {
  const rootEl = document.getElementById("root");
  const root = ReactDOM.createRoot(rootEl);
  root.render(<App />);
} catch (err) {
  document.getElementById("root").innerHTML =
    '<div id="boot-msg">خطا در اجرای برنامه: ' + (err && err.message ? err.message : err) + "</div>";
  console.error(err);
}
</script>
</body>
</html>

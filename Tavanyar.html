<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0F766E" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>توان‌یار — پلتفرم مدیریت توانبخشی با هدایت پزشک | بر پایه Braddom's PM&amp;R و Frontera Essentials of PM&amp;R</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>

<style>
  :root{
    --brand:#0F766E; --brand-d:#115E59; --brand-l:#CCFBF1; --brand-ll:#F0FDFA;
    --ink:#1E293B; --ink2:#475569; --muted:#64748B; --line:#E2E8F0; --line2:#CBD5E1;
    --bg:#F1F5F9; --card:#FFFFFF; --red:#DC2626; --red-l:#FEF2F2; --amber:#B45309; --amber-l:#FFFBEB;
    --green:#15803D; --green-l:#F0FDF4; --blue:#1D4ED8; --blue-l:#EFF6FF; --violet:#7C3AED; --violet-l:#F5F3FF;
    --r:16px; --shadow:0 1px 3px rgba(15,23,42,.07),0 8px 24px -12px rgba(15,23,42,.12);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{font-family:Vazirmatn,system-ui,sans-serif; background:var(--bg); color:var(--ink); line-height:1.75; font-size:14.5px;}
  #root{min-height:100vh;}
  #boot-msg{min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Vazirmatn,sans-serif;color:var(--muted);direction:rtl;text-align:center;padding:24px;font-size:14px;}
  button{font-family:inherit;}
  .wrap{max-width:1080px;margin:0 auto;padding:0 16px;}
  .muted{color:var(--muted);}
  .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .col{display:flex;flex-direction:column;gap:8px;}
  .mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}
  .mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}

  /* ===== Header ===== */
  .hdr{position:sticky;top:0;z-index:50;background:linear-gradient(135deg,#134E4A,#0F766E 55%,#0D9488);color:#fff;box-shadow:0 2px 14px rgba(15,118,110,.28);}
  .hdr-in{display:flex;align-items:center;gap:14px;padding:12px 16px;}
  .logo{width:42px;height:42px;border-radius:13px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;flex:0 0 auto;border:1px solid rgba(255,255,255,.22);}
  .hdr h1{font-size:17px;margin:0;font-weight:800;letter-spacing:-.2px;line-height:1.4;}
  .hdr .sub{font-size:11.5px;opacity:.85;font-weight:500;}
  .hdr .actions{margin-inline-start:auto;display:flex;gap:8px;}
  .chip-btn{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:999px;padding:6px 13px;font-size:12px;font-weight:600;cursor:pointer;transition:.15s;}
  .chip-btn:hover{background:rgba(255,255,255,.24);}
  .chip-btn.solid{background:#fff;color:var(--brand-d);border-color:#fff;}

  /* ===== Stepper ===== */
  .steps{display:flex;gap:6px;overflow-x:auto;padding:12px 4px 6px;scrollbar-width:thin;}
  .step{flex:1;min-width:150px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;display:flex;align-items:center;gap:9px;cursor:pointer;transition:.18s;}
  .step:hover{border-color:var(--line2);}
  .step.active{border-color:var(--brand);background:var(--brand-ll);box-shadow:0 0 0 3px rgba(15,118,110,.12);}
  .step.done{border-color:var(--brand-l);background:var(--brand-ll);}
  .step .n{width:24px;height:24px;border-radius:999px;background:var(--line);color:var(--ink2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex:0 0 auto;}
  .step.active .n,.step.done .n{background:var(--brand);color:#fff;}
  .step .t{font-size:12px;font-weight:700;color:var(--ink2);white-space:nowrap;}
  .step.active .t{color:var(--brand-d);}

  /* ===== Cards ===== */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;}
  .card + .card{margin-top:12px;}
  .sec-title{font-size:15px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:9px;margin:2px 0 4px;}
  .sec-title .bar{width:4px;height:18px;border-radius:4px;background:var(--brand);display:inline-block;}
  .sec-desc{font-size:12.5px;color:var(--muted);margin:0 0 12px;}

  /* ===== Region grid ===== */
  .region-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;}
  .region-card{border:1.5px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;transition:.16s;background:#fff;display:flex;flex-direction:column;gap:6px;}
  .region-card:hover{border-color:var(--brand);transform:translateY(-1px);box-shadow:var(--shadow);}
  .region-card.sel{border-color:var(--brand);background:var(--brand-ll);box-shadow:0 0 0 3px rgba(15,118,110,.13);}
  .region-card .ic{width:38px;height:38px;border-radius:11px;background:var(--brand-l);color:var(--brand-d);display:flex;align-items:center;justify-content:center;}
  .region-card .nm{font-weight:800;font-size:13.5px;}
  .region-card .hn{font-size:11.5px;color:var(--muted);line-height:1.6;}

  /* ===== Disease cards ===== */
  .dz-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;}
  .dz-card{border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;cursor:pointer;transition:.16s;background:#fff;}
  .dz-card:hover{border-color:var(--brand);box-shadow:var(--shadow);}
  .dz-card.sel{border-color:var(--brand);background:var(--brand-ll);box-shadow:0 0 0 3px rgba(15,118,110,.13);}
  .dz-card .nm{font-weight:800;font-size:13px;display:flex;align-items:flex-start;gap:7px;}
  .dz-card .dc{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.6;}
  .dz-card .src{display:inline-block;font-size:10px;font-weight:700;background:var(--blue-l);color:var(--blue);border-radius:999px;padding:1px 8px;margin-top:6px;}

  /* ===== Checkboxes ===== */
  .chk{display:flex;align-items:flex-start;gap:10px;padding:9px 12px;border:1.5px solid var(--line);border-radius:11px;cursor:pointer;transition:.14s;background:#fff;font-size:13px;line-height:1.7;}
  .chk:hover{border-color:var(--line2);}
  .chk.on{border-color:var(--brand);background:var(--brand-ll);}
  .chk .box{width:19px;height:19px;border-radius:6px;border:2px solid var(--line2);flex:0 0 auto;margin-top:2px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:900;transition:.14s;}
  .chk.on .box{background:var(--brand);border-color:var(--brand);}
  .chk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px;}
  .chk-grid.single{grid-template-columns:1fr;}
  .grp-label{font-size:12px;font-weight:800;color:var(--brand-d);margin:14px 2px 6px;display:flex;align-items:center;gap:6px;}

  /* ===== Plan ===== */
  .plan-card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;}
  .plan-head{padding:14px 18px;background:linear-gradient(135deg,#0F766E,#0D9488);color:#fff;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .plan-head .nm{font-size:16px;font-weight:800;}
  .plan-head .src-badge{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);border-radius:999px;font-size:10.5px;padding:2px 10px;font-weight:700;}
  .plan-body{padding:8px 18px 16px;}
  .psec{border:1px solid var(--line);border-radius:12px;margin-top:12px;overflow:hidden;}
  .psec .ph{display:flex;align-items:center;gap:8px;padding:9px 14px;font-weight:800;font-size:13px;background:var(--bg);border-bottom:1px solid var(--line);}
  .psec .pb{padding:11px 14px;display:flex;flex-direction:column;gap:7px;}
  .psec .pb ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px;}
  .psec .pb li{position:relative;padding-inline-start:20px;font-size:13px;line-height:1.8;}
  .psec .pb li:before{content:"";position:absolute;inset-inline-start:2px;top:10px;width:8px;height:8px;border-radius:3px;background:var(--brand-l);border:1.5px solid var(--brand);}
  .psec.red .ph{background:var(--red-l);color:var(--red);border-color:#FECACA;}
  .psec.red{border-color:#FECACA;}
  .psec.red .pb li:before{background:var(--red-l);border-color:var(--red);}
  .psec.amber .ph{background:var(--amber-l);color:var(--amber);border-color:#FDE68A;}
  .psec.amber{border-color:#FDE68A;}
  .psec.amber .pb li:before{background:var(--amber-l);border-color:var(--amber);}
  .psec.blue .ph{background:var(--blue-l);color:var(--blue);border-color:#BFDBFE;}
  .psec.blue{border-color:#BFDBFE;}
  .psec.blue .pb li:before{background:var(--blue-l);border-color:var(--blue);}
  .psec.green .ph{background:var(--green-l);color:var(--green);border-color:#BBF7D0;}
  .psec.green{border-color:#BBF7D0;}
  .psec.green .pb li:before{background:var(--green-l);border-color:var(--green);}

  /* phases */
  .phase-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px;}
  .phase{border:1px solid var(--line);border-radius:13px;padding:12px;background:#fff;}
  .phase .pt{display:flex;align-items:center;gap:8px;font-weight:800;font-size:12.5px;margin-bottom:8px;color:var(--ink);}
  .phase .pt .pn{width:22px;height:22px;border-radius:7px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;flex:0 0 auto;}
  .phase ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;}
  .phase li{font-size:11.8px;line-height:1.75;color:var(--ink2);padding-inline-start:14px;position:relative;}
  .phase li:before{content:"•";position:absolute;inset-inline-start:1px;color:var(--brand);font-weight:900;}

  /* findings chips */
  .chip{display:inline-flex;align-items:center;gap:5px;background:var(--brand-ll);border:1px solid var(--brand-l);color:var(--brand-d);border-radius:999px;padding:3px 11px;font-size:11.5px;font-weight:600;}
  .chip.warn{background:var(--red-l);border-color:#FECACA;color:var(--red);}

  /* history grid */
  .hx-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;}
  .hx-item{display:flex;gap:9px;padding:9px 12px;border:1.5px solid var(--line);border-radius:11px;cursor:pointer;background:#fff;transition:.14s;font-size:12.5px;font-weight:600;align-items:center;}
  .hx-item:hover{border-color:var(--line2);}
  .hx-item.on{border-color:var(--amber);background:var(--amber-l);box-shadow:0 0 0 3px rgba(180,83,9,.1);color:var(--amber);}
  .hx-item .bx{width:18px;height:18px;border-radius:6px;border:2px solid var(--line2);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;font-weight:900;}
  .hx-item.on .bx{background:var(--amber);border-color:var(--amber);}

  /* buttons */
  .btn{display:inline-flex;align-items:center;gap:8px;border-radius:12px;padding:11px 22px;font-weight:800;font-size:13.5px;cursor:pointer;border:1.5px solid transparent;transition:.16s;}
  .btn-p{background:var(--brand);color:#fff;box-shadow:0 4px 14px -6px rgba(15,118,110,.5);}
  .btn-p:hover{background:var(--brand-d);}
  .btn-o{background:#fff;color:var(--brand-d);border-color:var(--line2);}
  .btn-o:hover{border-color:var(--brand);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btn-lg{width:100%;justify-content:center;padding:14px;font-size:15px;}

  /* empty */
  .empty{text-align:center;padding:34px 16px;color:var(--muted);font-size:13px;}

  /* summary modal print */
  .note-box{background:var(--blue-l);border:1px solid #BFDBFE;border-radius:12px;padding:11px 14px;font-size:12.5px;color:var(--blue);line-height:1.9;}
  .warn-box{background:var(--red-l);border:1px solid #FECACA;border-radius:12px;padding:11px 14px;font-size:12.5px;color:var(--red);line-height:1.9;}
  .amber-box{background:var(--amber-l);border:1px solid #FDE68A;border-radius:12px;padding:11px 14px;font-size:12.5px;color:var(--amber);line-height:1.9;}

  /* patients list */
  .pat-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-top:8px;flex-wrap:wrap;}
  .pat-row .nm{font-weight:800;font-size:13.5px;}
  .pat-row .dt{font-size:11.5px;color:var(--muted);}
  .mini-tag{font-size:10.5px;background:var(--brand-l);color:var(--brand-d);border-radius:999px;padding:2px 9px;font-weight:700;}

  /* footer */
  .foot{text-align:center;color:var(--muted);font-size:11.5px;padding:26px 16px 34px;line-height:2;}
  .foot b{color:var(--ink2);}

  /* ===== Patient portal ===== */
  .pp-login-card{max-width:400px;margin:60px auto 0;text-align:center;}
  .pp-code-input{width:100%;text-align:center;letter-spacing:7px;font-size:22px;font-weight:800;padding:14px;border-radius:12px;border:1.5px solid var(--line2);font-family:'IBM Plex Mono',monospace;text-transform:uppercase;box-sizing:border-box;}
  .pp-code-input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(15,118,110,.15);}
  .code-pill{display:inline-flex;align-items:center;gap:8px;background:var(--brand-ll);border:1.5px dashed var(--brand);color:var(--brand-d);border-radius:12px;padding:8px 16px;font-family:'IBM Plex Mono',monospace;font-size:18px;font-weight:800;letter-spacing:3px;}
  .slider-lbl{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;margin-bottom:6px;}
  .pain-slider{width:100%;accent-color:var(--red);height:6px;}
  .ex-check{display:flex;align-items:flex-start;gap:10px;padding:11px 13px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;background:#fff;margin-top:8px;font-size:13px;line-height:1.75;transition:.14s;}
  .ex-check:hover{border-color:var(--line2);}
  .ex-check.done{border-color:var(--green);background:var(--green-l);}
  .ex-check .bx{width:20px;height:20px;border-radius:7px;border:2px solid var(--line2);flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:12px;margin-top:1px;}
  .ex-check.done .bx{background:var(--green);border-color:var(--green);}
  .log-row{display:flex;justify-content:space-between;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line);font-size:12.5px;}
  .log-row:last-child{border-bottom:none;}
  .pp-phase-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px;}
  .pp-phase-tab{border:1.5px solid var(--line2);background:#fff;border-radius:999px;padding:6px 14px;font-size:11.5px;font-weight:700;cursor:pointer;color:var(--ink2);}
  .pp-phase-tab.on{background:var(--brand);border-color:var(--brand);color:#fff;}

  /* ——— برگهٔ قابل چاپ برای بیمار ——— */
  .print-handout{display:none;direction:rtl;}
  /* alias used by React component (auto-handout) */
  .print-page{display:none;direction:rtl;}
  .print-handout .ph-header{border-bottom:3px solid #0F766E;padding-bottom:14px;margin-bottom:16px;}
  .print-handout .ph-brand{display:flex;align-items:center;gap:10px;font-weight:800;color:#0F766E;font-size:18px;}
  .print-handout .ph-meta{display:flex;flex-wrap:wrap;gap:14px;font-size:11.5px;color:#475569;margin-top:6px;}
  .print-handout .ph-patient-name{font-size:30px;font-weight:900;color:#0F172A;letter-spacing:0;margin:10px 0 4px;}
  .print-handout .ph-patient-meta{font-size:13px;color:#334155;}
  .print-handout .ph-diagnosis{font-size:24px;font-weight:900;color:#0F172A;margin:16px 0 6px;border:2px solid #0F766E;border-radius:10px;padding:10px 14px;background:#F0FDFA;}
  .print-handout .ph-section-title{font-size:15px;font-weight:800;color:#0F766E;border-bottom:1.5px solid #CBD5E1;padding-bottom:6px;margin:18px 0 10px;}
  .print-handout .ph-advice{font-size:13px;line-height:2;color:#1E293B;padding-inline-start:24px;}
  .print-handout .ph-advice li{margin-bottom:6px;}
  /* قواعد QR و کد دسترسی حذف شد — Rehab Access Code هرگز در خروجی چاپی نمایش داده نمی‌شود (Privacy) */
  .print-handout .ph-footer{font-size:10.5px;color:#64748B;margin-top:22px;border-top:1px solid #E2E8F0;padding-top:10px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;}
  .print-handout .ph-install{font-size:12.5px;line-height:2;color:#1E293B;padding-inline-start:24px;}
  .print-handout .ph-install li{margin-bottom:6px;}
  .print-handout .ph-warn{background:#FEF2F2;border:1.5px solid #FCA5A5;border-radius:8px;padding:10px 14px;color:#991B1B;font-weight:700;margin:12px 0;}

  @media print{
    @page{size:A4;margin:14mm 14mm 16mm 14mm;}
    html,body{background:#fff !important;}
    body *{display:none !important;}
    .print-handout,.print-handout *{display:block !important;}
    .print-page,.print-page *{display:block !important;}
    .no-print,.hdr,.steps,.foot{display:none !important;}
    .card,.plan-card{box-shadow:none;border:1px solid #ddd;break-inside:avoid;}
    .wrap{max-width:100%;}
    .phase-grid{grid-template-columns:1fr 1fr;}
  }

  /* ——— انتخاب فاز (پزشک) ——— */
  .phase-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;}
  .phase-pick-card{border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;cursor:pointer;transition:.16s;background:#fff;}
  .phase-pick-card:hover{border-color:var(--brand);box-shadow:var(--shadow);}
  .phase-pick-card.sel{border-color:var(--brand);background:var(--brand-ll);box-shadow:0 0 0 3px rgba(15,118,110,.13);}
  .phase-pick-card .ppc-title{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px;color:var(--ink);}
  .phase-pick-card .ppc-n{width:22px;height:22px;border-radius:7px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;flex:0 0 auto;}
  .phase-pick-card .ppc-crit{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.7;}
  /* ——— جدول ورزش (پزشک) ——— */
  .ex-table{border:1px solid var(--line);border-radius:12px;overflow:hidden;}
  .ex-row{display:grid;grid-template-columns:2fr .6fr .7fr .9fr 1fr 1.6fr;gap:8px;padding:9px 12px;font-size:12px;align-items:center;border-bottom:1px solid var(--line);}
  .ex-row:last-child{border-bottom:none;}
  .ex-row.ex-head{background:var(--bg);font-weight:800;font-size:11px;color:var(--brand-d);}
  .ex-row .ex-n{font-weight:700;}
  .ex-row .ex-o{color:var(--muted);font-size:11px;line-height:1.6;}
  /* ——— توصیه‌های عمومی (بیمار) ——— */
  .advice-list{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;}
  .advice-list li{position:relative;padding-inline-start:20px;font-size:13px;line-height:1.8;}
  .advice-list li:before{content:"";position:absolute;inset-inline-start:2px;top:9px;width:8px;height:8px;border-radius:3px;background:var(--brand-l);border:1.5px solid var(--brand);}
  /* ——— تمرین خانگی با ست و تکرار (بیمار) ——— */
  .ex-check .ex-main{flex:1;}
  .ex-check .ex-guide{margin-top:6px;padding:8px 10px;background:#F8FAFC;border:1px solid var(--line);border-radius:9px;font-size:12.5px;line-height:1.9;color:#334155}.ex-guide b{color:var(--brand-d)}.ex-name{font-weight:700;}

  /* ===== Tavanyar Startup Splash ===== */
  #tavanyar-splash{
    position:fixed; inset:0; z-index:99999;
    display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 42%, #134e4a 0%, #0f766e 42%, #062f2c 100%);
    color:#fff; overflow:hidden;
    transition:opacity .7s ease, visibility .7s ease;
  }
  #tavanyar-splash.hide{opacity:0;visibility:hidden;pointer-events:none;}
  .splash-glow{position:absolute;width:420px;height:420px;border-radius:50%;background:rgba(45,212,191,.12);filter:blur(30px);animation:splashPulse 2.5s ease-in-out infinite;}
  .splash-content{position:relative;text-align:center;direction:ltr;animation:splashEnter 1s cubic-bezier(.16,1,.3,1) both;}
  .splash-title{
    font-family:'IBM Plex Mono',monospace; font-size:clamp(42px,11vw,88px);
    font-weight:600; letter-spacing:.12em; margin-left:.12em;
    text-transform:uppercase; text-shadow:0 8px 35px rgba(0,0,0,.25);

    border-right:2px solid rgba(255,255,255,.8);
    animation:typeTavanyar 1.8s steps(8,end) .25s forwards, caretBlink .75s step-end infinite;
  }
  .splash-line{width:0;height:2px;background:linear-gradient(90deg,transparent,#5eead4,transparent);margin:18px auto 15px;animation:lineGrow .8s ease 1.9s forwards;}
  .splash-credit{opacity:0;transform:translateY(8px);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:clamp(12px,3.2vw,17px);letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:#ccfbf1;text-shadow:0 2px 14px rgba(0,0,0,.35);animation:creditIn .9s ease 2.35s forwards;}
  #tavanyar-splash .splash-hint{position:absolute;left:0;right:0;bottom:22px;text-align:center;font-family:system-ui,sans-serif;font-size:11px;letter-spacing:.08em;color:rgba(255,255,255,.55);opacity:0;pointer-events:none;transition:opacity .6s ease;}
  #tavanyar-splash.skippable{cursor:pointer;}
  #tavanyar-splash.skippable .splash-hint{opacity:1;}
  @media (prefers-reduced-motion:reduce){
    .splash-title{width:auto;animation:none;border-right:0;}
    .splash-line{width:78%;animation:none;}
    .splash-credit{opacity:1;transform:none;animation:none;}
    .splash-glow,.splash-content{animation:none;}

  @keyframes creditIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

    return Array.isArray(arr) ? arr.map(function (r) {

  } catch (e) { return []; }
}

function HistoryEffects(sel) {
  var notes = [];
  sel.forEach(function (id) {
    var it = HISTORY_ITEMS.find(function (h) { return h.id === id; });
    if (it) notes.push({ id: it.id, label: it.label, note: it.note });
  });
  return notes;
}

function buildPlan(disease, findings, history) {
  /* خروجی این تابع در مسیر PHASE_DATA → Clinical Guide → Physician Prescription مصرف می‌شود؛ ساختار و داده‌ها دست‌نخورده است. */
  var redSelected = findings.filter(function (f) { return f.red; });
  var fNotes = (FRONTERA_NOTES[disease.id] || []);
  var fBlock = "";
  if (fNotes.length) {
    fBlock = "\n\n— نکات مکمل از کتاب فرونترا (Essentials of PM&R):\n" + fNotes.map(function (x){return "• " + x;}).join("\n");
  }
  var yellowSelected = findings.filter(function (f) { return f.yellow; });
  var hx = HistoryEffects(history);
  var precautions = [];
  hx.forEach(function (h) {
    if (h.id === "anticoag") precautions.push("مصرف ضدانعقاد: قبل از هر تزریق تهاجمی (داخل مفصلی/اپیدورال/نقاط ماشه‌ای) ارزیابی INR و خطر خونریزی؛ EMG سوزنی با فشار کافی نسبتاً ایمن است.");
    if (h.id === "steroid") precautions.push("مصرف کورتیکواستروئید: تزریق مکرر استروئید می‌تواند تاندون را ضعیف کند؛ قند خون را پایش کنید.");
    if (h.id === "diabetes") precautions.push("دیابت: قند خون را قبل/حین/بعد ورزش چک کنید؛ اگر قند ناشتا >۴۰۰ باشد ورزش ممنوع؛ پای دیابتی و نوروپاتی را بررسی کنید.");
    if (h.id === "osteoporosis") precautions.push("پوکی استخوان: مانورهای HVLA و فلکشن شدید ستون ممنوع؛ ورزش اکستنشن کمر و تقویت با مقاومت ملایم توصیه می‌شود.");
    if (h.id === "preg") precautions.push("بارداری: کمربند باریک برای درد SIJ و عریض برای درد ستون؛ آب‌درمانی و فیزیوتراپی اختصاصی.");
    if (h.id === "heart") precautions.push("بیماری قلبی: شدت ورزش را با RPE تنظیم کنید نه ضربان قلب؛ از برنامه توانبخشی قلبی فازی پیروی کنید.");
    if (h.id === "renal") precautions.push("نارسایی کلیه: دوز گاباپنتین/پره‌گابالین و NSAIDs را بر اساس GFR تنظیم کنید.");
    if (h.id === "opioid") precautions.push("مصرف اپیوئید: ترکیب با بنزودیازپین خطرناک است؛ درمان را چندوجهی و غیراپیوئیدی هدایت کنید.");
    if (h.id === "psych") precautions.push("نشانهٔ هشدار روان‌شناختی: CBT، ACT، تنظیم سطح فعالیت و انتظارات واقع‌بینانه را در برنامه بگنجانید.");
    if (h.id === "cancer") precautions.push("سابقه سرطان: درد جدید شبانه/کاهش وزن = نشانهٔ هشدار قرمز؛ دستکاری دستی ممنوع.");
    if (h.id === "fall") precautions.push("سابقه افتادن/اختلال تعادل: تمرین تعادل و حس عمقی و ارزیابی وسایل کمکی را اضافه کنید.");
    if (h.id === "obesity") precautions.push("چاقی: کاهش وزن ۵-۱۰٪ اثر درمانی بارز دارد؛ ورزش کم‌برخورد ترجیح دارد.");
    if (h.id === "neuro") precautions.push("بیماری نورولوژیک: اسپاستیسیتی و خطر افتادن؛ ارتز و توانبخشی اختصاصی را در نظر بگیرید.");
    if (h.id === "smoker") precautions.push("مصرف دخانیات: ترمیم بافت را به تأخیر می‌اندازد؛ ترک را توصیه کنید.");
  });
  return { redSelected: redSelected, yellowSelected: yellowSelected, hx: hx, precautions: precautions };
}

   لایهٔ ۲ — موتور قانون (Rule Engine) — خالص، بدون وابستگی به UI
   ===================================================================== */
const RULE_ENGINE = {
  /* طبقه‌بندی یافته‌ها به نشانهٔ هشدار قرمز/زرد */
  classifyFindings: function (disease, findings) {
    var red = [], yellow = [];
    (disease.findings || []).forEach(function (f) {
      if (findings.indexOf(f.id) >= 0) {
        if (f.red) red.push(f.label);
        else if (f.yellow) yellow.push(f.label);
      }
    });
    COMMON_FINDINGS.forEach(function (f) {
      if (findings.indexOf(f.id) >= 0) {
        if (f.red) red.push(f.label);
        else if (f.yellow) yellow.push(f.label);
      }
    });
    return { red: red, yellow: yellow };
  },

  /* لایهٔ ایمنی — قبل از موتور فاز: اگر نشانهٔ هشدار قرمز → Alert / Referral / Stop */
  safetyCheck: function (disease, findings) {
    var cls = RULE_ENGINE.classifyFindings(disease, findings);
    return {
      blocked: cls.red.length > 0,
      alerts: cls.red,
      message: cls.red.length > 0
        ? "نشانهٔ هشدار قرمز فعال است: ابتدا ارزیابی فوری و ارجاع؛ برنامهٔ توانبخشی فعال فقط پس از رد موارد خطرناک."
        : "لایهٔ ایمنی: بدون نشانهٔ هشدار قرمز — ادامهٔ ارزیابی مجاز است."
    };
  },

  /* موتور فاز توانبخشی — پیشنهاد فاز بر اساس زمان، شدت و تعدیل‌کننده‌های بیمار */
  suggestPhase: function (diseaseId, patient, findings, history, pain, weeks) {
    var meta = PHASE_META[diseaseId] || [];
    if (!meta.length) return { index: 0, reason: "فاز پیش‌فرض (دادهٔ فاز موجود نیست)", modifiers: [] };
    var hxIds = (history || []).slice();
    var modifiers = [];
    if (patient && patient.age != null && patient.age >= 65) modifiers.push("سن بالا (≥۶۵): پیشرفت آهسته‌تر، تأکید بر تعادل و پیشگیری از افتادن");
    if (patient && patient.bmi != null && patient.bmi >= 30) modifiers.push("BMI بالا (≥۳۰): کاهش وزن ۵-۱۰٪ و ورزش کم‌برخورد");
    if (hxIds.indexOf("osteoporosis") >= 0) modifiers.push("پوکی استخوان: مانورهای HVLA و فلکشن شدید ستون ممنوع");
    if (hxIds.indexOf("diabetes") >= 0) modifiers.push("دیابت: پایش قند خون و پای دیابتی");
    if (hxIds.indexOf("psych") >= 0) modifiers.push("نشانهٔ هشدار روان‌شناختی: CBT، ACT و تنظیم سطح فعالیت");
    if (hxIds.indexOf("anticoag") >= 0) modifiers.push("ضدانعقاد: ارزیابی INR پیش از هر تزریق تهاجمی");
    var idx = 0, reason = "";
    if (weeks == null && pain == null) {
      idx = 0; reason = "بدون دادهٔ زمانی/دردی — فاز نخست به‌عنوان نقطهٔ شروع";
    } else if (weeks != null && weeks >= 6) {
      idx = Math.min(meta.length - 1, 2); reason = "هفتهٔ ≥۶: فاز عملکردی/بازگشت به فعالیت";
    } else if (weeks != null && weeks >= 2) {
      idx = Math.min(meta.length - 1, 1); reason = "هفتهٔ ۲-۶: فاز بهبود";
    } else {
      idx = 0; reason = "شروع بیماری (هفتهٔ <۲ یا درد شدید): فاز حاد";
    }
    return { index: idx, reason: reason, modifiers: modifiers };
  },

  /* خروجی ساختاریافته و قابل توضیح (Explainable Decision) */
  buildDecision: function (disease, findings, history, patient, phaseIdx, weeks, pain) {
    var safety = RULE_ENGINE.safetyCheck(disease, findings);
    var cls = RULE_ENGINE.classifyFindings(disease, findings);
    var suggested = RULE_ENGINE.suggestPhase(disease.id, patient, findings, history, pain, weeks);
    var meta = PHASE_META[disease.id] || [];
    var phaseMeta = meta[phaseIdx] || null;
    return {
      safety: safety,
      findings: cls,
      currentPhase: phaseIdx,
      currentPhaseTitle: phaseMeta ? phaseMeta.title : "",
      suggestedPhase: suggested.index,
      suggestedPhaseTitle: meta[suggested.index] ? meta[suggested.index].title : "",
      whyThisPhase: phaseMeta ? phaseMeta.criteria : "",
      reason: suggested.reason,
      modifiers: suggested.modifiers,
      progression: ["درد در حالت استراحت <۳ از ۱۰", "دامنهٔ حرکتی بدون درد", "انجام ADL بدون محدودیت"],
      phaseChange: ["پس از رسیدن به معیارهای فاز → انتقال به فاز بعدی", "عود درد یا علائم جدید → بازگشت به فاز قبلی یا ارجاع"]
    };
  }
};

function StepsBar({ step, setStep, canGo }) {
  return (
    <div className="wrap">
      <div className="steps">
        {STEPS.map(function (s, i) {
          var cls = "step";
          if (step === s.id) cls += " active";
          else if (STEPS.findIndex(function (x) { return x.id === step; }) > i) cls += " done";
          var locked = !canGo[s.id] && STEPS.findIndex(function (x) { return x.id === step; }) < i;
          return (
            <div key={s.id} className={cls} onClick={function () { if (!locked) setStep(s.id); }} style={locked ? { opacity: .5, cursor: "not-allowed" } : {}}>
              <div className="n">{step === s.id ? toFa(i + 1) : <Check size={13} />}</div>
              <div className="t">{s.title}</div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ——————— داشبورد پایبندی بیمار ——————— */
function AdherenceDashboard({ record, phases }) {
  var [days, setDays] = React.useState(7);
  var activePhase = record.activePhase || 0;
  var phase = phases[activePhase] || { exercises: [] };
  var exercises = phase.exercises || [];
  var now = Date.now();
  var cutoff = now - days * 24 * 60 * 60 * 1000;
  var logs = (record.logs || []).filter(function (l) {
    if (!l.date) return false;
    var t = new Date(l.date + "T23:59:59").getTime();
    return !isNaN(t) && t >= cutoff;
  });
  var activeDays = logs.filter(function (l) { return (l.done || []).length > 0 || l.pain != null; }).length;
  var completed = logs.reduce(function (sum, l) { return sum + (l.done || []).length; }, 0);
  var possible = days * exercises.length;
  var adherence = possible ? Math.min(100, Math.round((completed / possible) * 100)) : 0;
  var eventList = (record.exerciseEvents || []).filter(function (e) { return e && e.ts && new Date(e.ts).getTime() >= cutoff && e.action === "done"; });
  var lastActivityTs = eventList.length ? eventList[eventList.length - 1].ts : null;
  if (!lastActivityTs) {
    var pEntries = (record.painEntries || []).filter(function(e){ return e.ts && new Date(e.ts).getTime() >= cutoff; });
    if (pEntries.length) lastActivityTs = pEntries[pEntries.length - 1].ts;
  }
  var lastActivity = lastActivityTs ? Math.floor((now - new Date(lastActivityTs).getTime()) / (24 * 60 * 60 * 1000)) : null;
  var inactive = lastActivity == null ? true : lastActivity >= 3;
  var painEntries = (record.painEntries || []).filter(function(e){ return e.ts && new Date(e.ts).getTime() >= cutoff; });
  var avgPain = painEntries.length ? painEntries.reduce(function(s,e){ return s + Number(e.nrs || 0); },0) / painEntries.length : null;
  var prevPainEntries = (record.painEntries || []).filter(function(e){
    if (!e.ts) return false; var t=new Date(e.ts).getTime(); return t >= cutoff-days*24*60*60*1000 && t < cutoff;
  });
  var prevAvgPain = prevPainEntries.length ? prevPainEntries.reduce(function(s,e){ return s + Number(e.nrs || 0); },0) / prevPainEntries.length : null;
  var painTrend = avgPain == null || prevAvgPain == null ? "دادهٔ ناکافی" : (avgPain < prevAvgPain - 0.5 ? "کاهشی" : avgPain > prevAvgPain + 0.5 ? "افزایشی" : "پایدار");
  var exerciseStats = exercises.map(function(ex, idx){
    var count = logs.reduce(function(s,l){ return s + ((l.done || []).indexOf(idx) >= 0 ? 1 : 0); },0);
    return { name: ex.n, count: count, rate: logs.length ? Math.round(count / logs.length * 100) : 0 };
  });
  var skipped = exerciseStats.filter(function(x){ return x.count === 0; });
  return (
    <div className="card" style={{ marginTop: 14, borderColor: inactive ? "#FCA5A5" : "var(--brand-l)", background: inactive ? "#FFF7F7" : "#F8FFFD" }}>
      <div className="sec-title"><span className="bar" /><Activity size={16} /> داشبورد پایبندی به برنامه</div>
      <div className="row" style={{ gap: 6, marginBottom: 10, flexWrap: "wrap" }}>
        {[7,14,30].map(function(d){ return <button key={d} className={"btn " + (days===d ? "btn-p" : "btn-o")} style={{padding:"5px 12px",fontSize:12}} onClick={function(){setDays(d);}}>{toFa(d)} روز</button>; })}
      </div>
      {inactive ? (
        <div className="warn-box" style={{ marginBottom: 12 }}><b>هشدار عدم فعالیت:</b> {lastActivity == null ? "هنوز فعالیتی ثبت نشده است." : "حداقل ۳ روز است که فعالیتی ثبت نشده است."} <span>پیشنهاد: پیام پیگیری برای بیمار ارسال شود.</span></div>
      ) : null}
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(130px,1fr))",gap:8}}>
        <div className="chip" style={{justifyContent:"center"}}>پایبندی: <b>{toFa(adherence)}٪</b></div>
        <div className="chip" style={{justifyContent:"center"}}>روزهای فعال: <b>{toFa(activeDays)}</b></div>
        <div className="chip" style={{justifyContent:"center"}}>تمرین انجام‌شده: <b>{toFa(completed)}</b></div>
        <div className="chip" style={{justifyContent:"center"}}>آخرین فعالیت: <b>{lastActivity == null ? "—" : lastActivity === 0 ? "امروز" : toFa(lastActivity)+" روز قبل"}</b></div>
        <div className="chip" style={{justifyContent:"center"}}>میانگین درد: <b>{avgPain == null ? "—" : toFa(avgPain.toFixed(1))}/۱۰</b></div>
        <div className="chip" style={{justifyContent:"center"}}>روند درد: <b>{painTrend}</b></div>
      </div>
      <div className="grp-label" style={{marginTop:14}}>وضعیت هر تمرین</div>
      {exerciseStats.length ? <div style={{display:"grid",gap:6}}>{exerciseStats.map(function(x,i){ return <div key={i} style={{display:"grid",gridTemplateColumns:"1fr auto",gap:8,alignItems:"center",padding:"7px 9px",background:"#fff",border:"1px solid var(--line)",borderRadius:9}}><span style={{fontSize:12.5}}>{x.name}</span><span className="mini-tag">{toFa(x.rate)}٪ — {toFa(x.count)} بار</span></div>; })}</div> : <div className="muted">برای این فاز تمرینی ثبت نشده است.</div>}
      {skipped.length ? <div className="note-box mt12"><b>تمرین‌های بدون ثبت در این بازه:</b> {skipped.map(function(x){return x.name;}).join("، ")}</div> : null}
      <div className="muted" style={{fontSize:11.5,marginTop:9}}>توجه: این شاخص‌ها بر اساس ثبت بیمار در برنامه هستند و انجام واقعی تمرین را به‌طور قطعی اثبات نمی‌کنند.</div>
    </div>
  );
}

/* ——————— پنل دسترسی بیمار (سمت پزشک) ——————— */
/* ——————— پنل دسترسی بیمار + Prescription Builder (سمت پزشک) ——————— */
function PatientAccessPanel({ record, phases, onUpdateRecord }) {
  var [copied, setCopied] = React.useState(false);
  var [note, setNote] = React.useState(record.coachNote || "");
  var [msgDraft, setMsgDraft] = React.useState("");
  var [sentAt, setSentAt] = React.useState(null);
  /* کنترل پزشکی: تأیید نسخه و تغییر فاز فقط در همین پنل پزشک (Physician-controlled) */
  var approved = !!record.approved;
  var activePhase = record.activePhase || 0;
  var phase = phases[activePhase] || null;
  var eb = (window.TAVANYAR_EVIDENCE_KB || {})[record.diseaseId] || {};
  var rx = record.rx || null;

  /* — Prescription Builder: انتخاب آیتم‌به‌آیتم توسط پزشک؛ پیش‌فرض = همهٔ موارد منبع‌دار همان فاز — */
  var [selEx, setSelEx] = React.useState([]);
  var [selMod, setSelMod] = React.useState([]);
  var [selRes, setSelRes] = React.useState([]);
  var [selHome, setSelHome] = React.useState([]);
  var [freq, setFreq] = React.useState("");
  var [goalNote, setGoalNote] = React.useState("");

  React.useEffect(function () {
    function normIdx(arr, pool) {
      if (!arr || typeof arr.length !== "number") return (pool || []).map(function (_, i) { return i; });
      return arr.map(function (x) {
        if (typeof x === "number") return x;
        var k = (pool || []).indexOf(x);
        return k >= 0 ? k : -1;
      }).filter(function (i) { return i >= 0; });
    }
    var exPool = (phase && phase.exercises) || [];
    var modPool = (phase && phase.modalities) || [];
    var resPool = eb.precaut || [];
    var homePool = (phase && phase.general) || [];
    setSelEx(normIdx(rx ? rx.exercises : null, exPool));
    setSelMod(normIdx(rx ? rx.modalities : null, modPool));
    setSelRes(normIdx(rx ? rx.restrictions : null, resPool));
    setSelHome(normIdx(rx ? rx.home : null, homePool));
    setFreq((rx && rx.freq) || "");
    setGoalNote((rx && rx.goalNote) || "");
    // eslint-disable-next-line
  }, [record.id, record.activePhase, record.approved]);

  function toggleIn(arr, setArr, i) {
    setArr(function (prev) {
      var a = (prev || []).slice();
      var pos = a.indexOf(i);
      if (pos >= 0) a.splice(pos, 1); else a.push(i);
      return a;
    });
  }

  function setPhaseByPhysician(i) {
    onUpdateRecord(function (r) { return { activePhase: i, approved: false, approvedAt: null, rx: null }; });
  }
  function approveRx() {
    var PDATA = window.PHASE_DATA || {};
    var act = record.activePhase || 0;
    var phA = (PDATA[record.diseaseId] && PDATA[record.diseaseId].phases[act]) || null;
    if (!phA) { alert("دادهٔ فاز یافت نشد؛ تأیید ممکن نیست."); return; }
    var nEx = (selEx || []).length, nMod = (selMod || []).length;
    if (!nEx && !nMod) {
      if (!window.confirm("هیچ تمرین یا مدالیته‌ای انتخاب نشده است؛ نسخهٔ بدون تمرین تأیید شود؟")) return;
    }
    var ok = window.confirm("نسخهٔ نهایی بر اساس «" + phA.title + "» با " + toFa(nEx) + " تمرین و " + toFa(nMod) + " مدالیتهٔ انتخابی ساخته و قفل شود؟ پس از تأیید، برای ویرایش باید نسخه را دوباره باز کنید.");
    if (!ok) return;
    var sortNum = function (a, b) { return a - b; };
    onUpdateRecord(function () {
      return {
        approved: true, approvedAt: new Date().toISOString(),
        rx: {
          phase: act,
          exercises: (selEx || []).slice().sort(sortNum),
          modalities: (selMod || []).slice().sort(sortNum),
          restrictions: (selRes || []).slice().sort(sortNum),
          home: (selHome || []).slice().sort(sortNum),
          freq: (freq || "").trim(),
          goalNote: (goalNote || "").trim()
        }
      };
    });
  }
  function unapproveRx() {
    onUpdateRecord(function () { return { approved: false, approvedAt: null }; });
  }
  React.useEffect(function () {
    setNote(record.coachNote || "");
  }, [record.id, record.coachNote]);
  function sendMessage() {
    var body = (msgDraft || "").trim();
    if (!body) return;
    var entry = { id: "m" + Date.now(), ts: new Date().toISOString(), text: body };
    onUpdateRecord(function (r) {
      var list = (r.messages || []).slice();
      list.push(entry);
      return { messages: list };
    });
    setMsgDraft("");
    setSentAt(entry.ts);
  }
  return (
    <div className="card" style={{ borderColor: "var(--brand-l)", background: "var(--brand-ll)" }}>
      <div className="sec-title"><span className="bar" />دسترسی و پیگیری بیمار</div>
      <p className="sec-desc">این کد را در اختیار بیمار بگذارید تا در «پنل بیمار» نسخهٔ تأییدشدهٔ شما و برنامهٔ تمرینی خانگی را ببیند و درد و انجام تمرین‌ها را روزانه ثبت کند. بیمار اجازهٔ تغییر نسخهٔ پزشکی را ندارد.</p>
      <div className="row" style={{ gap: 10, alignItems: "center" }}>
        <span className="code-pill">{record.accessCode}</span>
        <button className="btn btn-o" style={{ padding: "8px 14px", fontSize: 12.5 }} onClick={async function () { if (await copyText(record.accessCode)) { setCopied(true); setTimeout(function () { setCopied(false); }, 1800); } }}>
          {copied ? <><Check size={14} /> کپی شد</> : <>کپی کد</>}
        </button>
      </div>

      <div className="grp-label" style={{ marginTop: 16 }}><Dumbbell size={14} /> فاز فعلی توانبخشی (تغییر فاز فقط توسط پزشک)</div>
      <div className="pp-phase-tabs">
        {phases.map(function (p, i) {
          return (
            <button key={i} className={"pp-phase-tab" + (activePhase === i ? " on" : "")}
              onClick={function () { setPhaseByPhysician(i); }}>
              {p.title}
            </button>
          );
        })}
      </div>

      {!approved && phase ? (
        <div className="card" style={{ marginTop: 12, background: "#fff" }}>
          <div className="sec-title"><span className="bar" style={{ background: "var(--blue)" }} />ساخت نسخه (Prescription Builder) — انتخاب پزشک</div>
          <p className="sec-desc" style={{ fontSize: 12 }}>موارد پیشنهادی سیستم از Knowledge Base همان فاز پر شده‌اند؛ پزشک هر مورد را تأیید یا حذف می‌کند. تنها موارد انتخاب‌شده در نسخهٔ نهایی و خروجی چاپی می‌نشینند (اصل: سیستم فقط Decision Support است؛ تصمیم نهایی با پزشک).</p>

          <div className="grp-label"><Dumbbell size={14} /> تمرین‌های درمانی ({toFa((selEx || []).length)} از {toFa((phase.exercises || []).length)})</div>
          {(phase.exercises || []).map(function (ex, i) {
            return (
              <label key={i} style={{ display: "flex", alignItems: "flex-start", gap: 8, padding: "6px 10px", background: "#fff", border: "1px solid var(--line)", borderRadius: 9, marginBottom: 6, cursor: "pointer", fontSize: 12.5 }}>
                <input type="checkbox" checked={(selEx || []).indexOf(i) >= 0} onChange={function () { toggleIn(selEx, setSelEx, i); }} style={{ marginTop: 5, accentColor: "#0F766E" }} />
                <span><b>{ex.n}</b> — ست {ex.s} × تکرار {ex.r}{ex.h ? " — نگه‌داشت " + ex.h : ""}{ex.f ? " — " + ex.f : ""}</span>
              </label>
            );
          })}
          {!(phase.exercises || []).length ? <div className="muted" style={{ fontSize: 12 }}>برای این فاز تمرین منبع‌داری ثبت نشده است؛ سیستم موردی پیشنهاد نمی‌دهد.</div> : null}

          <div className="grp-label"><Waves size={14} /> مدالیته‌ها / Physical Agents ({toFa((selMod || []).length)} از {toFa((phase.modalities || []).length)})</div>
          {(phase.modalities || []).map(function (m, i) {
            return (
              <label key={i} style={{ display: "flex", alignItems: "flex-start", gap: 8, padding: "6px 10px", background: "#fff", border: "1px solid var(--line)", borderRadius: 9, marginBottom: 6, cursor: "pointer", fontSize: 12.5 }}>
                <input type="checkbox" checked={(selMod || []).indexOf(i) >= 0} onChange={function () { toggleIn(selMod, setSelMod, i); }} style={{ marginTop: 5, accentColor: "#0F766E" }} />
                <span>{m}</span>
              </label>
            );
          })}
          {!(phase.modalities || []).length ? <div className="muted" style={{ fontSize: 12 }}>مدالیتهٔ منبع‌داری برای این بیماری/فاز ثبت نشده است؛ سیستم بر اساس حدس مدالیته نمی‌سازد.</div> : null}

          <div className="grp-label"><Shield size={14} /> محدودیت‌ها (Restrictions — از precautionهای منبع‌دار بیماری)</div>
          {(eb.precaut || []).map(function (p, i) {
            return (
              <label key={i} style={{ display: "flex", alignItems: "flex-start", gap: 8, padding: "6px 10px", background: "#fff", border: "1px solid var(--line)", borderRadius: 9, marginBottom: 6, cursor: "pointer", fontSize: 12.5 }}>
                <input type="checkbox" checked={(selRes || []).indexOf(i) >= 0} onChange={function () { toggleIn(selRes, setSelRes, i); }} style={{ marginTop: 5, accentColor: "#B45309" }} />
                <span>{p}</span>
              </label>
            );
          })}
          {!(eb.precaut || []).length ? <div className="muted" style={{ fontSize: 12 }}>موردی ثبت نشده است.</div> : null}

          <div className="grp-label"><Home size={14} /> برنامه منزل (Home Program)</div>
          {((phase && phase.general) || []).map(function (g, i) {
            return (
              <label key={i} style={{ display: "flex", alignItems: "flex-start", gap: 8, padding: "6px 10px", background: "#fff", border: "1px solid var(--line)", borderRadius: 9, marginBottom: 6, cursor: "pointer", fontSize: 12.5 }}>
                <input type="checkbox" checked={(selHome || []).indexOf(i) >= 0} onChange={function () { toggleIn(selHome, setSelHome, i); }} style={{ marginTop: 5, accentColor: "#0F766E" }} />
                <span>{g}</span>
              </label>
            );
          })}
          {!((phase && phase.general) || []).length ? <div className="muted" style={{ fontSize: 12 }}>موردی ثبت نشده است.</div> : null}

          <div style={{ marginTop: 12 }}>
            <div className="grp-label" style={{ marginTop: 0 }}><Clock size={14} /> دفعات / مدت (Frequency / Duration)</div>
            <input value={freq} onChange={function (e) { setFreq(e.target.value); }} placeholder="مثلاً: ۳ جلسه در هفته، ۴ هفته — یا: طبق تعیین پزشک" style={{ width: "100%", padding: "10px 12px", borderRadius: 10, border: "1.5px solid var(--line2)", fontFamily: "inherit", fontSize: 13, background: "#fff" }} />
          </div>
          <div className="grp-label"><Target size={14} /> هدف / تعدیل ویژهٔ پزشک برای این نسخه (اختیاری)</div>
          <textarea value={goalNote} onChange={function (e) { setGoalNote(e.target.value); }} rows={2} placeholder="مثلاً: هدف این فاز، کاهش درد تا حداکثر ۳/۱۰ و بازیابی دامنهٔ کامل بدون درد است." style={{ width: "100%", padding: "10px 12px", borderRadius: 10, border: "1.5px solid var(--line2)", fontFamily: "inherit", fontSize: 13, resize: "vertical", background: "#fff" }} />
        </div>
      ) : null}

      <div className="card" style={{ marginTop: 12, background: "#fff", borderColor: approved ? "var(--green)" : "var(--amber)" }}>
        <div className="sec-title"><span className="bar" style={{ background: approved ? "var(--green)" : "var(--amber)" }} />{approved ? "نسخهٔ توانبخشی نهایی (تأییدشده)" : "تصمیم پزشک و تأیید نسخه"}</div>
        <p className="sec-desc" style={{ fontSize: 12 }}>پیشنهاد سیستم پیشنهاد است، نه دستور پزشک. پس از انتخاب فاز، تکمیل «ساخت نسخه» و بازبینی «راهنمای بالینی فاز»، نسخهٔ نهایی را تأیید کنید؛ چاپ نسخهٔ توانبخشی فقط پس از تأیید فعال می‌شود. با تغییر فاز، نسخه برای بازبینی مجدد باز می‌شود.</p>
        {approved && record.approvedAt ? <div className="note-box" style={{ fontSize: 12 }}><b>وضعیت:</b> تأییدشده در {record.approvedAt.replace("T", " ").substr(0, 16)}{rx ? " — " + toFa((rx.exercises || []).length) + " تمرین، " + toFa((rx.modalities || []).length) + " مدالیته، " + toFa((rx.restrictions || []).length) + " محدودیت انتخاب‌شدهٔ پزشک" : ""}</div> : null}
        <div className="row" style={{ gap: 8, flexWrap: "wrap" }}>
          {approved
            ? <button className="btn btn-o" onClick={unapproveRx}><Edit3 size={14} /> بازگشایی برای اصلاح</button>
            : <button className="btn btn-p" onClick={approveRx}><Check size={14} /> تأیید نسخهٔ نهایی (برای این فاز)</button>}
          <button className={"btn " + (approved ? "btn-p" : "btn-o")} disabled={!approved}
            title={approved ? "خروجی چاپی A4 در پنجرهٔ مستقل" : "ابتدا نسخه را تأیید کنید"}
            onClick={function () { if (window.TAVANYAR_CORE) TAVANYAR_CORE.openPrintableForRecord(record); }}>
            <Printer size={14} /> چاپ نسخهٔ توانبخشی بیمار (A4)
          </button>
        </div>
        {!approved ? <div className="amber-box mt12" style={{ fontSize: 12 }}>چاپ نسخهٔ نهایی فقط پس از تأیید پزشک فعال است (اصل Physician-controlled).</div> : null}
      </div>

      <div className="grp-label"><Edit3 size={14} /> یادداشت ثابت برای بیمار (اختیاری)</div>
      <textarea value={note} onChange={function (e) { setNote(e.target.value); }}
        onBlur={function () { onUpdateRecord(function () { return { coachNote: note }; }); }}
        rows={2} placeholder="مثلاً: تمرین‌ها را آرام و بدون حبس نفس انجام دهید…"
        style={{ width: "100%", padding: "10px 12px", borderRadius: 10, border: "1.5px solid var(--line2)", fontFamily: "inherit", fontSize: 13, resize: "vertical", background: "#fff" }} />

      <div className="grp-label" style={{ marginTop: 14 }}><Edit3 size={14} /> پیام به بیمار</div>
      <textarea value={msgDraft} onChange={function (e) { setMsgDraft(e.target.value); }}
        rows={2} placeholder="مثلاً: این هفته تمرینات تعادل را روزی ۲ نوبت انجام دهید."
        style={{ width: "100%", padding: "10px 12px", borderRadius: 10, border: "1.5px solid var(--line2)", fontFamily: "inherit", fontSize: 13, resize: "vertical", background: "#fff" }} />
      <div className="row" style={{ gap: 10, marginTop: 10, alignItems: "center" }}>
        <button className="btn btn-p" onClick={sendMessage} disabled={!msgDraft.trim()}><Edit3 size={14} /> ارسال پیام</button>
        {sentAt ? <span className="muted" style={{ fontSize: 12 }}>آخرین پیام: <b style={{ color: "#059669" }}>ارسال شد ✓</b></span> : null}
      </div>
      {record.messages && record.messages.length > 0 ? (
        <div style={{ marginTop: 12 }}>
          <div className="grp-label" style={{ marginTop: 0 }}><TrendingUp size={14} /> پیام‌های ارسالی اخیر</div>
          <div className="card" style={{ padding: "6px 12px", background: "#fff" }}>
            {record.messages.slice(-5).reverse().map(function (m, i) {
              var dt = m.ts ? m.ts.replace("T", " ").substr(0, 16) : "—";
              return (
                <div key={m.id || i} className="log-row" style={{ alignItems: "flex-start" }}>
                  <div style={{ minWidth: 130, fontWeight: 600 }}>{dt}</div>
                  <div style={{ flex: 1 }}>{m.text}</div>
                </div>
              );
            })}
          </div>
        </div>
      ) : null}

      <AdherenceDashboard record={record} phases={phases} />

      {record.logs && record.logs.length > 0 ? (
        <div style={{ marginTop: 14 }}>
          <div className="grp-label" style={{ marginTop: 0 }}><TrendingUp size={14} /> آخرین ثبت‌های بیمار</div>
          <div className="card" style={{ padding: "4px 12px", background: "#fff" }}>
            {record.logs.slice(-5).reverse().map(function (l, i) {
              var total = (phases[record.activePhase || 0] || { exercises: [] }).exercises.length;
              return (
                <div key={i} className="log-row">
                  <span>{l.date}</span>
                  <span className="muted">{l.pain != null ? "درد: " + toFa(l.pain) + "/۱۰" : "درد ثبت‌نشده"}</span>
                  <span className="muted">{toFa((l.done || []).length)} از {toFa(total)} تمرین</span>
                </div>
              );
            })}
          </div>
        </div>
      ) : (
        <div className="muted" style={{ fontSize: 12, marginTop: 10 }}>هنوز بیمار وضعیتی ثبت نکرده است.</div>
      )}

      {record.painEntries && record.painEntries.length > 0 ? (
        <PainLogView entries={record.painEntries} />
      ) : null}
    </div>
  );
}

function PlanStep({ regionId, diseaseId, history, patient, record, onUpdateRecord, onBack, onNew }) {
  var reg = DISEASE_MAP[regionId];
  var dz = reg && reg.diseases.find(function (d) { return d.id === diseaseId; });
  if (!reg || !dz) {
    return (
      <div className="wrap mt16">
        <div className="card">
          <div className="sec-title"><span className="bar" />این پرونده قابل نمایش نیست</div>
          <p className="sec-desc">ناحیه یا بیماری مربوط به این پرونده در نسخهٔ فعلی برنامه پیدا نشد (ممکن است پرونده مربوط به نسخهٔ قدیمی‌تر باشد).</p>
          <button className="btn btn-p" onClick={onNew}><Plus size={16} /> پروندهٔ جدید</button>
        </div>
      </div>
    );
  }
  var phaseIdx = record ? (record.activePhase || 0) : 0;
  var phase = (PHASE_DATA[diseaseId] && PHASE_DATA[diseaseId].phases[phaseIdx]) || null;
  var hx = HistoryEffects(history);
  var precautions = [];
  hx.forEach(function (h) {
    if (h.id === "anticoag") precautions.push("مصرف ضدانعقاد: قبل از هر تزریق تهاجمی (داخل مفصلی/اپیدورال/نقاط ماشه‌ای) ارزیابی INR و خطر خونریزی؛ EMG سوزنی با فشار کافی نسبتاً ایمن است.");
    if (h.id === "steroid") precautions.push("مصرف کورتیکواستروئید: تزریق مکرر استروئید می‌تواند تاندون را ضعیف کند؛ قند خون را پایش کنید.");
    if (h.id === "diabetes") precautions.push("دیابت: قند خون را قبل/حین/بعد ورزش چک کنید؛ اگر قند ناشتا >۴۰۰ باشد ورزش ممنوع؛ پای دیابتی و نوروپاتی را بررسی کنید.");
    if (h.id === "osteoporosis") precautions.push("پوکی استخوان: مانورهای HVLA و فلکشن شدید ستون ممنوع؛ ورزش اکستنشن کمر و تقویت با مقاومت ملایم توصیه می‌شود.");
    if (h.id === "preg") precautions.push("بارداری: کمربند باریک برای درد SIJ و عریض برای درد ستون؛ آب‌درمانی و فیزیوتراپی اختصاصی.");
    if (h.id === "heart") precautions.push("بیماری قلبی: شدت ورزش را با RPE تنظیم کنید نه ضربان قلب؛ از برنامه توانبخشی قلبی فازی پیروی کنید.");
    if (h.id === "renal") precautions.push("نارسایی کلیه: دوز گاباپنتین/پره‌گابالین و NSAIDs را بر اساس GFR تنظیم کنید.");
    if (h.id === "opioid") precautions.push("مصرف اپیوئید: ترکیب با بنزودیازپین خطرناک است؛ درمان را چندوجهی و غیراپیوئیدی هدایت کنید.");
    if (h.id === "psych") precautions.push("نشانهٔ هشدار روان‌شناختی: CBT، ACT، تنظیم سطح فعالیت و انتظارات واقع‌بینانه را در برنامه بگنجانید.");
    if (h.id === "cancer") precautions.push("سابقه سرطان: درد جدید شبانه/کاهش وزن = نشانهٔ هشدار قرمز؛ دستکاری دستی ممنوع.");
    if (h.id === "fall") precautions.push("سابقه افتادن/اختلال تعادل: تمرین تعادل و حس عمقی و ارزیابی وسایل کمکی را اضافه کنید.");
    if (h.id === "obesity") precautions.push("چاقی: کاهش وزن ۵-۱۰٪ اثر درمانی بارز دارد؛ ورزش کم‌برخورد ترجیح دارد.");
    if (h.id === "neuro") precautions.push("بیماری نورولوژیک: اسپاستیسیتی و خطر افتادن؛ ارتز و توانبخشی اختصاصی را در نظر بگیرید.");
    if (h.id === "smoker") precautions.push("مصرف دخانیات: ترمیم بافت را به تأخیر می‌اندازد؛ ترک را توصیه کنید.");
  });
  return (
    <div className="wrap mt16">
      {record ? (
        <PatientAccessPanel record={record} phases={PHASE_DATA[diseaseId] ? PHASE_DATA[diseaseId].phases : []} onUpdateRecord={onUpdateRecord} />
      ) : null}
      <div className="plan-card">
        <div className="plan-head">
          <span className="nm">{dz.name}</span>
          <span className="src-badge">{sourceLabel(dz.id)}</span>
          <span className="src-badge">ناحیه: {reg.label}</span>
          {phase ? <span className="src-badge">{phase.title}</span> : null}
        </div>
        <div className="plan-body">
          {patient && patient.name ? (
            <div className="row mt12" style={{ gap: 8 }}>
              <span className="chip"><User size={12} /> {patient.name}{patient.age ? "، " + toFa(patient.age) + " ساله" : ""}{patient.sex ? "، " + patient.sex : ""}</span>
              <span className="chip"><Calendar size={12} /> {todayFa()}</span>
            </div>
          ) : null}

          {phase && phase.criteria ? (
            <Psec tone="blue" title="معیارهای فاز انتخابی" icon={<Info size={15} />}>
              <div style={{ fontSize: 13, lineHeight: 1.8 }}>{phase.criteria}</div>
            </Psec>
          ) : null}

          {dz.redFlags && dz.redFlags.length ? (
            <Psec tone="red" title="هشدار — فلگ‌های قرمز (بررسی فوری)" icon={<AlertTriangle size={16} />}>
              <ul>
                {dz.redFlags.map(function (r, i) {
                  var key = "rf" + i;
                  return <li key={key}>{r} — در صورت حضور، ارجاع فوری.</li>;
                })}
              </ul>
            </Psec>
          ) : null}

          {precautions.length > 0 ? (
            <Psec tone="amber" title="ملاحظات سوابق بیمار (در برنامه اعمال شد)" icon={<Shield size={15} />}>
              <ul>{precautions.map(function (p, i) { return <li key={i}>{p}</li>; })}</ul>
            </Psec>
          ) : null}

          {(() => {
            var dec = RULE_ENGINE.buildDecision(dz, record ? (record.findings || []) : [], history, patient, phaseIdx, null, null);
            return (
              <Psec tone="blue" title="چرا این فاز؟ — خروجی قابل توضیح موتور تصمیم‌گیری" icon={<TrendingUp size={15} />}>
                <div style={{ fontSize: 13, lineHeight: 1.9 }}>
                  <div><b>فاز فعلی:</b> {phase ? phase.title : "—"} — {dec.whyThisPhase}</div>
                  <div style={{ marginTop: 6 }}><b>دلیل پیشنهاد فاز:</b> {dec.reason}</div>
                  {dec.modifiers.map(function (m, i) {
                    var key = "mod" + i;
                    return <div key={key} style={{ marginTop: 4 }}><b>تعدیل‌کنندهٔ اعمال‌شده:</b> {m}</div>;
                  })}
                  {dec.safety.blocked ? (
                    <div className="warn-box mt12"><b>هشدار لایهٔ ایمنی:</b> {dec.safety.message}</div>
                  ) : null}
                  <div style={{ marginTop: 6 }}><b>معیارهای پیشرفت به فاز بعد:</b> {dec.progression.join("؛ ")}</div>
                  <div style={{ marginTop: 4 }}><b>معیار تغییر فاز:</b> {dec.phaseChange.join("؛ ")}</div>
                </div>
              </Psec>
            );
          })()}

          {/* ===== راهنمای بالینی فاز (Clinical Guide for Physician) — هر داده فقط یک‌بار، همین‌جا ===== */}
          {phase ? (function () {
            var G = TAVANYAR_CORE.guide(dz, diseaseId, phaseIdx);
            var cards = TAVANYAR_CORE.agentCards(diseaseId, phase);
            var eb = (window.TAVANYAR_EVIDENCE_KB || {})[diseaseId] || {};
            return (
              <Psec tone="blue" title={"راهنمای بالینی فاز — " + (G.phaseTitle || "—")} icon={<BookOpen size={15} />}>
                <div style={{ fontSize: 13, lineHeight: 1.9 }}>
                  <div style={{ marginTop: 4 }}><b>۶.۱ اهداف درمان:</b> {G.goalsText}</div>
                  <div style={{ marginTop: 8 }}><b>۶.۲ ارزیابی‌های لازم:</b>
                    <ul style={{ margin: "4px 0 0", paddingInlineStart: 20 }}>
                      {G.assessments.map(function (a, i) { return <li key={i}>{a}</li>; })}
                    </ul>
                    <div style={{ fontSize: 11.5, color: "var(--muted)", marginTop: 4 }}>{G.assessmentsNote}</div>
                  </div>
                  <div style={{ marginTop: 8 }}><b>ثبت منبع بالینی:</b> {G.sourceLabel}{G.chapters.length ? " — " + G.chapters.slice(0, 3).join("؛ ") : ""} <span style={{ color: "var(--muted)" }}>({toFa(G.quoteCount)} استناد ثبت‌شده در Knowledge Base)</span></div>
                  {G.pearls.length ? (
                    <div style={{ marginTop: 8 }}><b>نکات بالینی ثبت‌شده:</b>
                      <ul style={{ margin: "4px 0 0", paddingInlineStart: 20 }}>{G.pearls.map(function (p, i) { return <li key={i}>{p}</li>; })}</ul>
                    </div>
                  ) : null}
                  {!G.pearls.length && !G.precautions.length && !G.quoteCount ? <div style={{ marginTop: 8, color: "var(--amber)" }}>شواهد اختصاصی کافی در منابع بررسی‌شده ثبت نشده است.</div> : null}
                  {G.precautions.length ? (
                    <div style={{ marginTop: 8 }}><b>احتیاط‌های ثبت‌شدهٔ بیماری (Safety / Clinical Management):</b>
                      <ul style={{ margin: "4px 0 0", paddingInlineStart: 20 }}>{G.precautions.map(function (p, i) { return <li key={i}>{p}</li>; })}</ul>
                    </div>
                  ) : null}
                  <div style={{ marginTop: 10 }}><b>کارت‌های بالینی مدالیته‌ها (Clinical Card):</b>
                    {cards.length ? cards.map(function (c, i) {
                      return (
                        <div key={i} style={{ border: "1px solid var(--line)", borderRadius: 10, padding: "8px 11px", margin: "6px 0", fontSize: 12.5, background: "#fff" }}>
                          <b style={{ color: "var(--brand-d)" }}>{c.name}</b>
                          <div><b>هدف استفاده (Indication / Clinical Goal):</b> {c.indication}</div>
                          <div><b>Parameters:</b> {c.parameters}</div>
                          <div><b>Contraindications:</b> {c.contraindications.length ? c.contraindications.join("؛ ") : "موردی ثبت نشده است."}</div>
                          {c.dzRelativePrecautions.length ? <div><b>Precautions (بیماری‌محور):</b> {c.dzRelativePrecautions.join("؛ ")}</div> : null}

function PatientModal({ patient, onSave, onClose }) {
  var [name, setName] = React.useState(patient ? patient.name : "");
  var [nid, setNid] = React.useState(patient ? (patient.nationalId || "") : "");
  var [doctorName, setDoctorName] = React.useState(patient ? (patient.doctorName || "") : "");
  var [age, setAge] = React.useState(patient ? patient.age : "");
  var [sex, setSex] = React.useState(patient ? patient.sex : "");
  var [note, setNote] = React.useState(patient ? patient.note : "");
  var [err, setErr] = React.useState("");
  function normalizeNid(v) {
    return String(v || "").replace(/[۰-۹]/g, function(c){ return String.fromCharCode(c.charCodeAt(0)-0x06F0+48); }).replace(/[٠-٩]/g, function(c){ return String.fromCharCode(c.charCodeAt(0)-0x0660+48); }).replace(/\D/g, "").slice(0,10);
  }
  function nidCheck(n) {
    if (!/^\d{10}$/.test(n)) return false;
    if (/^(\d)\1{9}$/.test(n)) return false;
    var c=[10,9,8,7,6,5,4,3,2], sum=0;
    for(var i=0;i<9;i++) sum += c[i] * (+n[i]);
    var r=sum%11;
    var check=(r<2)?+n[9]:11-r;
    return check === (+n[9]);
  }
  function submit() {
    var n=normalizeNid(nid);
    if (!name.trim()) { setErr("نام و نام خانوادگی بیمار الزامی است."); return; }
    if (!nidCheck(n)) { setErr("کد ملی ۱۰ رقمی معتبر وارد کنید."); return; }
    if (!doctorName.trim()) { setErr("نام پزشک معالج الزامی است."); return; }
    setErr("");
    onSave({ name: name.trim(), nationalId: n, doctorName: doctorName.trim(), age: age.trim(), sex: sex, note: note.trim() });
  }
  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(15,23,42,.5)", zIndex: 100, display: "flex", alignItems: "center", justifyContent: "center", padding: 16 }} onClick={onClose}>
      <div className="card" style={{ maxWidth: 500, width: "100%" }} onClick={function (e) { e.stopPropagation(); }}>
        <div className="sec-title"><span className="bar" />اطلاعات بیمار</div>
        <p className="sec-desc">برای فعال شدن دسترسی توانبخشی، ثبت کد ملی بیمار و نام پزشک معالج الزامی است.</p>
        <div className="col mt12">
          <label style={{ fontSize: 12, fontWeight: 700 }}>نام و نام خانوادگی *</label>
          <input value={name} onChange={function (e) { setName(e.target.value); setErr(""); }} placeholder="مثلاً: سارا احمدی" style={{ padding: "10px 12px", borderRadius: 10, border: "1.5px solid var(--line2)", fontFamily: "inherit", fontSize: 13.5 }} />
          <label style={{ fontSize: 12, fontWeight: 700 }}>کد ملی بیمار *</label>
          <input value={nid} onChange={function (e) { setNid(normalizeNid(e.target.value)); setErr(""); }} placeholder="۱۰ رقم" inputMode="numeric" maxLength={10} dir="ltr" style={{ padding: "10px 12px", borderRadius: 10, border: "1.5px solid var(--line2)", fontFamily: "inherit", fontSize: 13.5, letterSpacing: 2 }} />
          <label style={{ fontSize: 12, fontWeight: 700 }}>نام پزشک معالج / متخصص *</label>
          <input value={doctorName} onChange={function (e) { setDoctorName(e.target.value); setErr(""); }} placeholder="مثلاً: دکتر محمدرضا دهقان‌زاده" style={{ padding: "10px 12px", borderRadius: 10, border: "1.5px solid var(--line2)", fontFamily: "inherit", fontSize: 13.5 }} />
          <div className="row" style={{ gap: 8 }}>
            <div style={{ flex: 1 }}>
              <label style={{ fontSize: 12, fontWeight: 700 }}>سن</label>
              <input value={age} onChange={function (e) { setAge(e.target.value); }} placeholder="مثلاً ۴۵" inputMode="numeric" style={{ width: "100%", padding: "10px 12px", borderRadius: 10, border: "1.5px solid var(--line2)", fontFamily: "inherit", fontSize: 13.5, marginTop: 4 }} />
            </div>
            <div style={{ flex: 1 }}>
              <label style={{ fontSize: 12, fontWeight: 700 }}>جنسیت</label>
              <select value={sex} onChange={function (e) { setSex(e.target.value); }} style={{ width: "100%", padding: "10px 12px", borderRadius: 10, border: "1.5px solid var(--line2)", fontFamily: "inherit", fontSize: 13.5, marginTop: 4, background: "#fff" }}>
                <option value="">—</option><option value="زن">زن</option><option value="مرد">مرد</option>
              </select>
            </div>
          </div>
          <label style={{ fontSize: 12, fontWeight: 700 }}>یادداشت بالینی پزشک</label>
          <textarea value={note} onChange={function (e) { setNote(e.target.value); }} rows={3} placeholder="توضیحات تکمیلی پزشک…" style={{ padding: "10px 12px", borderRadius: 10, border: "1.5px solid var(--line2)", fontFamily: "inherit", fontSize: 13.5, resize: "vertical" }} />
          {err ? <div className="warn-box" style={{ marginTop: 4 }}>{err}</div> : null}
          <button className="btn btn-p" onClick={submit}><Check size={16} /> ذخیرهٔ اطلاعات بیمار</button>
        </div>
      </div>
    </div>
  );
}

function findDiseaseById(diseaseId) {
  var regionKeys = Object.keys(DISEASE_MAP);
  for (var i = 0; i < regionKeys.length; i++) {
    var reg = DISEASE_MAP[regionKeys[i]];
    var dz = reg.diseases.find(function (d) { return d.id === diseaseId; });
    if (dz) return { reg: reg, dz: dz };
  }
  return { reg: null, dz: null };
}

    "کشش همسترینگ": {name:"کشش پشت ران",steps:["به پشت دراز بکشید یا روی صندلی بنشینید و یک پا را دراز کنید.","با دست‌ها یا یک حوله، پا را آرام به سمت خودتان بکشید.","کشش ملایم را در پشت ران حس کنید و ۲۰ تا ۳۰ ثانیه نگه دارید.","آرام رها کنید و برای پای دیگر تکرار کنید.","هر پا را ۴ بار انجام دهید و روزی ۲ نوبت تکرار کنید."],warning:"اگر درد تیرکشنده به ساق یا کف پا ایجاد شد، فشار را کمتر کنید."},
    "پل (Bridge)": {name:"بالا آوردن لگن",steps:["به پشت دراز بکشید، زانوها را خم کنید و کف پاها را روی زمین، به عرض لگن بگذارید.","شکم را آرام سفت کنید و کمر را به زمین بچسبانید.","با فشار از پاها، لگن را آرام از زمین بلند کنید تا تنه و ران‌ها در یک خط قرار بگیرند.","۱ تا ۲ ثانیه نگه دارید و آرام پایین بیایید.","۱۲ بار تکرار کنید و روزی یک نوبت انجام دهید."],warning:"اگر درد کمر در بالای حرکت بیشتر شد، دامنه را کم کنید یا تمرین را متوقف کنید."},
    "پرنده-سگ (Bird-dog)": {name:"حرکت دست و پای مخالف",steps:["چهاردست‌وپا قرار بگیرید؛ دست‌ها زیر شانه و زانوها زیر لگن.","شکم را آرام سفت کنید و کمر را صاف نگه دارید.","دست راست و پای چپ را همزمان و آرام دراز کنید تا با تنه یک خط شوند.","۲ تا ۳ ثانیه نگه دارید و آرام برگردانید.","سمت دیگر را انجام دهید؛ ۱۰ بار هر طرف، روزی یک نوبت."],warning:"اگر کمر بیش از حد فرو رفت یا لگن چرخید، دامنه را کم کنید."},
    "اکستنشن مک‌کنزی (در درد دیسکی)": {name:"راست کردن کمر روی شکم",steps:["روی شکم دراز بکشید و دست‌ها را کنار شانه‌ها بگذارید.","به آرامی با فشار دست‌ها، بالاتنه را از زمین بلند کنید، در حالی که لگن روی زمین می‌ماند.","فقط تا جایی بالا بیایید که درد پا بهتر یا بدون تغییر باشد.","۱ تا ۲ ثانیه نگه دارید و آرام پایین بیایید.","۱۰ بار تکرار کنید و روزی ۲ نوبت انجام دهید."],warning:"اگر درد به پا بیشتر یا دورتر شد، این تمرین مناسب شما نیست؛ تمرین را متوقف کنید و به پزشک اطلاع دهید."},
    "پلانک": {name:"نگه داشتن بدن صاف (پلانک)",steps:["روی شکم دراز بکشید و آرنج‌ها را زیر شانه‌ها بگذارید.","با فشار ساعد و پنجه پا، بدن را از زمین بلند کنید.","بدن باید از سر تا پاشنه در یک خط مستقیم باشد؛ شکم را سفت نگه دارید.","۲۰ تا ۳۰ ثانیه در این وضعیت بمانید.","۱۰ بار تکرار کنید و روزی یک نوبت انجام دهید."],warning:"اگر کمر افت کرد یا درد گرفت، تمرین را متوقف کنید و بعداً با زمان کمتر ادامه دهید."},
    "اسکات و ددلیفت سبک با فرم صحیح": {name:"اسکات و بلند کردن سبک با فرم درست",steps:["برای اسکات: پاها را به عرض شانه باز کنید، لگن را به عقب ببرید و زانوها را خم کنید، مثل نشستن روی صندلی.","تا حدی پایین بروید که کمر صاف بماند و زانو از پنجه پا جلو نزند.","برای بلند کردن سبک: جسم را نزدیک بدن بگیرید، با خم کردن زانو و لگن پایین بروید، سپس با فشار پاها بالا بیایید.","هر حرکت را ۱۲ بار انجام دهید و ۳ نوبت در هفته تکرار کنید.","با جسم‌های سبک شروع کنید (مثلاً بطری آب)."],warning:"هرگز با کمر گرد جسم بلند نکنید و اگر درد کمر در حین حرکت بیشتر شد، آن را متوقف کنید."},
    "تمرینات عملکردی شغلی": {name:"تمرین حرکات شغلی",steps:["به حرکات کاری روزمره‌ای که باعث درد می‌شوند فکر کنید (مثل بلند کردن، چرخیدن، هل دادن).","هر حرکت را با شدت کم و در دامنه‌ای که درد ندارد، شبیه‌سازی کنید.","از وزنه‌های سنگین و حرکات ناگهانی خودداری کنید؛ هدف آماده‌سازی تدریجی است.","۱۵ بار تکرار کنید و ۲ تا ۳ نوبت در هفته انجام دهید.","با بهتر شدن، شدت و سرعت را کم‌کم افزایش دهید."],warning:"اگر دردی مشابه درد اولیه برگشت، شدت را کم کنید و به پزشک اطلاع دهید."}

/* —— بررسی یکپارچگی: هشدار در کنسول اگر تمرینی در PHASE_DATA تعریف شده اما در PATIENT_EXERCISE_OVERRIDES پوشش داده نشده باشد —— */
function validatePatientExerciseOverrides() {
  var missing = [];
  Object.keys(PHASE_DATA).forEach(function(diseaseId) {
    var overridesForDisease = PATIENT_EXERCISE_OVERRIDES[diseaseId] || {};
    var phases = (PHASE_DATA[diseaseId] && PHASE_DATA[diseaseId].phases) || [];
    phases.forEach(function(phase) {
      (phase.exercises || []).forEach(function(ex) {
        if (!overridesForDisease[ex.n]) {
          missing.push(diseaseId + " / " + phase.id + " / \"" + ex.n + "\"");
        }
      });
    });
  });
  if (missing.length > 0) {
    console.warn("[patientExerciseOverrides] " + missing.length + " تمرین بدون توضیح بیمارمحور اختصاصی یافت شد (به fallback عمومی برمی‌گردند):");
    missing.forEach(function(m) { console.warn("  - " + m); });
  }
  return missing;
}
validatePatientExerciseOverrides();

  if (/پاسچر|وضعیت بدن|ارگونومی/.test(n)) return "سر، شانه و تنه را در وضعیت راحت و متعادل نگه دارید. از ماندن طولانی در یک وضعیت خودداری کنید و وضعیت بدن را مرتب تغییر دهید.";

function patientExerciseTitle(name) {
  var x = String(name || "");
  var replacements = [
    // 🔴 ابتدا قواعد اختصاصی (باید قبل از قاعدهٔ عمومی ایزومتریک بیایند)
    [/ایزومتریک ملایم کاف/gi, "فشار ملایم عضلات شانه"],
    [/ایزومتریک ملایم/gi, "فشار ملایم بدون حرکت"],
    [/ملایم کاف/gi, "عضلات اطراف شانه"],
    // سپس قواعد عمومی
    [/ایزومتریک/gi, ""], [/اکسنتریک/gi, ""], [/کانسنتریک/gi, ""],
    [/پروگرسیو/gi, ""], [/پیشرونده/gi, "تقویتی"],
    [/استاتیک/gi, ""], [/داینامیک/gi, ""],
    [/ROM/gi, "دامنه حرکتی"], [/TheraBand/gi, "کش ورزشی"],
    [/Push-up plus/gi, "فشار دادن دیوار و حرکت کتف"],
    [/Push-up/gi, "فشار دادن دیوار"], [/Bird-dog/gi, "حرکت دست و پای مخالف"],
    [/Pendulum/gi, "آونگی"], [/Scapular/gi, "کتف"],
    [/protraction/gi, "جلو آوردن کتف"], [/retraction/gi, "عقب بردن کتف"],
    [/روتاتور کاف/gi, "عضلات اطراف شانه"],
    [/پروترکشن/gi, "جلو آوردن کتف"], [/رترکشن/gi, "عقب بردن کتف"],
    [/حس عمقی/gi, "کنترل و تعادل"], [/نورال گلاید/gi, "حرکت آرام عصب"],
    [/Nerve glide/gi, "حرکت آرام عصب"],
    [/کاف/gi, "عضلات اطراف شانه"]
  ];
  replacements.forEach(function(r){ x=x.replace(r[0],r[1]); });
  x=x.replace(/\(\s*\)/g,"").replace(/\s{2,}/g," ").replace(/\s+([،:؛])/g,"$1").trim();
  return x;
}

    var rcWarn = {

    var impWarn = {

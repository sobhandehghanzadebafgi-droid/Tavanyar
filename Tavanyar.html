<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0F766E" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>توان‌یار کلینیک — دستیار تشخیصی و تجویز توانبخشی | بر پایه Braddom's PM&R</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<style>
  :root{
    --brand:#0F766E; --brand-d:#115E59; --brand-l:#CCFBF1; --brand-ll:#F0FDFA;
    --ink:#1E293B; --ink2:#475569; --muted:#64748B; --line:#E2E8F0; --line2:#CBD5E1;
    --bg:#F1F5F9; --card:#FFFFFF; --red:#DC2626; --red-l:#FEF2F2; --amber:#B45309; --amber-l:#FFFBEB;
    --green:#15803D; --green-l:#F0FDF4; --blue:#1D4ED8; --blue-l:#EFF6FF; --violet:#7C3AED; --violet-l:#F5F3FF;
    --r:16px; --shadow:0 1px 3px rgba(15,23,42,.07),0 8px 24px -12px rgba(15,23,42,.12);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{font-family:Vazirmatn,system-ui,sans-serif; background:var(--bg); color:var(--ink); line-height:1.75; font-size:14.5px;}
  #root{min-height:100vh;}
  #boot-msg{min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Vazirmatn,sans-serif;color:var(--muted);direction:rtl;text-align:center;padding:24px;font-size:14px;}
  button{font-family:inherit;}
  .wrap{max-width:1080px;margin:0 auto;padding:0 16px;}
  .muted{color:var(--muted);}
  .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .col{display:flex;flex-direction:column;gap:8px;}
  .mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}
  .mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}

  /* ===== Header ===== */
  .hdr{position:sticky;top:0;z-index:50;background:linear-gradient(135deg,#134E4A,#0F766E 55%,#0D9488);color:#fff;box-shadow:0 2px 14px rgba(15,118,110,.28);}
  .hdr-in{display:flex;align-items:center;gap:14px;padding:12px 16px;}
  .logo{width:42px;height:42px;border-radius:13px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;flex:0 0 auto;border:1px solid rgba(255,255,255,.22);}
  .hdr h1{font-size:17px;margin:0;font-weight:800;letter-spacing:-.2px;line-height:1.4;}
  .hdr .sub{font-size:11.5px;opacity:.85;font-weight:500;}
  .hdr .actions{margin-inline-start:auto;display:flex;gap:8px;}
  .chip-btn{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:999px;padding:6px 13px;font-size:12px;font-weight:600;cursor:pointer;transition:.15s;}
  .chip-btn:hover{background:rgba(255,255,255,.24);}
  .chip-btn.solid{background:#fff;color:var(--brand-d);border-color:#fff;}

  /* ===== Stepper ===== */
  .steps{display:flex;gap:6px;overflow-x:auto;padding:12px 4px 6px;scrollbar-width:thin;}
  .step{flex:1;min-width:150px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;display:flex;align-items:center;gap:9px;cursor:pointer;transition:.18s;}
  .step:hover{border-color:var(--line2);}
  .step.active{border-color:var(--brand);background:var(--brand-ll);box-shadow:0 0 0 3px rgba(15,118,110,.12);}
  .step.done{border-color:var(--brand-l);background:var(--brand-ll);}
  .step .n{width:24px;height:24px;border-radius:999px;background:var(--line);color:var(--ink2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex:0 0 auto;}
  .step.active .n,.step.done .n{background:var(--brand);color:#fff;}
  .step .t{font-size:12px;font-weight:700;color:var(--ink2);white-space:nowrap;}
  .step.active .t{color:var(--brand-d);}

  /* ===== Cards ===== */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;}
  .card + .card{margin-top:12px;}
  .sec-title{font-size:15px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:9px;margin:2px 0 4px;}
  .sec-title .bar{width:4px;height:18px;border-radius:4px;background:var(--brand);display:inline-block;}
  .sec-desc{font-size:12.5px;color:var(--muted);margin:0 0 12px;}

  /* ===== Region grid ===== */
  .region-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;}
  .region-card{border:1.5px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;transition:.16s;background:#fff;display:flex;flex-direction:column;gap:6px;}
  .region-card:hover{border-color:var(--brand);transform:translateY(-1px);box-shadow:var(--shadow);}
  .region-card.sel{border-color:var(--brand);background:var(--brand-ll);box-shadow:0 0 0 3px rgba(15,118,110,.13);}
  .region-card .ic{width:38px;height:38px;border-radius:11px;background:var(--brand-l);color:var(--brand-d);display:flex;align-items:center;justify-content:center;}
  .region-card .nm{font-weight:800;font-size:13.5px;}
  .region-card .hn{font-size:11.5px;color:var(--muted);line-height:1.6;}

  /* ===== Disease cards ===== */
  .dz-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;}
  .dz-card{border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;cursor:pointer;transition:.16s;background:#fff;}
  .dz-card:hover{border-color:var(--brand);box-shadow:var(--shadow);}
  .dz-card.sel{border-color:var(--brand);background:var(--brand-ll);box-shadow:0 0 0 3px rgba(15,118,110,.13);}
  .dz-card .nm{font-weight:800;font-size:13px;display:flex;align-items:flex-start;gap:7px;}
  .dz-card .dc{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.6;}
  .dz-card .src{display:inline-block;font-size:10px;font-weight:700;background:var(--blue-l);color:var(--blue);border-radius:999px;padding:1px 8px;margin-top:6px;}

  /* ===== Checkboxes ===== */
  .chk{display:flex;align-items:flex-start;gap:10px;padding:9px 12px;border:1.5px solid var(--line);border-radius:11px;cursor:pointer;transition:.14s;background:#fff;font-size:13px;line-height:1.7;}
  .chk:hover{border-color:var(--line2);}
  .chk.on{border-color:var(--brand);background:var(--brand-ll);}
  .chk .box{width:19px;height:19px;border-radius:6px;border:2px solid var(--line2);flex:0 0 auto;margin-top:2px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:900;transition:.14s;}
  .chk.on .box{background:var(--brand);border-color:var(--brand);}
  .chk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px;}
  .chk-grid.single{grid-template-columns:1fr;}
  .grp-label{font-size:12px;font-weight:800;color:var(--brand-d);margin:14px 2px 6px;display:flex;align-items:center;gap:6px;}

  /* ===== Plan ===== */
  .plan-card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;}
  .plan-head{padding:14px 18px;background:linear-gradient(135deg,#0F766E,#0D9488);color:#fff;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .plan-head .nm{font-size:16px;font-weight:800;}
  .plan-head .src-badge{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);border-radius:999px;font-size:10.5px;padding:2px 10px;font-weight:700;}
  .plan-body{padding:8px 18px 16px;}
  .psec{border:1px solid var(--line);border-radius:12px;margin-top:12px;overflow:hidden;}
  .psec .ph{display:flex;align-items:center;gap:8px;padding:9px 14px;font-weight:800;font-size:13px;background:var(--bg);border-bottom:1px solid var(--line);}
  .psec .pb{padding:11px 14px;display:flex;flex-direction:column;gap:7px;}
  .psec .pb ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px;}
  .psec .pb li{position:relative;padding-inline-start:20px;font-size:13px;line-height:1.8;}
  .psec .pb li:before{content:"";position:absolute;inset-inline-start:2px;top:10px;width:8px;height:8px;border-radius:3px;background:var(--brand-l);border:1.5px solid var(--brand);}
  .psec.red .ph{background:var(--red-l);color:var(--red);border-color:#FECACA;}
  .psec.red{border-color:#FECACA;}
  .psec.red .pb li:before{background:var(--red-l);border-color:var(--red);}
  .psec.amber .ph{background:var(--amber-l);color:var(--amber);border-color:#FDE68A;}
  .psec.amber{border-color:#FDE68A;}
  .psec.amber .pb li:before{background:var(--amber-l);border-color:var(--amber);}
  .psec.blue .ph{background:var(--blue-l);color:var(--blue);border-color:#BFDBFE;}
  .psec.blue{border-color:#BFDBFE;}
  .psec.blue .pb li:before{background:var(--blue-l);border-color:var(--blue);}
  .psec.green .ph{background:var(--green-l);color:var(--green);border-color:#BBF7D0;}
  .psec.green{border-color:#BBF7D0;}
  .psec.green .pb li:before{background:var(--green-l);border-color:var(--green);}

  /* phases */
  .phase-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px;}
  .phase{border:1px solid var(--line);border-radius:13px;padding:12px;background:#fff;}
  .phase .pt{display:flex;align-items:center;gap:8px;font-weight:800;font-size:12.5px;margin-bottom:8px;color:var(--ink);}
  .phase .pt .pn{width:22px;height:22px;border-radius:7px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;flex:0 0 auto;}
  .phase ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;}
  .phase li{font-size:11.8px;line-height:1.75;color:var(--ink2);padding-inline-start:14px;position:relative;}
  .phase li:before{content:"•";position:absolute;inset-inline-start:1px;color:var(--brand);font-weight:900;}

  /* findings chips */
  .chip{display:inline-flex;align-items:center;gap:5px;background:var(--brand-ll);border:1px solid var(--brand-l);color:var(--brand-d);border-radius:999px;padding:3px 11px;font-size:11.5px;font-weight:600;}
  .chip.warn{background:var(--red-l);border-color:#FECACA;color:var(--red);}

  /* history grid */
  .hx-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;}
  .hx-item{display:flex;gap:9px;padding:9px 12px;border:1.5px solid var(--line);border-radius:11px;cursor:pointer;background:#fff;transition:.14s;font-size:12.5px;font-weight:600;align-items:center;}
  .hx-item:hover{border-color:var(--line2);}
  .hx-item.on{border-color:var(--amber);background:var(--amber-l);box-shadow:0 0 0 3px rgba(180,83,9,.1);color:var(--amber);}
  .hx-item .bx{width:18px;height:18px;border-radius:6px;border:2px solid var(--line2);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;font-weight:900;}
  .hx-item.on .bx{background:var(--amber);border-color:var(--amber);}

  /* buttons */
  .btn{display:inline-flex;align-items:center;gap:8px;border-radius:12px;padding:11px 22px;font-weight:800;font-size:13.5px;cursor:pointer;border:1.5px solid transparent;transition:.16s;}
  .btn-p{background:var(--brand);color:#fff;box-shadow:0 4px 14px -6px rgba(15,118,110,.5);}
  .btn-p:hover{background:var(--brand-d);}
  .btn-o{background:#fff;color:var(--brand-d);border-color:var(--line2);}
  .btn-o:hover{border-color:var(--brand);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btn-lg{width:100%;justify-content:center;padding:14px;font-size:15px;}

  /* empty */
  .empty{text-align:center;padding:34px 16px;color:var(--muted);font-size:13px;}

  /* summary modal print */
  .note-box{background:var(--blue-l);border:1px solid #BFDBFE;border-radius:12px;padding:11px 14px;font-size:12.5px;color:var(--blue);line-height:1.9;}
  .warn-box{background:var(--red-l);border:1px solid #FECACA;border-radius:12px;padding:11px 14px;font-size:12.5px;color:var(--red);line-height:1.9;}
  .amber-box{background:var(--amber-l);border:1px solid #FDE68A;border-radius:12px;padding:11px 14px;font-size:12.5px;color:var(--amber);line-height:1.9;}

  /* patients list */
  .pat-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-top:8px;flex-wrap:wrap;}
  .pat-row .nm{font-weight:800;font-size:13.5px;}
  .pat-row .dt{font-size:11.5px;color:var(--muted);}
  .mini-tag{font-size:10.5px;background:var(--brand-l);color:var(--brand-d);border-radius:999px;padding:2px 9px;font-weight:700;}

  /* footer */
  .foot{text-align:center;color:var(--muted);font-size:11.5px;padding:26px 16px 34px;line-height:2;}
  .foot b{color:var(--ink2);}

  @media print{
    body{background:#fff;}
    .no-print{display:none !important;}
    .hdr,.steps,.foot{display:none !important;}
    .card,.plan-card{box-shadow:none;border:1px solid #ddd;break-inside:avoid;}
    .wrap{max-width:100%;}
    .phase-grid{grid-template-columns:1fr 1fr;}
  }
</style>
</head>
<body>
<div id="root"><div id="boot-msg">در حال بارگذاری توان‌یار کلینیک…</div></div>
<script>
  window.addEventListener("error", function (e) {
    var el = document.getElementById("boot-msg");
    if (el && (!window.React || !window.ReactDOM || !window.Babel)) {
      el.innerHTML = "بارگذاری کتابخانه‌های لازم (React/Babel) از CDN ناموفق بود.<br/>لطفاً از اتصال اینترنت خود مطمئن شوید و صفحه را دوباره بارگذاری کنید.";
    }
  }, true);
  window.storage = {
    async get(key){ try{ var r=window.localStorage.getItem(key); return r===null?null:{key:key,value:r}; }catch(e){ return null; } },
    async set(key,value){ try{ window.localStorage.setItem(key,value); return {ok:1}; }catch(e){ return {error:e&&e.name}; } },
    async del(key){ try{ window.localStorage.removeItem(key); return {ok:1}; }catch(e){ return null; } }
  };
</script>

const Dumbbell = (p) => <Ic {...p}><rect x="1.5" y="9" width="3" height="6" rx="1" /><rect x="19.5" y="9" width="3" height="6" rx="1" /><line x1="6" y1="12" x2="18" y2="12" /><rect x="4.5" y="7" width="2.5" height="10" rx="1" /><rect x="17" y="7" width="2.5" height="10" rx="1" /></Ic>;
const Target = (p) => <Ic {...p}><circle cx="12" cy="12" r="8.5" /><circle cx="12" cy="12" r="5" /><circle cx="12" cy="12" r="1.4" fill={p.color || "currentColor"} /></Ic>;

const Sparkles = (p) => <Ic {...p}><path d="M11 3 12.4 8 17 9.4 12.4 10.8 11 16 9.6 10.8 5 9.4 9.6 8Z" /><path d="M18.5 14 19.2 16.4 21.5 17.2 19.2 18 18.5 20.4 17.8 18 15.5 17.2 17.8 16.4Z" /></Ic>;
const Info = (p) => <Ic {...p}><circle cx="12" cy="12" r="9.2" /><line x1="12" y1="11" x2="12" y2="16.5" /><circle cx="12" cy="7.6" r="0.6" fill={p.color || "currentColor"} /></Ic>;

const STEPS = [

const STORAGE_KEY = "tav_plans_v2";

function loadRecords() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return [];
    var arr = JSON.parse(raw);
    return Array.isArray(arr) ? arr : [];
  } catch (e) { return []; }
}
function saveRecords(arr) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(arr)); } catch (e) {}
}

function HistoryEffects(sel) {
  var notes = [];
  sel.forEach(function (id) {
    var it = HISTORY_ITEMS.find(function (h) { return h.id === id; });
    if (it) notes.push({ id: it.id, label: it.label, note: it.note });
  });
  return notes;
}

function buildPlan(disease, findings, history) {
  var redSelected = findings.filter(function (f) { return f.red; });
  var yellowSelected = findings.filter(function (f) { return f.yellow; });
  var hx = HistoryEffects(history);
  var precautions = [];
  hx.forEach(function (h) {
    if (h.id === "anticoag") precautions.push("مصرف ضدانعقاد: قبل از هر تزریق تهاجمی (داخل مفصلی/اپیدورال/تریگرپوینت) ارزیابی INR و خطر خونریزی؛ EMG سوزنی با فشار کافی نسبتاً ایمن است.");
    if (h.id === "steroid") precautions.push("مصرف کورتیکواستروئید: تزریق مکرر استروئید می‌تواند تاندون را ضعیف کند؛ قند خون را پایش کنید.");
    if (h.id === "diabetes") precautions.push("دیابت: قند خون را قبل/حین/بعد ورزش چک کنید؛ اگر قند ناشتا >۴۰۰ باشد ورزش ممنوع؛ پای دیابتی و نوروپاتی را بررسی کنید.");
    if (h.id === "osteoporosis") precautions.push("پوکی استخوان: مانورهای HVLA و فلکشن شدید ستون ممنوع؛ ورزش اکستنشن کمر و تقویت با مقاومت ملایم توصیه می‌شود.");
    if (h.id === "preg") precautions.push("بارداری: کمربند باریک برای درد SIJ و عریض برای درد ستون؛ آب‌درمانی و فیزیوتراپی اختصاصی.");
    if (h.id === "heart") precautions.push("بیماری قلبی: شدت ورزش را با RPE تنظیم کنید نه ضربان قلب؛ از برنامه توانبخشی قلبی فازی پیروی کنید.");
    if (h.id === "renal") precautions.push("نارسایی کلیه: دوز گاباپنتین/پره‌گابالین و NSAIDs را بر اساس GFR تنظیم کنید.");
    if (h.id === "opioid") precautions.push("مصرف اپیوئید: ترکیب با بنزودیازپین خطرناک است؛ درمان را چندوجهی و غیراپیوئیدی هدایت کنید.");
    if (h.id === "psych") precautions.push("فلگ زرد روان‌شناختی: CBT، ACT، پِیسینگ فعالیت و انتظارات واقع‌بینانه را در پلن بگنجانید.");
    if (h.id === "cancer") precautions.push("سابقه سرطان: درد جدید شبانه/کاهش وزن = فلگ قرمز؛ مانیپولاسیون ممنوع.");
    if (h.id === "fall") precautions.push("سابقه افتادن/اختلال تعادل: تمرین تعادل و پروپریوسپشن و ارزیابی وسایل کمکی را اضافه کنید.");
    if (h.id === "obesity") precautions.push("چاقی: کاهش وزن ۵-۱۰٪ اثر درمانی بارز دارد؛ ورزش کم‌برخورد ترجیح دارد.");
    if (h.id === "neuro") precautions.push("بیماری نورولوژیک: اسپاستیسیتی و خطر افتادن؛ ارتز و توانبخشی اختصاصی را در نظر بگیرید.");
    if (h.id === "smoker") precautions.push("مصرف دخانیات: ترمیم بافت را به تأخیر می‌اندازد؛ ترک را توصیه کنید.");
  });
  return { redSelected: redSelected, yellowSelected: yellowSelected, hx: hx, precautions: precautions };
}

/* ——————— استپر ——————— */
function StepsBar({ step, setStep, canGo }) {
  return (
    <div className="wrap">
      <div className="steps">
        {STEPS.map(function (s, i) {
          var cls = "step";
          if (step === s.id) cls += " active";
          else if (STEPS.findIndex(function (x) { return x.id === step; }) > i) cls += " done";
          var locked = !canGo[s.id] && STEPS.findIndex(function (x) { return x.id === step; }) < i;
          return (
            <div key={s.id} className={cls} onClick={function () { if (!locked) setStep(s.id); }} style={locked ? { opacity: .5, cursor: "not-allowed" } : {}}>
              <div className="n">{step === s.id ? toFa(i + 1) : <Check size={13} />}</div>
              <div className="t">{s.title}</div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

          })}
        </div>
        <div style={{ marginTop: 12, fontSize: 12.5, color: "var(--ink2)" }}>
          <div className="row" style={{ gap: 6, marginBottom: 4 }}><b>بیمار:</b>
            {patient && patient.name ? patient.name + (patient.age ? "، " + toFa(patient.age) + " ساله" : "") : "—"}
          </div>
          <button className="btn btn-o" style={{ padding: "7px 14px", fontSize: 12 }} onClick={onEditPatient}><Edit3 size={14} /> {patient && patient.name ? "ویرایش اطلاعات بیمار" : "ثبت اطلاعات بیمار"}</button>
        </div>
      </div>

      <div className="row mt16" style={{ justifyContent: "space-between" }}>
        <button className="btn btn-o" onClick={onBack}><ChevronRight size={16} /> بازگشت</button>
        <button className="btn btn-p" onClick={onGenerate} disabled={fCount === 0}>
          <Sparkles size={16} /> تولید پلن تشخیصی/درمانی ({toFa(fCount)} مورد انتخابی)
        </button>
      </div>
    </div>
  );
}

/* ——————— پلن ——————— */
function Psec({ title, tone, icon, children }) {
  return (
    <div className={"psec" + (tone ? " " + tone : "")}>
      <div className="ph">{icon}{title}</div>
      <div className="pb">{children}</div>
    </div>
  );
}

function PhaseGrid({ phases }) {
  return (
    <div className="phase-grid">
      {phases.map(function (p, i) {
        return (
          <div key={i} className="phase">
            <div className="pt"><span className="pn">{toFa(i + 1)}</span>{p.phase}</div>
            <ul>{p.items.map(function (it, j) { return <li key={j}>{it}</li>; })}</ul>
          </div>
        );
      })}
    </div>
  );
}

function PlanStep({ regionId, diseaseId, findings, history, patient, onBack, onEdit, onNew, onPrint }) {
  var reg = DISEASE_MAP[regionId];
  var dz = reg.diseases.find(function (d) { return d.id === diseaseId; });
  var plan = buildPlan(dz, findings, history);
  var selFindings = dz.findings.filter(function (f) { return findings.indexOf(f.id) >= 0; });
  return (
    <div className="wrap mt16">
      <div className="plan-card">
        <div className="plan-head">
          <span className="nm">{dz.name}</span>
          <span className="src-badge">Braddom's PM&amp;R — ویرایش ۷</span>
          <span className="src-badge">ناحیه: {reg.label}</span>
        </div>
        <div className="plan-body">
          {patient && patient.name ? (
            <div className="row mt12" style={{ gap: 8 }}>
              <span className="chip"><User size={12} /> {patient.name}{patient.age ? "، " + toFa(patient.age) + " ساله" : ""}{patient.sex ? "، " + patient.sex : ""}</span>
              <span className="chip"><Calendar size={12} /> {todayFa()}</span>
            </div>
          ) : null}

          {selFindings.length > 0 ? (
            <Psec title="یافته‌های انتخابی" icon={<ClipboardList size={15} />}>
              <div className="row" style={{ gap: 6 }}>
                {selFindings.map(function (f) { return <span key={f.id} className="chip">{f.label}</span>; })}
              </div>
            </Psec>
          ) : null}

          {plan.redSelected.length > 0 ? (
            <Psec tone="red" title="هشدار — فلگ‌های قرمز (بررسی فوری)" icon={<AlertTriangle size={16} />}>
              <ul>
                {plan.redSelected.map(function (f) {
                  return <li key={f.id}>{f.label} — نیازمند ارزیابی فوری (تصویربرداری/ارجاع) پیش از ادامهٔ توانبخشی</li>;
                })}
                {dz.redFlags.map(function (r, i) {
                  var key = "rf" + i;
                  return <li key={key}>{r} — در صورت حضور، ارجاع فوری.</li>;
                })}
              </ul>
            </Psec>
          ) : null}

          {plan.precautions.length > 0 ? (
            <Psec tone="amber" title="ملاحظات سوابق بیمار (در پلن اعمال شد)" icon={<Shield size={15} />}>
              <ul>{plan.precautions.map(function (p, i) { return <li key={i}>{p}</li>; })}</ul>
            </Psec>
          ) : null}

          <Psec title="پلن تشخیصی — ارزیابی و تأیید" icon={<Stethoscope size={15} />}>
            <ul>{dz.plan.diagnosis.map(function (d, i) { return <li key={i}>{d}</li>; })}</ul>
          </Psec>

          <Psec tone="blue" title="درمان دارویی و غیردارویی" icon={<Pill size={15} />}>
            <ul>{dz.plan.treatment.map(function (d, i) { return <li key={i}>{d}</li>; })}</ul>
          </Psec>

          <Psec tone="green" title="ورزش‌های توانبخشی (مرحله‌بندی‌شده بر اساس برادوم)" icon={<Dumbbell size={15} />}>
            <PhaseGrid phases={dz.plan.exercises} />
          </Psec>

          <Psec title="زمان ارجاع تخصصی" icon={<Flag size={15} />}>
            <ul>{dz.plan.referral.map(function (d, i) { return <li key={i}>{d}</li>; })}</ul>
          </Psec>

          {plan.hx.length > 0 ? (
            <div className="amber-box mt12"><b>سوابق ثبت‌شده:</b> {plan.hx.map(function (h) { return h.label; }).join("، ")}</div>
          ) : null}

          <div className="note-box mt12">
            <b>نکته:</b> این پلن خلاصهٔ بالینی بر اساس Braddom's Physical Medicine and Rehabilitation (ویرایش هفتم، ۲۰۲۶) تولید شده و جایگزین قضاوت بالینی پزشک نیست. پیش از تجویز هر دارو/تزریق، موارد منع مصرف بیمار را بررسی کنید.
          </div>
        </div>
      </div>

      <div className="row mt16" style={{ justifyContent: "space-between" }}>
        <div className="row">
          <button className="btn btn-o" onClick={onBack}><ChevronRight size={16} /> ویرایش یافته‌ها</button>
          <button className="btn btn-o no-print" onClick={onPrint}><Printer size={16} /> چاپ/PDF</button>
        </div>
        <button className="btn btn-p" onClick={onNew}><Plus size={16} /> پروندهٔ جدید</button>
      </div>
    </div>
  );
}

/* ——————— مودال بیمار ——————— */
function PatientModal({ patient, onSave, onClose }) {
  var [name, setName] = React.useState(patient ? patient.name : "");
  var [age, setAge] = React.useState(patient ? patient.age : "");
  var [sex, setSex] = React.useState(patient ? patient.sex : "");
  var [note, setNote] = React.useState(patient ? patient.note : "");
  function submit() {
    onSave({ name: name.trim(), age: age.trim(), sex: sex, note: note.trim() });
  }
  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(15,23,42,.5)", zIndex: 100, display: "flex", alignItems: "center", justifyContent: "center", padding: 16 }} onClick={onClose}>
      <div className="card" style={{ maxWidth: 460, width: "100%" }} onClick={function (e) { e.stopPropagation(); }}>
        <div className="sec-title"><span className="bar" />اطلاعات بیمار</div>
        <div className="col mt12">
          <label style={{ fontSize: 12, fontWeight: 700 }}>نام و نام خانوادگی</label>
          <input value={name} onChange={function (e) { setName(e.target.value); }} placeholder="مثلاً: سارا احمدی" style={{ padding: "10px 12px", borderRadius: 10, border: "1.5px solid var(--line2)", fontFamily: "inherit", fontSize: 13.5 }} />
          <div className="row" style={{ gap: 8 }}>
            <div style={{ flex: 1 }}>
              <label style={{ fontSize: 12, fontWeight: 700 }}>سن</label>
              <input value={age} onChange={function (e) { setAge(e.target.value); }} placeholder="مثلاً ۴۵" inputMode="numeric" style={{ width: "100%", padding: "10px 12px", borderRadius: 10, border: "1.5px solid var(--line2)", fontFamily: "inherit", fontSize: 13.5, marginTop: 4 }} />
            </div>
            <div style={{ flex: 1 }}>
              <label style={{ fontSize: 12, fontWeight: 700 }}>جنسیت</label>
              <select value={sex} onChange={function (e) { setSex(e.target.value); }} style={{ width: "100%", padding: "10px 12px", borderRadius: 10, border: "1.5px solid var(--line2)", fontFamily: "inherit", fontSize: 13.5, marginTop: 4, background: "#fff" }}>
                <option value="">—</option>
                <option value="زن">زن</option>
                <option value="مرد">مرد</option>
              </select>
            </div>
          </div>
          <label style={{ fontSize: 12, fontWeight: 700 }}>یادداشت بالینی</label>
          <textarea value={note} onChange={function (e) { setNote(e.target.value); }} rows={3} placeholder="تشخیص، سابقه، یا توضیحات تکمیلی…" style={{ padding: "10px 12px", borderRadius: 10, border: "1.5px solid var(--line2)", fontFamily: "inherit", fontSize: 13.5, resize: "vertical" }} />
          <button className="btn btn-p" onClick={submit}><Check size={16} /> ذخیرهٔ بیمار</button>
        </div>
      </div>
    </div>
  );
}

/* ——————— مودال بیماران ——————— */
function PatientsModal({ records, onLoad, onDelete, onClose, onNewRec }) {
  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(15,23,42,.5)", zIndex: 100, display: "flex", alignItems: "center", justifyContent: "center", padding: 16 }} onClick={onClose}>
      <div className="card" style={{ maxWidth: 560, width: "100%", maxHeight: "78vh", overflow: "auto" }} onClick={function (e) { e.stopPropagation(); }}>
        <div className="sec-title"><span className="bar" />پرونده‌های بیماران</div>
        <p className="sec-desc">پرونده‌هایی که قبلاً ذخیره شده‌اند (در همین مرورگر).</p>
        {records.length === 0 ? <div className="empty">هنوز پرونده‌ای ذخیره نشده است.</div> : null}
        {records.map(function (r, i) {
          return (
            <div key={i} className="pat-row">
              <div style={{ flex: 1 }}>
                <div className="nm">{r.patient && r.patient.name ? r.patient.name : "بیمار بدون نام"}</div>
                <div className="dt">{r.regionLabel} / {r.diseaseLabel} — {r.date}</div>
                {r.count ? <span className="mini-tag">{toFa(r.count)} یافته</span> : null}
              </div>
              <button className="btn btn-o" style={{ padding: "6px 13px", fontSize: 12 }} onClick={function () { onLoad(r.id); }}><BookOpen size={13} /> باز کردن</button>
              <button className="btn btn-o" style={{ padding: "6px 10px", fontSize: 12, color: "var(--red)", borderColor: "#FECACA" }} onClick={function () { onDelete(r.id); }}><Trash2 size={13} /></button>
            </div>
          );
        })}
        <button className="btn btn-p mt12" style={{ width: "100%", justifyContent: "center" }} onClick={onNewRec}><Plus size={16} /> پروندهٔ جدید</button>
      </div>
    </div>
  );
}

/* ——————— اپلیکیشن ——————— */
function App() {
  var [step, setStep] = React.useState("region");
  var [regionId, setRegionId] = React.useState(null);
  var [diseaseId, setDiseaseId] = React.useState(null);
  var [findings, setFindings] = React.useState([]);
  var [history, setHistory] = React.useState([]);
  var [patient, setPatient] = React.useState(null);
  var [showPatient, setShowPatient] = React.useState(false);
  var [showList, setShowList] = React.useState(false);
  var [records, setRecords] = React.useState(loadRecords());
  var [currentId, setCurrentId] = React.useState(null);

  useEffect(function () { saveRecords(records); }, [records]);

  function toggleFinding(id) {
    setFindings(function (prev) {
      return prev.indexOf(id) >= 0 ? prev.filter(function (x) { return x !== id; }) : prev.concat(id);
    });
  }
  function toggleHistory(id) {
    setHistory(function (prev) {
      return prev.indexOf(id) >= 0 ? prev.filter(function (x) { return x !== id; }) : prev.concat(id);
    });
  }
  function goRegion(rid) {
    setRegionId(rid);
    setDiseaseId(null);
    setFindings([]);
    setStep("disease");
  }
  function goDisease(did) {
    setDiseaseId(did);
    setFindings([]);
    setStep("eval");
  }
  function generate() {
    var reg = DISEASE_MAP[regionId];
    var dz = reg.diseases.find(function (d) { return d.id === diseaseId; });
    var rec = {
      id: currentId || ("p" + Date.now()),
      date: todayFa(),
      regionLabel: reg.label,
      diseaseId: dz.id,
      diseaseLabel: dz.name,
      findings: findings,
      history: history,
      patient: patient,
      count: findings.length,
    };
    setRecords(function (prev) {
      var rest = prev.filter(function (r) { return r.id !== rec.id; });
      return rest.concat(rec);
    });
    setCurrentId(rec.id);
    setStep("plan");
    window.scrollTo(0, 0);
  }
  function loadRec(id) {
    var rec = records.find(function (r) { return r.id === id; });
    if (!rec) return;
    setRegionId(Object.keys(DISEASE_MAP).find(function (k) { return DISEASE_MAP[k].label === rec.regionLabel; }) || null);
    setDiseaseId(rec.diseaseId);
    setFindings(rec.findings || []);
    setHistory(rec.history || []);
    setPatient(rec.patient || null);
    setCurrentId(rec.id);
    setShowList(false);
    setStep("plan");
  }
  function deleteRec(id) {
    setRecords(function (prev) { return prev.filter(function (r) { return r.id !== id; }); });
  }
  function newRec() {
    setRegionId(null); setDiseaseId(null); setFindings([]); setHistory([]);
    setPatient(null); setCurrentId(null); setShowList(false); setShowPatient(false);
    setStep("region");
    window.scrollTo(0, 0);
  }
  function savePatient(p) {
    setPatient(p);
    setShowPatient(false);
  }
  function backFromEval() { setStep("disease"); }

  var canGo = { region: true, disease: !!regionId, eval: !!diseaseId, plan: !!diseaseId };
  var reg = regionId ? DISEASE_MAP[regionId] : null;
  var dz = reg && diseaseId ? reg.diseases.find(function (d) { return d.id === diseaseId; }) : null;

  return (
    <div>
      <Header onPatients={function () { setShowList(true); }} onNew={newRec} recCount={records.length} />
      <StepsBar step={step} setStep={setStep} canGo={canGo} />

      {step === "region" ? <RegionStep regionId={regionId} onSelect={goRegion} /> : null}
      {step === "disease" && reg ? <DiseaseStep regionId={regionId} diseaseId={diseaseId} onSelect={goDisease} onBack={function () { setStep("region"); }} /> : null}
      {step === "eval" && dz ? (
        <EvalStep
          regionId={regionId} diseaseId={diseaseId} findings={findings}
          onToggleFinding={toggleFinding} history={history} onToggleHistory={toggleHistory}
          patient={patient} onEditPatient={function () { setShowPatient(true); }}
          onGenerate={generate} onBack={backFromEval}
        />
      ) : null}
      {step === "plan" && dz ? (
        <PlanStep
          regionId={regionId} diseaseId={diseaseId} findings={findings} history={history} patient={patient}
          onBack={function () { setStep("eval"); }} onEdit={function () { setShowPatient(true); }}
          onNew={newRec} onPrint={function () { window.print(); }}
        />
      ) : null}

      {showPatient ? (
        <PatientModal
          patient={patient}
          onSave={savePatient}
          onClose={function () { setShowPatient(false); }}
        />
      ) : null}
      {showList ? (
        <PatientsModal
          records={records.slice().reverse()}
          onLoad={loadRec}
          onDelete={deleteRec}
          onClose={function () { setShowList(false); }}
          onNewRec={newRec}
        />
      ) : null}

      <div className="foot no-print">
        <b>توان‌یار کلینیک</b> — دستیار تشخیصی و تجویز توانبخشی بر پایهٔ Braddom's Physical Medicine &amp; Rehabilitation (ویرایش ۷، ۲۰۲۶).<br />
        این ابزار صرفاً کمک‌بالینی است و جایگزین قضاوت پزشک نیست.
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
